<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mannschaftskasse Präsentation</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: Bühne für den Beamer – links die Szenen, mittig das Handy mit der Live-Demo, rechts die Erklärung. Bewusst dunkel in beiden Themes. */
:root{
  --bg:#0A1430; --panel:#111D3F; --ink:#EEF2FA; --muted:#9FB0D3; --line:#24335E; --accent:#FFD21F; --on-accent:#0B1530;
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  background-image:repeating-linear-gradient(115deg,transparent 0 46px,#ffffff06 46px 70px)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{min-height:100%;display:grid;grid-template-columns:minmax(190px,300px) auto minmax(260px,1fr);gap:clamp(20px,3vw,48px);align-items:center;
  padding-block:clamp(16px,3vh,32px);padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto}

/* Szenenliste */
.scenes{display:grid;gap:14px;align-self:center;min-width:0}
.brand .k{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(24px,2.2vw,34px);overflow-wrap:anywhere;line-height:.95;margin:4px 0 0;text-transform:uppercase}
.brand h1 em{font-style:normal;color:var(--accent)}
.brand::after{content:"";display:block;width:56px;height:5px;background:var(--accent);margin-top:12px}
ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.sc{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:7px 10px;color:var(--muted)}
.sc .n{font-family:var(--display);font-size:16px;text-align:right}
.sc .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc:hover{background:#ffffff0a;color:var(--ink)}
.sc[aria-current="step"]{background:var(--panel);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.sc[aria-current="step"] .n{color:var(--accent)}

/* Handy */
.center{display:grid;place-items:center;min-width:0}
.pw{position:relative}
.phone{position:absolute;left:0;top:0;width:414px;height:868px;transform-origin:0 0;border-radius:56px;background:#05080F;padding:12px;
  box-shadow:0 0 0 2px #2A365A,0 30px 80px #000a}
.phone::before{content:"";position:absolute;top:22px;left:50%;transform:translateX(-50%);width:110px;height:30px;border-radius:16px;background:#05080F;z-index:2}
.phone iframe{display:block;width:390px;height:844px;border:0;border-radius:44px;background:#E9EDF5}

/* Erklärung */
.explain{display:grid;gap:16px;align-self:center;min-width:0;max-width:560px}
.role{justify-self:start;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;border-radius:6px;padding:5px 10px;background:var(--panel);color:var(--accent);border:1px solid var(--line)}
.explain h2{font-family:var(--display);font-weight:400;font-size:clamp(32px,3.6vw,54px);line-height:1;margin:0;text-transform:uppercase;text-wrap:balance}
.lead{font-size:clamp(17px,1.4vw,21px);color:var(--ink);margin:0}
.explain ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.explain li{display:grid;grid-template-columns:18px 1fr;gap:10px;font-size:clamp(15px,1.15vw,18px);color:var(--muted)}
.explain li::before{content:"";width:10px;height:10px;margin-top:.45em;background:var(--accent);transform:rotate(45deg)}
.nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.btn{border:0;border-radius:8px;padding:11px 18px;font-weight:700;background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.count{font-family:var(--display);font-size:20px;color:var(--muted);margin-left:4px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.tools .btn{padding:7px 12px;font-size:13px}
kbd{font-family:var(--body);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 6px;color:var(--ink)}

@media (max-width:820px){
  .stage{grid-template-columns:1fr;justify-items:center}
  .explain{order:1;justify-self:stretch;max-width:none}
  .center{order:2}
  .scenes{order:3;justify-self:stretch}
}
@media (prefers-reduced-motion:no-preference){.sc{transition:background .15s,color .15s}}
</style>
</head>
<body>

<div class="stage">
  <aside class="scenes" aria-label="Szenen">
    <div class="brand"><div class="k">Vorstellung</div><h1>Mannschafts<wbr><em>kasse</em></h1></div>
    <ol id="list"></ol>
  </aside>
  <div class="center"><div class="pw" id="pw"><div class="phone" id="phone"><iframe id="app" src="demo.html" title="Demo der App"></iframe></div></div></div>
  <section class="explain" aria-live="polite">
    <span class="role" id="role"></span>
    <h2 id="title"></h2>
    <p class="lead" id="lead"></p>
    <ul id="points"></ul>
    <div class="nav">
      <button class="btn ghost" id="prev">‹ Zurück</button>
      <button class="btn" id="next">Weiter ›</button>
      <span class="count" id="count"></span>
    </div>
    <div class="tools">
      <button class="btn ghost" id="full">Vollbild</button>
      <button class="btn ghost" id="reset">Demo zurücksetzen</button>
      <span><kbd>←</kbd> <kbd>→</kbd> blättern · <kbd>F</kbd> Vollbild</span>
    </div>
  </section>
</div>

<script>
const ROLES={admin:'Admin · Kassenwart',trainer:'Admin · Trainer',player:'Spieler-Sicht',public:'Öffentlich, ohne Code'};
const SCENES=[
  {role:'admin',view:'home',title:'Alles auf einen Blick',lead:'Die Übersicht zeigt sofort, was offen ist und was als Nächstes ansteht.',
   points:['Drei Kassen mit offenem Betrag und Bezahlquote','Gesamtbetrag über alle Kassen','Nächstes Spiel, Training und Event mit Umfragestand','Wer noch offen hat – mit PayPal-Link für den genauen Betrag']},
  {role:'admin',view:'drinks-form',title:'Getränketag erfassen',lead:'Nach dem Training in wenigen Sekunden eingetragen – auch bei 40 Spielern.',
   points:['Namen antippen, Ausgewählte wandern nach oben','„Wie am letzten Tag“ oder Zusagen aus der Umfrage übernehmen','Suchfeld für schnelles Finden','Der Betrag läuft unten mit']},
  {role:'admin',view:'drinks-table',title:'Monatsübersicht als Tabelle',lead:'Wer war wann da, wer hat bezahlt – kompakt pro Monat oder fürs ganze Jahr.',
   points:['Ein Punkt pro Getränketag','Bezahlt / offen mit einem Tipp umschalten','PayPal-Link mit dem offenen Betrag je Spieler','Umschalten zwischen Liste und Tabelle, Monat und Jahr']},
  {role:'player',view:'home',title:'So sieht es ein Spieler',lead:'Jeder Spieler sieht nur seinen eigenen Stand – die Beträge der anderen bleiben privat.',
   points:['Eigener offener Betrag ganz oben','Bezahlen per PayPal mit fertigem Verwendungszweck','Nächste Termine mit Umfragestand','Optional: alle Beträge für alle sichtbar schalten']},
  {role:'player',view:'events',title:'Termine & Umfragen',lead:'Spiele, Trainings und Events an einem Ort – zusagen mit einem Tipp.',
   points:['Filter: Alle, Spiele, Training, Events','Zu- oder Absage direkt am Termin','Jeder stimmt nur für sich selbst ab','Kommentare zu Terminen und Umfragen, wenn gewünscht']},
  {role:'player',view:'report',title:'Spielbericht',lead:'Ergebnis, Bericht vom Trainer und Kommentare der Mannschaft.',
   points:['Ergebnis und Bericht pro Termin','Kommentare unter dem eigenen Spitznamen','Eigene Kommentare löschbar','Berichte schreiben Admins mit Recht auf Termine']},
  {role:'player',view:'lineup',title:'Kader & Aufstellung',lead:'Der Trainer stellt die Mannschaft auf – alle sehen sie auf dem Spielfeld.',
   points:['Kader direkt aus den Zusagen übernehmen','Spielsysteme 4-4-2, 4-3-3, 4-2-3-1, 3-5-2, 9er, 7er','Rückennummern auf dem Feld','Ersatzbank und kompletter Kader darunter']},
  {role:'player',view:'shifts',scroll:'#pnl-shifts',title:'Einteilung für Events',lead:'Aufbau, Bierstand, Abbau – wer macht wann was?',
   points:['Aufgaben mit Uhrzeit und benötigter Personenzahl','Orga-Team teilt zu, Spieler tragen sich optional selbst ein','Freie Plätze auf einen Blick','Eigene Einsätze direkt auf der Übersicht']},
  {role:'trainer',view:'stats',title:'Teilnahme-Auswertung',lead:'Wer ist wie oft dabei? Getrennt nach Training und Spielen.',
   points:['Zusagequote pro Spieler über die Saison','Kader- und Startelf-Einsätze bei Spielen','Rückmeldequote der Mannschaft','Sichtbar nur für Trainer & Admins oder für alle']},
  {role:'player',view:'roster',title:'Die Mannschaft',lead:'Rückennummer, Spitzname und Alter – für alle Spieler sichtbar.',
   points:['Sortiert nach Rückennummer','Alter wird automatisch berechnet','Das Geburtsdatum selbst sehen nur Admins','Durchschnittsalter der Mannschaft']},
  {role:'admin',view:'settings',scroll:'#pnl-players',title:'Persönliche Zugänge',lead:'Jeder Spieler bekommt seinen eigenen Code – kein Konto, kein Passwort.',
   points:['Einladung per WhatsApp oder QR-Code','Status: aktiv, eingeladen, ohne Zugang','Neuer Code oder Sperren mit einem Tipp','Spitznamen statt vollständiger Namen möglich']},
  {role:'public',view:'home',title:'Öffentliche Ansicht',lead:'Optional: Wer die App ohne Code öffnet, sieht nur die Termine.',
   points:['Nächstes Spiel, Training und Event','Umfragestand als Zahl, ohne Namen','Keine Beträge, keine Notizen','Lässt sich in den Optionen ein- und ausschalten']},
  {role:'admin',view:'settings',title:'Sicherheit & Datenschutz',lead:'Bis zu vier Admins mit abgestuften Rechten, alles serverseitig geschützt.',
   points:['Admins: alles oder nur einzelne Bereiche','Regeln auf dem Server, nicht nur in der App','Änderungsprotokoll und automatische Sicherungspunkte','Daten bei Firebase in Frankfurt']}
];
let cur=0, ready=false;
const $=id=>document.getElementById(id);
const frame=$('app');
function send(extra){ if(!ready) return; const s=SCENES[cur]; try{frame.contentWindow.postMessage({mk:'present',role:s.role,view:s.view,scroll:s.scroll||'',stat:'training',...(extra||{})},'*');}catch(e){} }
function show(i,extra){
  cur=Math.max(0,Math.min(SCENES.length-1,i)); const s=SCENES[cur];
  $('role').textContent=ROLES[s.role]; $('title').textContent=s.title; $('lead').textContent=s.lead;
  $('points').innerHTML=''; s.points.forEach(t=>{const li=document.createElement('li'); li.textContent=t; $('points').appendChild(li);});
  $('count').textContent=`${cur+1} / ${SCENES.length}`;
  $('prev').disabled=cur===0; $('next').disabled=cur===SCENES.length-1;
  document.querySelectorAll('.sc').forEach((b,j)=>b.toggleAttribute('aria-current',false)||(j===cur&&b.setAttribute('aria-current','step')));
  try{history.replaceState(null,'','#s'+(cur+1))}catch(e){}
  send(extra);
}
$('list').innerHTML=SCENES.map((s,i)=>`<li><button class="sc" data-i="${i}"><span class="n">${i+1}</span><span class="t"></span></button></li>`).join('');
document.querySelectorAll('.sc .t').forEach((el,i)=>el.textContent=SCENES[i].title);
$('list').addEventListener('click',e=>{const b=e.target.closest('.sc'); if(b) show(+b.dataset.i);});
$('prev').onclick=()=>show(cur-1); $('next').onclick=()=>show(cur+1);
$('reset').onclick=()=>show(cur,{reset:true});
$('full').onclick=()=>{const d=document.documentElement; try{ (document.fullscreenElement?document.exitFullscreen():d.requestFullscreen()).catch(()=>{}); }catch(e){} };
document.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,textarea,select')) return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();show(cur+1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();show(cur-1);}
  else if(e.key==='f'||e.key==='F') $('full').click();
});
frame.addEventListener('load',()=>{ready=true; setTimeout(()=>send(),150);});
/* Handy so groß wie möglich, ohne Scrollen */
function fit(){
  const narrow=innerWidth<=820;
  const maxH=narrow?Math.min(innerHeight*0.85,868):innerHeight-64;
  const maxW=narrow?innerWidth-32:Math.max(260,innerWidth*0.36);
  const sc=Math.max(0.45,Math.min(1.1,maxH/868,maxW/414));
  $('phone').style.transform=`scale(${sc})`; $('pw').style.width=414*sc+'px'; $('pw').style.height=868*sc+'px';
}
addEventListener('resize',fit); fit();
const m=location.hash.match(/^#s(\d+)$/); show(m?(+m[1]-1):0);
</script>

</body>
</html>
