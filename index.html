/* Layout „Trikot“: Kopf in Vereinsfarbe mit Streifen, Wappen und Schloss; Spieler lesen mit persönlichem Code, Admins bearbeiten je nach Rechten */
:root{
  --bg:#E9EDF5; --surface:#FFFFFF; --ink:#0B1530; --muted:#5B6584; --line:#D5DCE8;
  --c1:#0E2F7A; --c2:#FFD21F; --c3:#D7263D; --c4:#0F8580;
  --on-c1:#FFFFFF; --on-c2:#0B1530;
  --team:#0E2F7A; --drinks:#FFD21F; --misc:#D7263D; --events:#0F8580;
  --ok:#17834A; --ok-bg:#E3F4EA; --due:#C2342B; --due-bg:#FBE7E5; --warn:#9A6400; --warn-bg:#FFF2D6;
  --chip:#E3E8F1; --paypal:#0B5CB5;
  --sec:var(--c1); --on-sec:#FFFFFF;
  --tb:0px;
  --fs:clamp(13.5px,0.45vw + 12px,15.5px); --pad:clamp(10px,2.4vw,16px); --gap:clamp(8px,1.8vw,14px);
  --h1:clamp(22px,3.2vw + 10px,38px); --big:clamp(26px,3vw + 14px,40px); --kbig:clamp(19px,2.2vw + 10px,30px);
  --gbig:clamp(28px,3.4vw + 14px,44px); --ctl:clamp(38px,6vw,44px);
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C111C; --surface:#151D2C; --ink:#E9EEF6; --muted:#97A3B8; --line:#263247;
  --ok:#4CC98A; --ok-bg:#12321F; --due:#FF7A70; --due-bg:#3A1A1A; --warn:#F2B84B; --warn-bg:#3A2C10;
  --chip:#202B3E; --paypal:#6FB2FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C111C; --surface:#151D2C; --ink:#E9EEF6; --muted:#97A3B8; --line:#263247;
  --ok:#4CC98A; --ok-bg:#12321F; --due:#FF7A70; --due-bg:#3A1A1A; --warn:#F2B84B; --warn-bg:#3A2C10;
  --chip:#202B3E; --paypal:#6FB2FF; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs);line-height:1.4;font-variant-numeric:tabular-nums;padding-bottom:var(--tb)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--c1)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* Kopf */
header{background:var(--c1);color:var(--on-c1);position:relative;overflow:hidden;
  background-image:repeating-linear-gradient(115deg,transparent 0 26px,color-mix(in srgb,var(--on-c1) 8%,transparent) 26px 40px)}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--c2)}
header .wrap{padding-block:clamp(10px,2.4vw,22px) clamp(14px,2.6vw,24px);display:flex;align-items:center;gap:clamp(10px,2vw,14px)}
.crest{height:clamp(36px,6vw,60px);width:auto;max-width:72px;object-fit:contain;flex:none;filter:drop-shadow(0 2px 4px #0004)}
.htxt{flex:1 1 auto;min-width:0}
.eyebrow{font-size:clamp(10px,1.2vw + 6px,12px);letter-spacing:.18em;text-transform:uppercase;opacity:.78;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1{font-family:var(--display);font-weight:400;font-size:var(--h1);line-height:.95;margin:3px 0 0;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance;overflow-wrap:anywhere}
h1 em{font-style:normal;color:var(--c2)}
.logo2{height:clamp(26px,4vw,40px);width:auto;max-width:96px;object-fit:contain;flex:none}
.score{display:flex;gap:18px;flex:none}
.score div{text-align:right}
.score b{display:block;font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1;color:var(--c2)}
.score span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.adminbtn{flex:none;align-self:flex-start;width:40px;height:40px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--on-c1) 45%,transparent);background:color-mix(in srgb,var(--c1) 70%,#000);color:var(--on-c1);display:grid;place-items:center;padding:0}
.adminbtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.adminbtn.on{background:var(--c2);color:var(--on-c2);border-color:var(--c2)}
.adminbtn.half{border-color:var(--c2)}
.hbtns{display:flex;gap:8px;flex:none;align-self:flex-start}
.news{display:grid;gap:6px}
.nitem{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c2);border-radius:6px;padding:8px 10px;display:grid;gap:3px;min-width:0}
.nitem .who{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;font-weight:700}
.nitem .who small{font-weight:500;color:var(--muted)}
.nitem .tx{white-space:pre-wrap;overflow-wrap:anywhere}
.nitem.pin{border-left-color:var(--due);background:color-mix(in srgb,var(--c2) 8%,var(--surface))}
.nact{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
.nact .chip{padding:4px 10px;font-size:13px}
.nact .chip.on{background:color-mix(in srgb,var(--c2) 30%,var(--surface));border-color:var(--c2);color:var(--ink);font-weight:700}
.nitem .cmts{margin-top:6px;border-top:1px dashed var(--line);padding-top:8px}
/* Chat */
.chat{display:grid;gap:3px;min-width:0}
.cday{justify-self:center;font-size:11.5px;font-weight:700;color:var(--muted);background:var(--chip);border-radius:999px;padding:2px 10px;margin:8px 0 4px}
.msg{max-width:84%;justify-self:start;background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:6px 10px 4px;min-width:0;text-align:left;font:inherit;color:inherit}
.msg.me{justify-self:end;background:color-mix(in srgb,var(--c2) 20%,var(--surface));border-color:color-mix(in srgb,var(--c2) 40%,var(--line));border-radius:14px 14px 4px 14px}
.msg.sel{outline:2px solid var(--c2);outline-offset:1px}
.msg .mn{font-size:12.5px;font-weight:700;color:var(--c1)}
.msg .mt{white-space:pre-wrap;overflow-wrap:anywhere}
.msg .mm{font-size:10.5px;color:var(--muted);text-align:right;margin-top:1px}
.msg img{display:block;max-width:100%;max-height:340px;border-radius:9px;margin:3px 0}
.msg .ph{display:grid;place-items:center;width:200px;max-width:100%;height:120px;border-radius:9px;background:var(--chip);color:var(--muted);font-size:13px;margin:3px 0}
.msg .q{border-left:3px solid var(--c2);padding:2px 7px;font-size:12.5px;color:var(--muted);background:var(--bg);border-radius:4px;margin:2px 0 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg .rx{display:inline-block;font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:0 7px;margin-top:2px}
.msg .tpoll{margin:4px 0;border-left-width:3px}
.macts{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 6px}
.macts.me{justify-self:end}
.composer{position:sticky;bottom:var(--tb,0px);z-index:6;background:var(--bg);padding:8px 0;margin-top:4px;display:grid;gap:6px;border-top:1px solid var(--line)}
.composer .crow{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:6px;align-items:end}
.composer textarea{min-height:42px;max-height:140px;resize:none;border-radius:20px;padding:10px 14px}
.composer .icon{width:42px;height:42px;border-radius:50%;font-size:19px;display:grid;place-items:center;position:relative;overflow:hidden}
.composer .icon input{position:absolute;inset:0;opacity:0}
.composer .send{border-radius:50%;width:42px;height:42px;padding:0;font-size:18px}
.creply{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12.5px;background:var(--surface);border-left:3px solid var(--c2);border-radius:4px;padding:4px 8px}
.tabbar button .tbn,nav.top button .tbn{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--due);color:#fff;font-size:10.5px;font-weight:800;line-height:1;position:absolute;top:5px;left:50%;transform:translateX(5px);background:#E5243B;box-shadow:0 0 0 2px color-mix(in srgb,var(--c1) 82%,#000);z-index:1}
nav.top button .tbn{position:static;transform:none;margin-left:5px}
.tabbar button{position:relative}
.imgview{max-width:100%;max-height:75vh;border-radius:8px;justify-self:center}
.pstate{border-radius:6px;padding:8px 10px;font-weight:600;font-size:14px;background:var(--chip)}
.pstate.ok{background:var(--ok-bg);color:var(--ok)}
.pstate.warn{background:var(--warn-bg);color:var(--warn)}
.psteps{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14px}

nav.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--c1) 78%,#000)}
nav.top .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.top .wrap::-webkit-scrollbar{display:none}
nav.top button{flex:1 0 auto;background:none;border:0;color:color-mix(in srgb,var(--on-c1) 65%,transparent);padding:12px 10px 10px;font-family:var(--display);font-size:16px;letter-spacing:.05em;text-transform:uppercase;border-bottom:4px solid transparent;white-space:nowrap}
nav.top button[aria-selected="true"]{color:var(--on-c1);border-bottom-color:var(--c2)}
nav.top:empty,.tabbar:empty{display:none!important}
.tabbar{display:none}

/* Grundbausteine */
main .wrap{padding-block:var(--gap) 40px;display:grid;grid-template-columns:minmax(0,1fr);gap:var(--gap)}
.minis>*,.kassen>*,.plist>*{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:var(--pad);display:grid;gap:clamp(8px,1.6vw,12px);min-width:0}
.panel.form{border-top:5px solid var(--sec);padding-bottom:0}
.panel.form.nobar{padding-bottom:var(--pad)}
.panel h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0;letter-spacing:.03em;line-height:1.15;text-transform:uppercase}
.panel h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:2px 0 0;font-weight:700}
.hint{color:var(--muted);font-size:13.5px;margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.tight{gap:6px}
.grow{flex:1 1 180px;min-width:0}
.spread{justify-content:space-between}
.adminbar{display:flex;justify-content:space-between;align-items:center;gap:8px;background:color-mix(in srgb,var(--c2) 22%,var(--surface));border:1px solid color-mix(in srgb,var(--c2) 70%,var(--line));border-radius:6px;padding:6px 6px 6px 12px;font-size:13px;font-weight:600;flex-wrap:wrap}
.adminbar small{display:block;font-weight:500;color:var(--muted)}
.demo{font-size:12.5px;background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:8px 12px;font-weight:600}

.summary{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:2px}
.summary .big{font-family:var(--display);font-weight:400;font-size:var(--big);line-height:1;color:var(--ink)}
.summary .lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--chip);border-radius:6px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:4px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px #0002}
.seg.wide{display:flex}
.seg.wide button{flex:1;padding-inline:6px}
.period{display:flex;align-items:center;gap:6px;margin-left:auto}
.period b{min-width:132px;text-align:center;font-family:var(--display);font-weight:400;font-size:18px;letter-spacing:.03em;text-transform:uppercase}
.icon{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:6px;display:grid;place-items:center;font-size:17px;line-height:1;flex:none;padding:0}

label.f{display:grid;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600;min-width:0}
input[type=text],input[type=email],input[type=number],input[type=date],input[type=time],input[type=search],input[type=password],select,textarea{
  display:block;width:100%;min-width:0;max-width:100%;border:1px solid var(--line);background:var(--bg);border-radius:6px;color:var(--ink);
  padding:7px 10px;min-height:var(--ctl);font-size:16px;-webkit-appearance:none;appearance:none;text-align:left}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left}
textarea{min-height:84px;resize:vertical}
.check{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.check input{width:20px;height:20px;flex:none;accent-color:var(--sec)}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.btn{border:0;border-radius:6px;padding:7px 14px;font-weight:700;background:var(--sec);color:var(--on-sec);min-height:var(--ctl);white-space:nowrap;letter-spacing:.01em;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.danger{background:var(--due);color:#fff}
.btn.soft-danger{background:var(--due-bg);color:var(--due)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn.pp{background:var(--paypal);color:#fff}
.linkbtn{border:0;background:none;padding:4px 0;color:var(--muted);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--sec);border-color:var(--sec);color:var(--on-sec)}
.nmb{border:0;background:none;padding:0;font-weight:600;text-align:left;color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nmb:hover{text-decoration:underline}
.nr{width:clamp(30px,5vw,38px);height:clamp(30px,5vw,38px);flex:none;display:grid;place-items:center;font-family:var(--display);font-size:19px;color:var(--on-c1);background:var(--c1);border-radius:4px;line-height:1}
.nr.sm{font-size:15px}
.badge{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;border-radius:4px;padding:2px 7px;background:var(--chip);color:var(--ink);white-space:nowrap}
.badge.nx{background:var(--c2);color:var(--on-c2)}
.badge.tr{background:color-mix(in srgb,var(--events) 18%,var(--surface))}

/* Zugang */
.gate{max-width:440px;justify-self:center;width:100%;border-top:6px solid var(--c1)}
.gate .crestbig{height:72px;width:auto;justify-self:center}
.codein{font-family:var(--display)!important;font-size:24px!important;letter-spacing:.12em;text-transform:uppercase;text-align:center!important}
.mine{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c2);border-radius:6px;padding:10px 12px}
.mine .lb{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mine .nm{font-weight:700}
.mine .amt{font-family:var(--display);font-weight:400;font-size:24px;line-height:1}
.mine .acts2{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}

/* Personenauswahl */
.pick-tools{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.pgh{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:2px}
.picklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.picklist:empty{display:none}
.pick{display:flex;align-items:center;gap:8px;min-height:var(--ctl);padding:6px 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);text-align:left;font-size:14.5px;font-weight:500;user-select:none;-webkit-user-select:none;min-width:0}
.pick .pn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick .box{flex:none;width:22px;height:22px;border-radius:4px;border:1.5px solid var(--line);display:grid;place-items:center;color:transparent;font-size:14px;font-weight:700}
.pick[aria-pressed="true"]{border-color:var(--sec);background:color-mix(in srgb,var(--sec) 14%,var(--surface))}
.pick[aria-pressed="true"] .box{background:var(--sec);border-color:var(--sec);color:var(--on-sec)}
.savebar{position:sticky;bottom:var(--tb);margin:4px calc(var(--pad) * -1) 0;padding:10px var(--pad) calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);border-radius:0 0 6px 6px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;z-index:3}
.savebar .count{font-weight:700}
.savebar .count small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}

/* Listen */
.list{display:grid;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:clamp(7px,1.6vw,11px) 0;border-bottom:1px solid var(--line);align-items:center}
.item .meta{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.nums{display:flex;gap:16px;justify-content:flex-end;text-align:right}
.nums small{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.nums .open{font-weight:700;color:var(--due)}
.nums .zero{color:var(--ok)}
.acts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:12.5px;border-radius:999px;padding:6px 11px;border:1px solid var(--line);background:var(--surface);font-weight:600;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:5px}
.pill.pp{background:var(--paypal);border-color:var(--paypal);color:#fff}
.pill.paid{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.pill.mark{color:var(--muted)}
.purpose{font-size:12.5px;color:var(--muted);align-self:center}

.entries{display:grid}
.entry{display:flex;justify-content:space-between;gap:8px;padding:clamp(7px,1.5vw,10px) 0;border-bottom:1px dashed var(--line);align-items:center}
.entry:last-child{border-bottom:0}
.entry .info{min-width:0;flex:1;background:none;border:0;padding:0;text-align:left}
.entry .t{font-weight:600}
.entry .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.entry .tools{display:flex;flex:none;align-items:center}
.confirm{background:var(--due-bg);border-radius:6px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-block:2px}
.confirm .t{font-weight:600}
.confirm .ask{display:flex;gap:6px;align-items:center;font-size:13.5px;color:var(--due);font-weight:600;flex-wrap:wrap}
.confirm .btn{min-height:36px;padding:5px 12px;font-size:13.5px}
.x{border:0;background:none;color:var(--muted);font-size:20px;padding:6px 10px;border-radius:6px;line-height:1}
.x:hover{color:var(--due);background:var(--due-bg)}
.edit{border:0;background:none;color:var(--muted);font-size:13px;padding:6px 8px;border-radius:6px;font-weight:600}
.edit:hover{background:var(--chip)}

/* Übersicht */
.kassen{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.k{display:grid;gap:3px;text-align:left;background:var(--surface);border:1px solid var(--line);border-bottom:5px solid var(--c);border-radius:4px;padding:clamp(8px,1.8vw,12px);min-width:0}
.k .lb{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.k .big{font-family:var(--display);font-weight:400;font-size:var(--kbig);line-height:1}
.k .s{font-size:12px;color:var(--muted)}
.bar{height:5px;border-radius:3px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.gesamt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center;background:var(--c1);color:var(--on-c1);border-radius:4px;padding:clamp(10px,2vw,14px) var(--pad);position:relative;overflow:hidden;
  background-image:repeating-linear-gradient(115deg,transparent 0 26px,color-mix(in srgb,var(--on-c1) 7%,transparent) 26px 40px)}
.gesamt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c2)}
.gesamt .lb{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.gesamt .big{font-family:var(--display);font-weight:400;font-size:var(--gbig);line-height:1;color:var(--c2)}
.gesamt .side{text-align:right;font-size:13px;line-height:1.5}
.gesamt .side b{font-weight:700}
.hd{font-family:var(--display);font-weight:400;font-size:19px;text-transform:uppercase;letter-spacing:.03em;display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:4px 0 -4px}
.hd span{font-family:var(--body);font-size:12.5px;color:var(--muted);text-transform:none;letter-spacing:0}
.plist{display:grid;gap:clamp(4px,1vw,6px)}
.sechead{display:grid;gap:8px}
.sechead .seg button[aria-pressed="true"]{box-shadow:inset 0 -3px 0 var(--c),0 1px 2px #0002}
.p{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:clamp(5px,1.2vw,8px) 12px clamp(5px,1.2vw,8px) clamp(5px,1.2vw,8px);text-align:left;width:100%}
.p .n{flex:1;min-width:0;font-weight:600}
.p .n div{font-size:12.5px;color:var(--muted);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p .v{font-family:var(--display);font-weight:400;font-size:19px;color:var(--due);white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:0}
.minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}
.mini{display:grid;grid-template-columns:50px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:0;text-align:left;overflow:hidden;min-width:0}
.mini .md{background:var(--c2);color:var(--on-c2);display:grid;align-content:center;justify-items:center;line-height:1.05;padding:6px 0}
.mini .md b{font-family:var(--display);font-weight:400;font-size:22px}
.mini .md i{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.mini.tr .md{background:var(--events);color:var(--on-sec)}
.mini.evt .md{background:var(--chip);color:var(--ink)}
.mini .mt{padding:7px 10px;min-width:0;display:grid;gap:1px}
.mini .ml{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mini .mv{font-family:var(--display);font-weight:400;font-size:17px;line-height:1.15;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .ms{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .ms b{color:var(--ink);font-weight:700}
.minirow{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;min-width:0}
.minirow .mini{flex:1 1 auto;border:0;border-radius:0}
.mnav{flex:none;width:40px;display:grid;grid-template-rows:1fr auto 1fr;border-left:1px solid var(--line)}
.mnav button{border:0;background:none;font-size:20px;font-weight:700;line-height:1;color:var(--ink);padding:0;min-height:26px}
.mnav button:disabled{color:var(--line)}
.mnav span{font-size:10.5px;font-weight:700;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}

/* Termine & Umfragen */
.evlist{display:grid;gap:8px}
.ev{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px 12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.ev.next{border-left:5px solid var(--c2)}
.ev.past{opacity:.78}
.cal{display:grid;justify-items:center;border-radius:4px;background:var(--c1);color:var(--on-c1);padding:5px 0;line-height:1.05}
.cal span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;opacity:.85}
.cal b{font-family:var(--display);font-weight:400;font-size:24px}
.ev .t{font-weight:600}
.ev .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.ev .tags{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:3px}
.evact{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.ev .confirm,.ev .poll,.ev .sq,.ev .tquick,.ev .cxnote{grid-column:1/-1}
.ev.cancel .t{text-decoration:line-through;opacity:.65}
.badge.cx{background:var(--due);color:#fff}
.badge.vin{background:color-mix(in srgb,var(--c1) 16%,var(--surface))}
.tquick{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:8px}
.tquick .seg button{padding:5px 12px;font-size:13px}
.cxnote{font-size:13px;font-weight:600;color:var(--due)}
.tpoll{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--events);border-radius:6px;padding:10px;display:grid;gap:8px;min-width:0}
.tpoll .tph{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);font-weight:600}
.tpoll .pq{font-weight:700}
.sq{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px dashed var(--line);padding-top:8px;font-size:13px}
.sq b{font-weight:700}
.shifts{display:grid;gap:8px}
.shift{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:6px;background:var(--surface);min-width:0}
.shift.shmine{border-color:var(--c2);box-shadow:inset 3px 0 0 var(--c2)}
.shift .sh{display:flex;align-items:baseline;gap:8px;justify-content:space-between;min-width:0}
.shift .sn{font-weight:700}
.shift .stime{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.shift .cap{flex:none;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--chip)}
.shift .cap.full{background:color-mix(in srgb,var(--ok) 18%,var(--surface));color:var(--ok)}
.shift .cap.low{background:color-mix(in srgb,var(--due) 14%,var(--surface));color:var(--due)}
.shift .who{display:flex;flex-wrap:wrap;gap:4px}
.shift .who span{font-size:12.5px;background:var(--bg);border-radius:4px;padding:2px 7px}
.shift .who span.me{background:var(--c2);color:var(--on-c2);font-weight:700}
.shift .who span.free{color:var(--muted);background:none;border:1px dashed var(--line);padding:1px 6px}
.shift .sact{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.shform{display:grid;gap:10px;border:1px dashed var(--line);border-radius:8px;padding:10px}
.pick .pw{display:grid;min-width:0;line-height:1.2}
.pick .tg{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.poll{border-top:1px dashed var(--line);padding-top:8px;display:grid;gap:8px}
.pq{font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:6px}
.vopt{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 10px;min-height:var(--ctl);font-weight:600;text-align:left}
.vopt i{position:absolute;left:0;bottom:0;height:4px;background:var(--sec)}
.vopt.mine{border-color:var(--sec);background:color-mix(in srgb,var(--sec) 14%,var(--surface))}
.vopt span,.vopt b{position:relative}
.vopt b{font-family:var(--display);font-weight:400;font-size:18px}
.pmeta{font-size:12.5px;color:var(--muted);display:flex;gap:4px 8px;flex-wrap:wrap;align-items:center}
.voter{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;font-size:13px;font-weight:600;color:var(--muted)}
.names{font-size:13px;display:grid;gap:5px;background:var(--bg);border-radius:6px;padding:8px 10px}
.names b{font-weight:700}
.arch{display:grid;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.arch:last-child{border-bottom:0}
.abar{display:grid;grid-template-columns:minmax(70px,auto) 1fr 32px;gap:8px;align-items:center;font-size:13px}
.abar .tr{height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
.abar .tr i{display:block;height:100%;background:var(--events)}
.abar b{text-align:right}
.qbar{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.qbar .tr{width:clamp(40px,10vw,80px);height:8px;background:var(--chip);border-radius:4px;overflow:hidden}
.qbar .tr i{display:block;height:100%;background:var(--ok)}
.qbar b{min-width:36px;text-align:right}
.statsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.statsum div{border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.statsum b{display:block;font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1}
.statsum span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Aufstellung: Spielfeld bleibt in beiden Themes grün */
.pitch{position:relative;width:100%;max-width:400px;aspect-ratio:68/100;margin:0 auto;border-radius:8px;overflow:hidden;border:2px solid #ffffffb3;
  background:repeating-linear-gradient(180deg,#2F8A4C 0 10%,#2A7F45 10% 20%)}
.pl{position:absolute;border:2px solid #ffffff8c}
.pl.half{left:0;right:0;top:50%;height:0;border-width:2px 0 0}
.pl.circ{left:50%;top:50%;width:28%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%)}
.pl.boxt{left:22%;right:22%;top:-2px;height:15%}
.pl.boxb{left:22%;right:22%;bottom:-2px;height:15%}
.pos{position:absolute;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:1px;width:24%;text-align:center}
.pos .dp{width:clamp(30px,8.5vw,42px);aspect-ratio:1;border-radius:50%;background:var(--c1);color:var(--on-c1);border:2px solid var(--c2);display:grid;place-items:center;font-family:var(--display);font-size:clamp(13px,3.6vw,18px);line-height:1;box-shadow:0 2px 4px #0005}
.pos .dp.empty{background:#ffffff26;border:2px dashed #ffffffcc;color:#fff}
.pos .pn{font-size:clamp(10px,2.7vw,12.5px);font-weight:700;color:#fff;text-shadow:0 1px 2px #000a;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pos .pr{font-size:9.5px;color:#ffffffd9;font-weight:700;letter-spacing:.06em}
.bench{display:flex;flex-wrap:wrap;gap:6px}
.bench span{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;font-size:13px;font-weight:600}
.bench button{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--line);border-radius:999px;padding:3px 10px 3px 3px;font-size:13px;font-weight:600;background:var(--surface)}
.pitch.freeedit .pos.drag{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;z-index:2}
.pitch.freeedit .pos.drag.sel .dp{outline:3px solid #fff;outline-offset:2px}
.pos.dragging{z-index:6;cursor:grabbing}
.pos.dragging .dp{transform:scale(1.15)}
.pos.out{opacity:.45}
.gp{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffffff66;transform:translate(-50%,-50%);pointer-events:none}
.freebar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13.5px;min-height:34px}
.bench .nr{width:24px;height:24px;font-size:13px;border-radius:50%}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.slot{display:grid;grid-template-columns:46px 1fr;gap:6px;align-items:center}
.slot b{font-size:12px;font-weight:700;color:var(--muted);text-align:center;background:var(--chip);border-radius:4px;padding:6px 0}

/* Tabellen */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:6px;max-width:100%}
table.grid{border-collapse:separate;border-spacing:0;font-size:13.5px;width:100%}
.grid th,.grid td{padding:5px 5px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
.grid thead th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-block:8px;background:var(--surface);vertical-align:bottom}
.grid thead th small{display:block;letter-spacing:0;text-transform:none;font-weight:500}
.grid th.ent{max-width:96px;overflow:hidden;text-overflow:ellipsis}
.grid th.now{color:var(--ink);box-shadow:inset 0 -3px 0 var(--sec)}
.grid .nm{text-align:left;position:sticky;left:0;background:var(--surface);padding:5px 10px;z-index:1;font-weight:600;border-right:1px solid var(--line);max-width:150px}
.grid .tot{text-align:right;padding-right:10px;font-weight:700}

.grid td .pp{display:block;font-size:11px;font-weight:700;margin-top:2px}

}

.imgrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

.prows{display:grid;gap:6px}

.pline{display:flex;gap:4px;align-items:center;min-width:0}

.pstat{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

.adm{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;flex-wrap:wrap}

const usable=h=>lum(h)>0.8?'#3A4456':h;
function mixHex(a,b,t){const ch=s=>{const n=parseInt(s.slice(1),16);return [n>>16,(n>>8)&255,n&255]};const A=ch(a),B=ch(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');}

function readImg(file,cb){
  if(!file) return; const r=new FileReader();
  r.onload=()=>{const img=new Image();
    img.onload=()=>{const max=240, s=Math.min(1,max/Math.max(img.width||max,img.height||max));
      const cv=document.createElement('canvas'); cv.width=Math.max(1,Math.round((img.width||max)*s)); cv.height=Math.max(1,Math.round((img.height||max)*s));
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      try{cb(cv.toDataURL('image/png'))}catch(e){toast('Bild konnte nicht verarbeitet werden')}};
    img.onerror=()=>toast('Dieses Bild kann nicht gelesen werden');
    img.src=r.result;};
  r.readAsDataURL(file);
}

async function refreshAccess(user){
  AUTH.user=user; AUTH.admin=null; AUTH.member=null; AUTH.public=false; LIVE.derivedDone=false;
  if(!user){
    if(pendingCode()){ try{await FB.signInAnonymously(FB.auth);}catch(e){AUTH.ready=true;AUTH.gate='error';AUTH.error='Anmeldung nicht möglich. Bitte später erneut versuchen.';render();} return; }
    return tryPublic();
  }
  if(!user.isAnonymous){
    const a=await FB.getDoc(D('admins',user.uid)).catch(()=>null);
    if(a&&a.exists()) AUTH.admin={uid:user.uid,...a.data()};
  }
  let m=await FB.getDoc(D('members',user.uid)).catch(()=>null);
  const code=pendingCode();
  if(code&&(!m||!m.exists()||m.data().code!==code)){
    const c=await FB.getDoc(D('codes',code)).catch(()=>null);
    if(c&&c.exists()){
      await FB.setDoc(D('members',user.uid),{p:c.data().p,code,since:FB.serverTimestamp(),seen:FB.serverTimestamp()});
      m=await FB.getDoc(D('members',user.uid)).catch(()=>null); ls.set('mk-code',code);
    }else if(code===HASH_CODE||!m||!m.exists()){
      toast('Dieser Zugangscode ist ungültig oder wurde gesperrt.'); ls.set('mk-code',null);
    }
  }
  if(m&&m.exists()){
    const md=m.data(); const c=await FB.getDoc(D('codes',md.code)).catch(()=>null);
    if(c&&c.exists()&&c.data().p===md.p){ AUTH.member={p:md.p,code:md.code}; ls.set('mk-code',md.code);
      FB.setDoc(D('members',user.uid),{p:md.p,code:md.code,seen:FB.serverTimestamp()},{merge:true}).catch(()=>{}); }
  }
  if(!AUTH.admin&&!AUTH.member){
    if(user.isAnonymous) return tryPublic();
    unsubscribeAll(); AUTH.ready=true; AUTH.gate='noaccess'; render(); return;
  }
  linkAdminPlayer();
  AUTH.gate=null; ui.adminView=!!AUTH.admin;
  subscribeAll();
}

/* ---------- Überschreib-Schutz ----------
   Jeder Bereich (team/…) trägt eine Versionsnummer „rev“. Gespeichert wird in einer Transaktion:
   Hat ein anderer Admin inzwischen geändert, werden beide Änderungen zusammengeführt statt überschrieben.
   Ohne Verbindung bleibt die Änderung auf dem Gerät und wird automatisch nachgeholt. */
const eqJ=(a,b)=>stable(a)===stable(b);
const idKey=x=>x&&typeof x==='object'&&!Array.isArray(x)?(x.id!=null?'i:'+x.id:x.date!=null?'d:'+x.date:null):null;
function merge3(base,mine,theirs,st){
  if(eqJ(mine,base)) return theirs;
  if(eqJ(theirs,base)||eqJ(theirs,mine)) return mine;
  const isObj=v=>!!v&&typeof v==='object'&&!Array.isArray(v);
  if(isObj(mine)&&isObj(theirs)){ const b=isObj(base)?base:{}, out={};
    new Set([...Object.keys(b),...Object.keys(mine),...Object.keys(theirs)]).forEach(k=>{ const v=merge3(b[k],mine[k],theirs[k],st); if(v!==undefined) out[k]=v; }); return out; }
  if(Array.isArray(mine)&&Array.isArray(theirs)){
    const all=mine.concat(theirs);
    if(all.every(x=>idKey(x))){ const B=new Map((Array.isArray(base)?base:[]).filter(idKey).map(x=>[idKey(x),x])), M=new Map(mine.map(x=>[idKey(x),x])), T=new Map(theirs.map(x=>[idKey(x),x]));
      return [...theirs.map(idKey),...mine.map(idKey).filter(k=>!T.has(k))].map(k=>merge3(B.get(k),M.get(k),T.get(k),st)).filter(v=>v!==undefined); }
    if(all.every(x=>x===null||typeof x!=='object')){ const b=Array.isArray(base)?base:[], add=mine.filter(x=>!b.includes(x)), rem=b.filter(x=>!mine.includes(x));
      return [...theirs.filter(x=>!rem.includes(x)),...add.filter(x=>!theirs.includes(x))]; }
  }
  st.conflicts++; return mine;
}
LIVE.rev={};
async function writePart(k,data,partial){
  const ref=D('team',k);
  return FB.runTransaction(FB.db,async tx=>{
    const st={conflicts:0,merged:false};
    const snap=await tx.get(ref), remote=snap.exists()?snap.data():null, rrev=remote?(+remote.rev||0):0;
    const base=LIVE.synced[k]!=null?JSON.parse(LIVE.synced[k]):null;
    let next=data;
    if(remote&&rrev!==(LIVE.rev[k]||0)){ const {rev,...th}=remote; next=merge3(base,data,th,st); st.merged=!eqJ(next,data); }
    if(partial){ const diff={rev:rrev+1}; Object.keys(data).forEach(x=>{ if(stable(data[x])!==stable((base||{})[x])) diff[x]=next[x]; }); tx.set(ref,diff,{merge:true}); }
    else tx.set(ref,{...next,rev:rrev+1});
    return {next,st,rev:rrev+1};
  });
}
const offlineErr=e=>!(e&&e.code==='permission-denied');
async function persistLive(){
  if(!AUTH.admin) return;
  if(LIVE.saving){ LIVE.again=true; return; }
  LIVE.saving=true;
  try{ await persistOnce(); }
  finally{ LIVE.saving=false;
    if(LIVE.again){ LIVE.again=false; persistLive(); }
    else if(LIVE.deferBuild&&!LIVE.unsaved){ LIVE.deferBuild=false; buildS(); schedule(); } }
}
async function persistOnce(){
  const parts=partsOf(S), changed=partList().filter(k=>JSON.stringify(parts[k])!==LIVE.synced[k]);
  let merged=0, conflicts=0;
  for(const k of changed){
    try{
      const r=await writePart(k,parts[k],k==='main'&&AUTH.admin.role==='part');
      LIVE.rev[k]=r.rev; LIVE.parts[k]=k==='main'&&AUTH.admin.role==='part'?{...(LIVE.parts[k]||{}),...r.next,rev:r.rev}:{...r.next,rev:r.rev};
      if(r.st.merged){ merged++; conflicts+=r.st.conflicts; LIVE.synced[k]=JSON.stringify(r.next); } else LIVE.synced[k]=JSON.stringify(parts[k]);
    }catch(e){
      console.warn(e);
      if(offlineErr(e)){ if(!LIVE.unsaved){ LIVE.unsaved=true; renderSaveState(); } setTimeout(()=>{ if(LIVE.unsaved) persistLive(); },20000); return; }
      delete LIVE.synced[k]; toast('Keine Berechtigung für diese Änderung'); LIVE.unsaved=false; buildS(); render(); return;
    }
  }
  const wasUnsaved=LIVE.unsaved; LIVE.unsaved=false;
  if(merged){ buildS(); render(); toast(conflicts?'Gleichzeitig geändert – zusammengeführt. Bei derselben Stelle gilt deine Änderung.':'Ein anderer Admin hat gleichzeitig geändert – beides wurde zusammengeführt'); }
  else if(wasUnsaved){ renderSaveState(); toast('Verbindung wieder da – alles gespeichert'); }
  if(changed.length) logAction(changed.map(k=>PART_LABEL[k]).join(', ')+' geändert'+(merged?' (zusammengeführt)':''));
  /* abgeleitete Daten (öffentliche Termine, Salden, Berichte) */
  const ops=[];
  const evRight=AUTH.admin.role!=='part'||(AUTH.admin.areas||[]).includes('events');
  if(evRight) Object.entries(LIVE.migrate).forEach(([eid,r])=>ops.push({ref:D('reports',eid),data:clean(r),mig:eid}));
  if(LIVE.balLoaded&&LIVE.pubJson!==undefined){
    const pub=publicOf(S), pj=stable(pub); if(pj!==LIVE.pubJson) ops.push({ref:D('team','public'),data:pub,pub:pj});
    if(LIVE.privJson!==undefined){ const pv=privacyOf(S), vj=stable(pv); if(vj!==LIVE.privJson) ops.push({ref:D('team','privacy'),data:pv,priv:vj}); }
    const seen=new Set();
    if(allMoneyRight(AUTH.admin)) S.players.forEach(p=>{seen.add(p.id); const b=balanceOf(p.id), bj=stable(b); if(bj!==LIVE.balances[p.id]) ops.push({ref:D('balances',p.id),data:b,bal:p.id,j:bj});});
    if(allMoneyRight(AUTH.admin)) Object.keys(LIVE.balances).forEach(pid=>{if(!seen.has(pid)) ops.push({ref:D('balances',pid),del:true,bal:pid});});
  }
  lastSaved=JSON.stringify(S);
  if(!ops.length) return;
  ops.forEach(o=>{ if(o.mig) delete LIVE.migrate[o.mig]; if(o.pub) LIVE.pubJson=o.pub; if(o.priv) LIVE.privJson=o.priv; if(o.bal){ if(o.del) delete LIVE.balances[o.bal]; else LIVE.balances[o.bal]=o.j; } });
  try{ for(let i=0;i<ops.length;i+=400){const b=FB.writeBatch(FB.db); ops.slice(i,i+400).forEach(o=>o.del?b.delete(o.ref):b.set(o.ref,o.data)); await b.commit();} }
  catch(e){ console.warn(e); LIVE.pubJson='?'; }
}

function addBackup(json,label){
  const b={ts:Date.now(),name:S.appName||'Mannschaftskasse',label,data:stripImages(json)};
  if(AUTH.mode==='live'){ if(!AUTH.admin||AUTH.admin.role==='part') return; FB.setDoc(D('backups',String(b.ts)),{...b,by:AUTH.admin.name}).catch(e=>console.warn(e)); return; }
  const list=loadBackups(); list.push({id:uid(),...b});

function autoBackup(){
  if(S.sample) return;

}

const lastDueMonth=y=>y<NOW.getFullYear()?11:(y===NOW.getFullYear()?NOW.getMonth():-1);
const yearMonths=y=>Array.from({length:lastDueMonth(y)+1},(_,i)=>mk(y,i));
function monthsInView(){return ui.mode==='month'?[mk(ui.y,ui.m)]:yearMonths(ui.y)}
const periodLabel=()=>ui.mode==='month'?`${MONTHS[ui.m]} ${ui.y}`:`${ui.y}`;

function calc(sec,pid,months){
  let soll=0,paid=0,meta='';
  if(sec==='team'){
    let n=0; months.forEach(k=>{soll+=S.fee; if(S.paid.team[pid+'|'+k]){paid+=S.fee;n++}});
    meta = months.length>1 ? `${n} von ${months.length} Monaten bezahlt` : `Beitrag ${eur(S.fee)}`;
  }else if(sec==='drinks'){
    let days=0; months.forEach(k=>{const d=S.days.filter(x=>x.date.startsWith(k)&&x.att.includes(pid)).length; days+=d; const s=d*S.rate; soll+=s; if(S.paid.drinks[pid+'|'+k]) paid+=s;});
    meta=`${days} ${days===1?'Tag':'Tage'} × ${eur(S.rate)}`;
  }else{
    const es=S.misc.filter(e=>months.includes(e.date.slice(0,7))&&e.persons.includes(pid));
    es.forEach(e=>{soll+=e.amount; if(e.paid.includes(pid)) paid+=e.amount;});
    meta=es.length?es.map(e=>e.title).join(', '):'Keine Posten';
  }
  return {soll,paid,open:r2(soll-paid),meta};
}
function totalOpen(sec,months){return r2(S.players.reduce((a,p)=>a+calc(sec,p.id,months).open,0))}
function totalSoll(sec,months){return S.players.reduce((a,p)=>a+calc(sec,p.id,months).soll,0)}

function togglePaid(sec,pid,k){
  if(sec==='misc'){
    const es=S.misc.filter(e=>e.date.startsWith(k)&&e.persons.includes(pid));
    const all=es.every(e=>e.paid.includes(pid));
    es.forEach(e=>{e.paid=e.paid.filter(x=>x!==pid); if(!all) e.paid.push(pid);});
  }else{
    const key=pid+'|'+k; if(S.paid[sec][key]) delete S.paid[sec][key]; else S.paid[sec][key]=true;
  }
}
function setPaid(sec,pid,k){
  if(sec==='misc') S.misc.filter(e=>e.date.startsWith(k)&&e.persons.includes(pid)&&!e.paid.includes(pid)).forEach(e=>e.paid.push(pid));
  else if(calc(sec,pid,[k]).soll>0) S.paid[sec][pid+'|'+k]=true;
}
function toggleEntry(eid,pid){const e=S.misc.find(x=>x.id===eid); if(!e) return; if(e.paid.includes(pid)) e.paid=e.paid.filter(x=>x!==pid); else e.paid.push(pid);}

function paypalUrl(amount){
  const u=S.paypal.trim().replace(/^https?:\/\/(www\.)?paypal\.me\//i,'').replace(/\/.*$/,'');
  return u?`https://www.paypal.me/${encodeURIComponent(u)}/${amount.toFixed(2)}EUR`:'';
}

  }

const isStandalone=()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}};

function pushState(){
  if(AUTH.mode==='demo') return {k:'demo'};

  if(isIOS()&&!isStandalone()) return {k:'ios'};

  if(Notification.permission==='denied') return {k:'denied'};

}
let MSG=null;
async function messaging(){
  if(MSG) return MSG;
  const m=await import(`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-messaging.js`);
  if(!(await m.isSupported())) throw new Error('unsupported');
  MSG={m,inst:m.getMessaging(FB.app)}; return MSG;
}
async function pushToken(){
  const reg=await navigator.serviceWorker.register('sw.js'); await navigator.serviceWorker.ready;
  const {m,inst}=await messaging();
  return m.getToken(inst,{vapidKey:FIREBASE_VAPID_KEY,serviceWorkerRegistration:reg});
}
function pushDoc(token,prefs){
  const d={token,prefs,url:location.origin+location.pathname,ts:FB.serverTimestamp(),ua:(isIOS()?'iOS':/Android/.test(navigator.userAgent)?'Android':'Browser')};
  if(AUTH.member) d.p=AUTH.member.p; if(AUTH.admin) d.a=AUTH.admin.uid; return d;

async function enablePush(){
  const prefs=pushPrefs();

  const m=ui.modal; if(m){m.busy=true; m.err=''; renderModal();}
  try{
    const perm=await Notification.requestPermission(); /* muss direkt nach dem Tippen kommen */
    if(perm!=='granted') throw new Error('perm');
    const token=await pushToken(); if(!token) throw new Error('token');
    await FB.setDoc(D('push',FB.auth.currentUser.uid),pushDoc(token,prefs));
    ls.set('mk-push',JSON.stringify({on:true,prefs,token}));
    if(m){m.busy=false; m.info='Benachrichtigungen sind auf diesem Gerät aktiv.';}
    toast('Benachrichtigungen aktiviert');
  }catch(e){
    console.warn(e);
    if(m){m.busy=false; m.err=e.message==='perm'?'Benachrichtigungen wurden nicht erlaubt.':e.message==='unsupported'?'Dieser Browser unterstützt keine Push-Nachrichten.':'Aktivieren hat nicht geklappt. Bitte später erneut versuchen.';}
  }
  renderModal(); renderChrome();
}
async function disablePush(){

    try{ const {m,inst}=await messaging(); await m.deleteToken(inst); }catch(e){}
  }
  ls.set('mk-push',JSON.stringify({on:false,prefs:pushPrefs()}));
  if(ui.modal) ui.modal.info='Benachrichtigungen auf diesem Gerät ausgeschaltet.';

async function pushRefresh(){

/* ---------- Kalender (iPhone, Android, Outlook) ---------- */
const ICS_DUR={game:120,training:90,event:180};
function icsText(events,name){
  const esc2=t=>String(t||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
  const fold=l=>{const out=[]; let cur=''; for(const ch of l){ if(new TextEncoder().encode(cur+ch).length>74){out.push(cur); cur=' '+ch;} else cur+=ch; } out.push(cur); return out.join('\r\n');};
  const loc=(d,t)=>d.replace(/-/g,'')+'T'+t.replace(':','')+'00';
  const add=(d,t,min)=>{const x=new Date(Date.UTC(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10),+t.slice(0,2),+t.slice(3,5))+min*60000); return x.toISOString().slice(0,16).replace(/[-:]/g,'')+'00';};
  const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Mannschafts-App//DE','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:'+esc2(name),'X-WR-TIMEZONE:Europe/Berlin',
    'BEGIN:VTIMEZONE','TZID:Europe/Berlin','BEGIN:DAYLIGHT','TZOFFSETFROM:+0100','TZOFFSETTO:+0200','TZNAME:CEST','DTSTART:19700329T020000','RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU','END:DAYLIGHT',
    'BEGIN:STANDARD','TZOFFSETFROM:+0200','TZOFFSETTO:+0100','TZNAME:CET','DTSTART:19701025T030000','RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU','END:STANDARD','END:VTIMEZONE'];
  events.forEach(e=>{
    const t=/^\d\d:\d\d$/.test(e.time||'')?e.time:'', tr=e.type==='training';
    const title=(e.cancel?'Abgesagt: ':'')+evTitle(e)+(tr&&!e.cancel?' ('+venueLabel(e.venue||'out')+')':'');
    L.push('BEGIN:VEVENT','UID:'+e.id+'@mannschafts-app','DTSTAMP:'+stamp);
    const mt=/^\d\d:\d\d$/.test(e.meet||'')&&(!t||e.meet<t)?e.meet:'';
    if(t||mt){ L.push('DTSTART;TZID=Europe/Berlin:'+loc(e.date,mt||t),'DTEND;TZID=Europe/Berlin:'+add(e.date,t||mt,ICS_DUR[e.type]||120)); }
    else { const n=new Date(Date.UTC(+e.date.slice(0,4),+e.date.slice(5,7)-1,+e.date.slice(8,10)+1)).toISOString().slice(0,10).replace(/-/g,''); L.push('DTSTART;VALUE=DATE:'+e.date.replace(/-/g,''),'DTEND;VALUE=DATE:'+n); }
    L.push('SUMMARY:'+esc2(title));
    if(e.place) L.push('LOCATION:'+esc2(e.place));
    { const dsc=[e.meet||e.meetAt?'Treffen'+(e.meet?' '+e.meet:'')+(e.meetAt?', '+e.meetAt:''):'',e.meet&&t?startWord(e)+' '+t+' Uhr':'',e.note||''].filter(Boolean).join('\n'); if(dsc) L.push('DESCRIPTION:'+esc2(dsc)); }
    if(e.cancel) L.push('STATUS:CANCELLED');
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.map(fold).join('\r\n')+'\r\n';
}
function icsDownload(events,file){
  const blob=new Blob([icsText(events,S.appName||'Mannschaft')],{type:'text/calendar;charset=utf-8'}), url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=file; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
}

function payreqCheckBody(m){
  const x=payreqs().find(y=>y.id===m.id); if(!x) return '<h2>Zahlung</h2><p class="hint">Nicht mehr vorhanden.</p>';
  const items=openItems(x.p).filter(i=>can(i.sec));
  if(!m.sel){ m.sel=new Set(); let sum=0; items.forEach((it,i)=>{ if(sum+it.amount<=x.amount+0.001){ m.sel.add(i); sum=r2(sum+it.amount);} }); }
  const sum=r2(items.reduce((a,it,i)=>a+(m.sel.has(i)?it.amount:0),0)), diff=r2(x.amount-sum);
  return `<h2>Zahlung prüfen</h2>
    <div class="pstate">${esc(pname(x.p))} · <b>${eur(x.amount)}</b> · ${PAY_METHODS[x.method]||''} · ${fmtTs(x.ts)}</div>
    ${x.note?`<p class="hint" style="margin:0">„${esc(x.note)}“</p>`:''}
    <b style="font-size:13px">Als bezahlt markieren</b>
    ${items.length?`<div style="display:grid;gap:4px;max-height:38vh;overflow:auto">${items.map((it,i)=>`<label class="check"><input type="checkbox" name="prItem" value="${i}" ${m.sel.has(i)?'checked':''}> ${esc(it.label)} – ${eur(it.amount)}</label>`).join('')}</div>`:'<p class="hint">Keine offenen Posten, die du verrechnen darfst.</p>'}
    <div class="pstate ${Math.abs(diff)<0.005?'ok':'warn'}" id="prSum">Ausgewählt ${eur(sum)} · gemeldet ${eur(x.amount)}${Math.abs(diff)<0.005?' · passt':diff>0?` · ${eur(diff)} mehr bezahlt`:` · ${eur(-diff)} fehlen`}</div>
    ${S.financeOn&&can('finance')?`<label class="check"><input type="checkbox" id="prBook" checked> ${eur(x.amount)} als Einnahme buchen</label>`:''}`;

async function payreqSubmit(){
  const pid=myPlayer(); if(!pid) return toast('Zum Melden deinen persönlichen Spieler-Link öffnen');
  const amount=r2(parseFloat(String(document.getElementById('prAmt').value).replace(',','.'))||0), note=document.getElementById('prNote').value.trim().slice(0,200), method=ui.modal.method||'paypal';
  if(!(amount>0)||amount>=10000) return toast('Bitte einen gültigen Betrag eingeben');
  ui.modal=null; renderModal();
  if(AUTH.mode==='live'){ try{ await FB.addDoc(FB.collection(FB.db,'payreq'),{p:pid,amount,method,note,ts:FB.serverTimestamp(),status:'open'}); }catch(e){console.warn(e); return toast('Meldung konnte nicht gesendet werden');} }
  else { S.demoPayreq=S.demoPayreq||[]; S.demoPayreq.push({id:uid(),p:pid,amount,method,note,ts:Date.now(),status:'open'}); save(); }
  render(); toast('Zahlung gemeldet – der Kassenwart wird benachrichtigt');
}
async function payreqResolve(m,ok){
  const x=payreqs().find(y=>y.id===m.id); if(!x||!moneyAdmin()) return;
  const items=openItems(x.p).filter(i=>can(i.sec)), chosen=ok?items.filter((_,i)=>m.sel.has(i)):[];
  const book=ok&&S.financeOn&&can('finance')&&!!(document.getElementById('prBook')||{}).checked;
  chosen.forEach(it=>{ if(it.sec==='misc'){const e=S.misc.find(z=>z.id===it.k); if(e&&!e.paid.includes(x.p)) e.paid.push(x.p);} else S.paid[it.sec][x.p+'|'+it.k]=true; });
  if(book){ S.finance=S.finance||{start:0,list:[]}; S.finance.list.push({id:uid(),ts:Date.now(),date:TODAY,kind:'in',amount:x.amount,title:`Zahlung ${pname(x.p)}`,cat:'Spielerzahlung',note:[PAY_METHODS[x.method],x.note].filter(Boolean).join(' · '),ref:x.id}); }
  const upd={status:ok?'done':'rejected',by:me().name,items:chosen.map(c=>c.label).slice(0,20)};
  ui.modal=null; renderModal();
  if(AUTH.mode==='live'){ try{ await FB.updateDoc(D('payreq',x.id),{...upd,done:FB.serverTimestamp()}); }catch(e){console.warn(e); return toast('Keine Berechtigung');} }
  else Object.assign((S.demoPayreq||[]).find(y=>y.id===x.id),upd);
  if(chosen.length||book) commit(); else { save(); render(); }
  logAction(ok?`Zahlung von ${pname(x.p)} (${eur(x.amount)}) verrechnet`:`Zahlungsmeldung von ${pname(x.p)} abgelehnt`);
  toast(ok?`Verrechnet: ${chosen.length} Posten${book?' · als Einnahme gebucht':''}`:'Meldung abgelehnt');
}

/* ---------- Datenschutz: Hinweis, Meine Daten, Löschfrist ---------- */
const RETENTION={0:'nie automatisch',6:'nach 6 Monaten',12:'nach 12 Monaten',24:'nach 24 Monaten'};
/* Chat und Pinnwand nach der eingestellten Frist löschen (angeheftete Beiträge bleiben). Läuft, wenn ein Admin mit allen Rechten die App öffnet. */
async function purgeOld(){
  const mths=+((S.privacy||{}).retention)||0; if(!mths||AUTH.mode!=='live') return;
  const cut=FB.Timestamp.fromMillis(Date.now()-mths*30.44*864e5);
  for(const [col,img] of [['chat','chatimg'],['chatadm','chatimgadm'],['news',null]]){
    try{
      const qs=await FB.getDocs(FB.query(FB.collection(FB.db,col),FB.where('ts','<',cut),FB.limit(200)));
      if(qs.empty) continue; const b=FB.writeBatch(FB.db); let n=0;
      qs.forEach(d=>{ const x=d.data(); if(x.pin) return; b.delete(d.ref); n++; if(img&&x.img) b.delete(D(img,d.id)); });
      if(n) await b.commit();
    }catch(e){console.warn('Löschfrist',col,e);}
  }
}
async function privacyInfo(){
  if(AUTH.mode==='live'&&!(AUTH.member||AUTH.admin)){
    if(LIVE.privDoc===undefined){ LIVE.privDoc=null; try{ const d=await FB.getDoc(D('team','privacy')); LIVE.privDoc=d.exists()?d.data():null; }catch(e){LIVE.privDoc=null;} if(ui.modal&&ui.modal.kind==='privacy') renderModal(); }

/* Meine Daten: alles, was die App über einen Spieler gespeichert hat (Auskunft nach Art. 15 DSGVO) */
function myData(pid){
  const p=pById(pid)||{name:'(entfernt)'}, out=[], sec=(t,rows)=>{ if(rows.length) out.push({t,rows}); };
  const age=ageOf(p), bd=(S.birth||{})[pid];
  sec('Stammdaten',[`Spitzname: ${p.name}`,`Rückennummer: ${p.nr||'–'}`,`Geburtsdatum: ${bd&&hasArea('players')?fmtDate(bd):age!=null?`hinterlegt (nur für Admins sichtbar), Alter ${age}`:'nicht hinterlegt'}`,
    `Zugang: ${AUTH.mode==='live'&&hasArea('players')?(codeOf(pid)?'persönlicher Code aktiv':'kein Code'):'persönlicher Code'}`]);
  const adm=adminList().filter(a=>a.p===pid).map(a=>`Admin „${a.name}“ – ${rightsText(a)}`); sec('Admin-Rolle',adm);
  if(FEAT.money){

function chatPhoto(file){
  if(!file) return; const r=new FileReader();
  r.onload=()=>{const img=new Image(); img.onload=()=>{
    let max=1280, q=.72, out='';
    for(let i=0;i<5;i++){ const s=Math.min(1,max/Math.max(img.width,img.height)); const cv=document.createElement('canvas'); cv.width=Math.round(img.width*s); cv.height=Math.round(img.height*s);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); out=cv.toDataURL('image/jpeg',q); if(out.length<700000) break; max=Math.round(max*.8); q=Math.max(.5,q-.08); }
    if(out.length>=900000) return toast('Foto ist zu groß');
    chatSend({img:out}); };
    img.onerror=()=>toast('Foto konnte nicht gelesen werden'); img.src=r.result;};
  r.readAsDataURL(file);
}

    if(open.length||mp||isAdmin()) T.push({k:'poll',lb:'Umfrage',big:String(open.length),sub:mine?'offen · du fehlst':'offen',badge:mine?(mine>1?mine+' neu':'neu'):'',c:'var(--ev,#0F8580)'}); }
  if(stateTile()){ const yr=yearMonths(NOW.getFullYear()), o=r2(MONEY.reduce((a,k)=>a+calc(k,mp,yr).open,0));
    const rep=S.payreqOn&&payreqs().some(x=>x.p===mp&&x.status==='open');
    T.push({k:'pay',lb:'Dein Stand',big:`<span style="color:${o>0?'var(--due)':'var(--ok)'}">${o>0?'−':'+'}${eur(o)}</span>`,sub:rep?'Zahlung gemeldet':o>0?'offen':'alles bezahlt',badge:'',c:o>0?'var(--due)':'var(--ok)'}); }
  if(!T.length) return '';

  const body=op==='news'?newsBlock():op==='poll'?(tpollBlock()||'<p class="hint">Keine offenen Umfragen.</p>'):op==='pay'?(stateTile()?mineCard(yearMonths(NOW.getFullYear())):(payreqPanel()||'<div class="panel"><p class="hint">Keine gemeldeten Zahlungen.</p></div>')):'';
  return `<div class="htiles" style="grid-template-columns:repeat(${T.length},minmax(0,1fr))">${T.map(t=>`<button class="htile ${op===t.k?'on':''}" data-act="homeTile" data-v="${t.k}" aria-expanded="${op===t.k}" style="--c:${t.c}">

    ${op?`<div class="hopen">${body}</div>`:''}`;
}

        ${statusEl(k,m.open===0?'paid':'open',m.open===0?'✓ bezahlt':'offen',`data-act="cell" data-sec="${k}" data-id="${p.id}" data-v="${mkey}"`)}</div>`;}).join('');

function monthTable(sec){
  const k=mk(ui.y,ui.m);
  let cols=[];
  if(sec==='drinks') cols=S.days.filter(d=>d.date.startsWith(k)).sort((a,b)=>a.date.localeCompare(b.date)).map(d=>({h:fmtShort(d.date),s:wd(d.date),d}));
  if(sec==='misc') cols=S.misc.filter(e=>e.date.startsWith(k)).sort((a,b)=>a.date.localeCompare(b.date)).map(e=>({h:e.title,s:eur(e.amount),e}));
  const all=sorted().map(p=>({p,...calc(sec,p.id,[k])}));
  const withSoll=all.filter(r=>r.soll>0||sec==='team');
  const hidden=all.length-withSoll.length;
  const sumSoll=withSoll.reduce((a,r)=>a+r.soll,0), sumOpen=r2(withSoll.reduce((a,r)=>a+r.open,0));
  const colCount=cols.map(()=>0);
  withSoll.forEach(r=>cols.forEach((c,i)=>{if(c.d?c.d.att.includes(r.p.id):c.e.persons.includes(r.p.id)) colCount[i]++;}));
  const rows=(ui.onlyOpen?withSoll.filter(r=>r.open>0):withSoll).map(r=>{
    const cells=cols.map(c=>{
      if(c.d) return `<td>${c.d.att.includes(r.p.id)?'<span class="on">●</span>':'<span class="dash">·</span>'}</td>`;
      if(!c.e.persons.includes(r.p.id)) return `<td><span class="dash">–</span></td>`;
      const pd=c.e.paid.includes(r.p.id);

function yearTable(sec){
  const y=ui.y, last=lastDueMonth(y), cur=(y===NOW.getFullYear())?NOW.getMonth():-1;
  const ms=Array.from({length:12},(_,i)=>mk(y,i));
  const colSoll=Array(12).fill(0), colOpen=Array(12).fill(0);
  let grand=0;
  const body=sorted().map(p=>{
    let rowOpen=0;
    const cells=ms.map((k,i)=>{
      const c=calc(sec,p.id,[k]);
      colSoll[i]+=c.soll; colOpen[i]+=c.open;
      if(c.soll===0) return `<td><span class="dash">–</span></td>`;
      if(i<=last) rowOpen+=c.open;
      const cls=c.open===0?'paid':(i>last?'future':'open');
      return `<td>${statusEl(sec,cls,num(c.soll),`data-act="cell" data-id="${p.id}" data-v="${k}"`)}</td>`;
    }).join('');
    rowOpen=r2(rowOpen); grand+=rowOpen;
    if(ui.onlyOpen&&rowOpen===0) return '';
    const url=rowOpen>0?paypalUrl(rowOpen):'';
    return `<tr><td class="nm">${nameBtn(p)}</td>${cells}<td class="tot sep">${rowOpen>0?`<span style="color:var(--due)">${num(rowOpen)}</span>${url?`<a href="${url}" target="_blank" rel="noopener">PayPal</a>`:''}`:`<span style="color:var(--ok)">0,00</span>`}</td></tr>`;
  }).join('');
  grand=r2(grand);
  const foot=`<tr><td class="nm">Soll gesamt</td>${colSoll.map(v=>`<td>${v?num(v):'–'}</td>`).join('')}<td class="tot sep">${num(colSoll.slice(0,last+1).reduce((a,b)=>a+b,0))}</td></tr>
    <tr><td class="nm">davon offen</td>${colOpen.map((v,i)=>`<td style="${v&&i<=last?'color:var(--due)':''}">${colSoll[i]?num(v):'–'}</td>`).join('')}<td class="tot sep" style="color:var(--due)">${num(grand)}</td></tr>`;
  return `<div class="panel">
    <div class="summary"><div><div class="lbl">Offen · ${y}${last>=0&&last<11?` bis ${MONTHS[last]}`:''}</div><div class="big">${eur(grand)}</div></div>
      <button class="chip" data-act="onlyOpen" aria-pressed="${ui.onlyOpen}">Nur offene</button></div>
    ${periodBar()}
    <div class="tablewrap"><table class="grid">
      <thead><tr><th class="nm">Name</th>${MONTHS.map((m,i)=>`<th class="${i===cur?'now':''}">${m.slice(0,3)}</th>`).join('')}<th class="tot sep">Offen</th></tr></thead>
      <tbody>${body}</tbody><tfoot>${foot}</tfoot></table></div>
    <div class="legend"><span><i style="background:var(--ok-bg);border:1px solid var(--ok)"></i>bezahlt</span><span><i style="background:var(--due-bg);border:1px solid var(--due)"></i>offen</span><span><i style="border:1px solid var(--line)"></i>noch nicht fällig</span></div>
  </div>`;
}

const SHIFT_PRESETS=['Aufbau','Abbau','Bierstand','Grill','Kasse','Kuchen','Küche','Fahrdienst','Aufräumen'];
const shiftsOf=e=>(e&&e.shifts&&e.shifts.list)||[];
const shiftWho=s=>[...new Set([...(s.ids||[]),...(s.self||[])])].filter(pById).sort((a,b)=>pname(a).localeCompare(pname(b),'de'));

const shiftSum=e=>{const st=shiftStats(e); return st.need?`${st.got} von ${st.need} Plätzen besetzt`:`${st.people} eingeteilt`;};
function shiftLine(e){

    ${!rsOk&&!cuOk?'':`<label class="check"><input type="checkbox" id="ePoll" ${f.poll?'checked':''}> ${rsOk&&!cuOk?'Zu-/Absage abfragen':'Umfrage hinzufügen'}</label>

const canSeeStats=()=>!isPublic()&&(S.statsPublic||can('events'));
/* Auswertungszeitraum: Kalenderjahr (Standard) oder Saison Juli–Juni, einstellbar unter Optionen → Verein */
function seasonStart(){const y=NOW.getFullYear(); return S.statPeriod==='season'?(NOW.getMonth()>=6?y:y-1)+'-07-01':y+'-01-01';}
function seasonLabel(){const y=+seasonStart().slice(0,4); return S.statPeriod==='season'?`Saison ${String(y).slice(2)}/${String(y+1).slice(2)}`:`${y}`;}
function evTabs(){
  if(!canSeeStats()||!mod('part')) return '';
  return `<div class="seg wide" role="group" aria-label="Ansicht"><button data-act="evView" data-v="list" aria-pressed="${ui.evView==='list'}">Termine</button><button data-act="evView" data-v="stats" aria-pressed="${ui.evView==='stats'}">Teilnahme</button></div>`;
}
function statsView(){
  const type=ui.statType, from=ui.statAll?'0000':seasonStart(), g=type==='game';
  const evs=S.events.filter(e=>e.type===type&&!e.cancel&&e.date<=TODAY&&e.date>=from&&isRsvp(e)).sort((a,b)=>a.date.localeCompare(b.date));
  const n=evs.length;
  const rows=sorted().map(p=>{let zu=0,ab=0,vl=0,no=0,kader=0,start=0;
    evs.forEach(e=>{const v=(e.poll.votes||{})[p.id]; if(v===0)zu++; else if(v===1)ab++; else if(v===2)vl++; else no++;
      if(g&&e.squad&&e.squad.ids.includes(p.id)){kader++; if(starterIds(e.squad).includes(p.id)) start++;}});
    return {p,zu,ab,vl,no,kader,start,q:n?zu/n:0};}).sort((a,b)=>b.q-a.q||a.p.name.localeCompare(b.p.name,'de'));
  const sumZu=rows.reduce((a,r)=>a+r.zu,0), answered=rows.reduce((a,r)=>a+r.zu+r.ab+r.vl,0);
  const pct=x=>Math.round(x*100)+' %';
  const vis=can('events')?`<div class="row tight" style="align-items:center"><span class="hint">Sichtbar für</span>
      <div class="seg" role="group" aria-label="Sichtbarkeit"><button data-act="statsVis" data-v="all" aria-pressed="${!!S.statsPublic}">Alle</button><button data-act="statsVis" data-v="admin" aria-pressed="${!S.statsPublic}">Nur Trainer &amp; Admins</button></div></div>`:'';
  return `<div class="panel">
    <div class="row spread"><h2>Teilnahme</h2>${vis}</div>
    <div class="toolbar">
      <div class="seg" role="group" aria-label="Art"><button data-act="statType" data-v="game" aria-pressed="${g}">Spiele</button><button data-act="statType" data-v="training" aria-pressed="${!g}">Training</button></div>
      <div class="seg" role="group" aria-label="Zeitraum"><button data-act="statAll" data-v="0" aria-pressed="${!ui.statAll}">${seasonLabel()}</button><button data-act="statAll" data-v="1" aria-pressed="${ui.statAll}">Gesamt</button></div>
    </div>
    ${n?`<div class="statsum">
      <div><span>${g?'Spiele':'Trainings'}</span><b>${n}</b></div>
      <div><span>Ø Zusagen</span><b>${(sumZu/n).toLocaleString('de-DE',{maximumFractionDigits:1})}</b></div>
      <div><span>Rückmeldequote</span><b>${S.players.length?pct(answered/(n*S.players.length)):'–'}</b></div>
    </div>
    <div class="tablewrap"><table class="grid">
      <thead><tr><th class="nm">Name</th><th>Ja</th><th>Nein</th><th>?</th><th title="keine Antwort">–</th>${g?'<th class="sep">Kader</th><th>Startelf</th>':''}<th class="tot sep">Zusagequote</th></tr></thead>
      <tbody>${rows.map(r=>`<tr><td class="nm">${nameBtn(r.p)}</td><td style="color:var(--ok);font-weight:700">${r.zu}</td><td>${r.ab}</td><td>${r.vl}</td><td class="dash">${r.no}</td>
        ${g?`<td class="sep">${r.kader}</td><td>${r.start}</td>`:''}<td class="sep"><div class="qbar"><span class="tr"><i style="width:${Math.round(r.q*100)}%"></i></span><b>${pct(r.q)}</b></div></td></tr>`).join('')}</tbody>
    </table></div>
    <p class="hint">Gezählt werden vergangene ${g?'Spiele':'Trainings'} mit Zu-/Absage-Umfrage${ui.statAll?'':' seit 1. Juli'}.${g?' Kader und Startelf stammen aus der Aufstellung.':''}</p>`
    :`<p class="hint">Noch keine vergangenen ${g?'Spiele':'Trainings'} mit Zu-/Absage-Umfrage in diesem Zeitraum.</p>`}
  </div>`;
}
function eventsView(){
  if(ui.form&&can('events')&&!ui.shiftPick) return eventForm();
  if(ui.evDetail&&!isPublic()) return evDetailView();
  if(ui.evView==='stats'&&canSeeStats()&&mod('part')&&!isPublic()) return evTabs()+statsView();
  const f=ui.efilter;
  const all=S.events.filter(e=>f==='all'||e.type===f);
  const up=all.filter(e=>e.date>=TODAY).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));

      <button data-act="efilter" data-v="training" aria-pressed="${f==='training'}">Training ${cnt('training')}</button>

    ${past.length?`<button class="chip" data-act="showPast" style="justify-self:start">${ui.showPast?'Vergangene ausblenden':`Vergangene anzeigen (${past.length})`}</button>`:''}
    ${ui.showPast&&past.length?`<div class="evlist">${past.map(e=>evCard(e,'past',false)).join('')}</div>`:''}
  </div>`;

/* ---------- Kader & Aufstellung ---------- */
function lineupView(){
  const e=S.events.find(x=>x.id===ui.lineup); if(!e){ui.lineup=null;return eventsView();}
  const adm=can('events');
  const sq=e.squad||{ids:[],formation:'4-4-2',slots:{}};
  const free=isFree(sq), ids=sq.ids.filter(pById), pos=free?[]:(FORMS[sq.formation]||FORMS['4-4-2']);
  const slotOf=i=>{const id=(sq.slots||{})[i]; return id&&ids.includes(id)?pById(id):null;};
  const starters=new Set(free?starterIds(sq).filter(pById):pos.map((_,i)=>slotOf(i)).filter(Boolean).map(p=>p.id));
  if(!starters.has(ui.freeSel)) ui.freeSel=null;
  const bench=ids.map(pById).filter(p=>!starters.has(p.id)).sort((a,b)=>a.name.localeCompare(b.name,'de'));
  const head=`<div class="panel" style="${secStyle('events')}">
    <button class="back" data-act="lineupBack">‹ Termine</button>
    <div><h2>${esc(evTitle(e))}</h2><p class="hint">${wd(e.date)}, ${fmtDate(e.date)}${e.time?' · '+e.time+' Uhr':''}${e.place?' · '+esc(e.place):''}</p></div>
  </div>`;
  if(ui.form&&adm) return head+`<div class="panel form" style="${secStyle('events')}"><h2>Kader festlegen</h2>${picker()}${saveBar('saveSquad')}</div>`;
  const lines='<span class="pl half"></span><span class="pl circ"></span><span class="pl boxt"></span><span class="pl boxb"></span>';
  const freeEdit=free&&adm&&!!ui.freeEditing;
  const pitch=free?`<div class="pitch ${freeEdit?'freeedit':''}" id="fPitch" data-grid="${gridOf(sq)}" ${freeEdit?'':'role="img" aria-label="Freie Aufstellung"'}>${lines}
    ${freeEdit?gridCells(gridOf(sq)).map(z=>`<i class="gp" style="left:${z.x}%;top:${z.y}%"></i>`).join(''):''}
    ${[...starters].map(id=>{const p=pById(id), c=sq.free[id]; return `<div class="pos ${freeEdit?'drag':''} ${ui.freeSel===id?'sel':''}" data-pid="${id}" style="left:${c.x}%;top:${c.y}%">

  </div>`:`<div class="pitch" role="img" aria-label="Aufstellung ${esc(sq.formation)}">
    ${lines}
    ${pos.map(([code,x,y],i)=>{const p=slotOf(i); return `<div class="pos" style="left:${x}%;top:${y}%">
      <span class="dp ${p?'':'empty'}">${p?esc(p.nr||initials(p.name)):''}</span>
      <span class="pn">${p?esc(p.name):'–'}</span><span class="pr">${code}</span></div>`;}).join('')}
  </div>`;
  const editor=adm?`<div class="panel" style="${secStyle('events')}">
      <div class="row spread"><h2>Aufstellung bearbeiten</h2><button class="btn ghost sm" data-act="editSquad">Kader ändern (${ids.length})</button></div>
      <label class="f" style="max-width:280px">Spielsystem<select id="lFormation">${Object.keys(FORMS).map(f=>`<option ${f===sq.formation?'selected':''}>${f}</option>`).join('')}<option value="${FREE}" ${free?'selected':''}>Frei – selbst positionieren</option></select></label>
      ${free?`<label class="f" style="max-width:280px">Raster<select id="lGrid">${Object.entries(GRIDS).map(([k,l])=>`<option value="${k}" ${+k===gridOf(sq)?'selected':''}>${l}</option>`).join('')}</select></label>
        <p class="hint">${gridOf(sq)?'Mit Raster rasten die Spieler auf dem nächsten Punkt ein – so stehen Reihen gerade und symmetrisch. Ziehst du jemanden auf einen besetzten Punkt, tauschen beide die Plätze. ':''}Spieler auf dem Feld mit dem Finger an die gewünschte Stelle ziehen. Aus der Ersatzbank antippen, um jemanden aufs Feld zu holen. Zum Herausnehmen antippen und „Auf die Bank“ wählen oder vom Feld ziehen.</p>
        ${starters.size?'<button class="edit" style="justify-self:start" data-act="freeClear">Alle auf die Bank</button>':''}`
      :ids.length?`<div class="slots">${pos.map(([code],i)=>{const cur=slotOf(i); return `<label class="slot"><b>${code}</b><select data-slot="${i}" aria-label="Position ${code}">
        <option value="">– frei –</option>${ids.map(pById).sort((a,b)=>a.name.localeCompare(b.name,'de')).map(p=>`<option value="${p.id}" ${cur&&cur.id===p.id?'selected':''}>${p.nr?p.nr+' · ':''}${esc(p.name)}${starters.has(p.id)&&!(cur&&cur.id===p.id)?' (gesetzt)':''}</option>`).join('')}</select></label>`;}).join('')}</div>
      <p class="hint">Wer schon auf einer Position steht und neu zugeordnet wird, wechselt automatisch dorthin.</p>`:'<p class="hint">Lege zuerst den Kader fest.</p>'}
      ${ui.confirmDel==='squad'?confirmBox('squad:'+e.id,'Kader und Aufstellung','Entfernen?','Entfernen'):(ids.length?'<button class="edit" style="justify-self:start" data-act="askDel" data-v="squad">Kader und Aufstellung entfernen</button>':'')}

        <h3>Kader · ${ids.length}</h3><p class="hint" style="color:var(--ink)">${esc(ids.map(pById).sort((a,b)=>a.name.localeCompare(b.name,'de')).map(p=>(p.nr?p.nr+' ':'')+p.name).join(' · '))}</p>`:''}
    </div>${editor}`;
}

/* ---------- Module freischalten (nur Admins mit „Alles“) ---------- */
const modName=k=>k==='rsvp'?'Zu-/Absagen':k==='cmt'?'Kommentare':(modDef(k)||[k,k])[1];
/* Was beim Einschalten zusätzlich an muss bzw. beim Ausschalten mit ausgeht */
function modPlan(k,on){
  const m={...S.mods}, add=[], drop=[];
  if(on){
    const need=x=>{ if(x==='rsvp'){ if(!RSVP_KEYS.some(y=>modEff(m,y))) ['rsvp_training','rsvp_game'].forEach(need); return; }
      const d=modDef(x); d[3].forEach(need); if(!m[x]){ m[x]=true; if(x!==k) add.push(x); } };
    need(k);
  }else{
    const before=MOD_DEFS.filter(([x])=>modEff(m,x)).map(([x])=>x); m[k]=false;
    before.forEach(x=>{ if(x!==k&&!modEff(m,x)){ m[x]=false; drop.push(x); } });
  }
  m[k]=on; return {m,add,drop};
}
function modApply(k,on){
  const {m,add,drop}=modPlan(k,on), was={...S.mods}; S.mods=m; S.chatOn=!!m.chat;
  let extra='';
  RSVP_KEYS.forEach(x=>{ if(m[x]&&!was[x]){ const t=x.slice(5); let n=0;
    S.events.forEach(e=>{ if(e.type===t&&e.date>=TODAY&&!e.cancel&&!e.poll){ e.poll={q:RSVPQ[t],opts:[...RSVP],votes:{},open:true}; n++; } });
    if(n) extra+=` · Zu-/Absage bei ${n} kommenden Terminen ergänzt`; } });
  if(was.access&&!m.access) S.publicView=true;
  ui.modAsk=null; logAction(`Modul „${modName(k)}“ ${on?'eingeschaltet':'ausgeschaltet'}${add.length?' (mit '+add.map(modName).join(', ')+')':''}${drop.length?' (ohne '+drop.map(modName).join(', ')+')':''}`);
  commit(); toast(`${modName(k)} ${on?'eingeschaltet':'ausgeschaltet'}${extra}`);
}

/* ---------- Sind meine Daten sicher? ---------- */
function healthChecks(){
  const L=[], add=(lvl,t,d,act)=>L.push({lvl,t,d,act}), live=AUTH.mode==='live';
  if(live&&LIVE.unsaved) add('red','Nicht alles gespeichert','Keine Verbindung – deine Änderungen werden automatisch nachgeholt, sobald wieder Netz da ist. App bis dahin nicht schließen.');
  else add('ok','Alles gespeichert',live?(navigator.onLine?'Online – alle Änderungen liegen auf dem Server, Geräteverlust kostet keine Daten.':'Gerade offline – es sind aber keine Änderungen offen.'):'Demo: gespeichert auf diesem Gerät.');
  add('ok','Überschreib-Schutz aktiv','Ändern zwei Admins gleichzeitig, wird zusammengeführt statt überschrieben.');
  const bks=loadBackups()||[], last=bks.length?Math.max(...bks.map(b=>+b.ts||0)):0;
  if(!last) add('yellow','Noch kein Sicherungspunkt','Entsteht automatisch vor Änderungen – oder jetzt von Hand.',['bkNow','Jetzt sichern']);
  else add(Date.now()-last<14*864e5?'ok':'yellow',`Letzter Sicherungspunkt: ${fmtTs(last)}`,`${bks.length} Sicherungspunkte ${live?'online':'auf diesem Gerät'} – unter „Sicherung“ wiederherstellbar.`,Date.now()-last<14*864e5?null:['bkNow','Jetzt sichern']);
  const ex=+(ls.get('mk-lastexport')||0);
  add(ex&&Date.now()-ex<30*864e5?'ok':'yellow',ex?`Datei-Sicherung zuletzt: ${fmtTs(ex)}`:'Noch keine Datei-Sicherung auf diesem Gerät','Zusätzlich etwa monatlich als Datei speichern, z. B. in iCloud Drive – falls einmal etwas mit dem Konto ist.',ex&&Date.now()-ex<30*864e5?null:['exportFile','Als Datei speichern']);
  const full=adminList().filter(a=>a.role!=='part').length;
  add(full>=2?'ok':'yellow',`${full} Admin${full===1?'':'s'} mit „Alles“`,full>=2?'Fällt einer aus, kommt der andere weiter an alle Optionen.':'Empfehlung: einen zweiten Admin mit „Alles“ einladen, damit niemand ausgesperrt ist.');
  if(live) add(LIVE.rulesOk===true?'ok':LIVE.rulesOk===false?'red':'yellow','Firebase-Regeln',LIVE.rulesOk===true?'Passen zur App-Version.':LIVE.rulesOk===false?'Veraltet – bitte die firestore.rules aus der aktuellen Zip in der Firebase-Konsole einfügen und veröffentlichen.':'Konnte gerade nicht geprüft werden.');
  if(live&&mod('push')) add(FIREBASE_VAPID_KEY?'ok':'yellow','Push-Nachrichten',FIREBASE_VAPID_KEY?'Eingerichtet.':'Noch nicht eingerichtet (Anleitung, Abschnitt 12a).');
  const pv=S.privacy||{}; add(pv.who&&pv.contact?'ok':'yellow','Datenschutzhinweis',pv.who&&pv.contact?'Verantwortlicher und Kontakt eingetragen.':'Verantwortlicher oder Kontakt fehlt – weiter unten unter „Datenschutz“.');
  const off=FEAT.lite?0:S.players.filter(p=>playerStatus(p.id).cls==='off').length; if(off) add('yellow',`${off} Spieler ohne Zugang`,'Unter „Spieler & Zugänge“ Codes erzeugen und Einladungen verschicken.');
  if(S.sample) add('yellow','Beispieldaten geladen','Vor dem Start unter „Daten zurücksetzen“ leeren.');
  return L;
}

  const L=healthChecks(), worst=L.some(x=>x.lvl==='red')?'red':L.some(x=>x.lvl==='yellow')?'yellow':'ok';

    <div class="hsum ${worst}">${worst==='ok'?'✓ Alles in Ordnung':worst==='yellow'?'Gesichert – mit Empfehlungen (gelb)':'Bitte kümmern (rot)'}</div>

function optSummary(k){
  const onoff=b=>b?'an':'aus';
  if(k==='mods'){ const on=MOD_DEFS.filter(([x])=>mod(x)).map(([x])=>x);
    const nm=[mod('players')&&'Spielerliste',mod('squad')&&'Kader',mod('access')&&'Zugänge',mod('rsvp')&&'Zu-/Absagen',mod('cmt')&&'Kommentare',mod('part')&&'Teilnahme',mod('polls')&&'Umfragen',mod('shifts')&&'Einteilung',mod('akt')&&'Aktuelles',mod('board')&&'Pinnwand',mod('chat')&&'Chat',mod('push')&&'Push',mod('kasse')&&'Kassen'].filter(Boolean);
    return [on.length?'Termine + '+nm.join(', '):'Nur Termine – weitere Bereiche hier freischalten',''];}
  if(k==='players'){ const st=S.players.map(p=>playerStatus(p.id)), off=st.filter(x=>x.cls==='off').length;
    if(!mod('access')) return [`${S.players.length} Spieler · nur für Admins sichtbar`,''];
    return [`${S.players.length} Spieler · ${st.filter(x=>x.cls==='ok').length} aktiv · ${st.filter(x=>x.cls==='wait').length} eingeladen`, off?off+' ohne Code':'']; }
  if(k==='admins'){ const l=adminList(); return [`${l.length} von ${adminMax()} · ${l.map(a=>a.name).join(', ')}`,'']; }
  if(k==='kasse') return [`Beitrag ${eur(S.fee)} · Getränke ${eur(S.rate)} · Strafen ${onoff(S.finesOn)} · Kassenbuch ${onoff(S.financeOn)}`, S.paypal?'':'PayPal fehlt'];
  if(k==='club'){ const pr=PRESETS.find(p=>p.c.slice(0,2).join()===S.club.c.slice(0,2).join()); return [`${S.teamName} · ${pr?pr.n:'eigene Farben'}${S.club.crest?' · Wappen':''}`,'']; }
  if(k==='vis') return [`${FEAT.money?`Beträge: ${S.amountsPublic?'alle sehen alles':'jeder nur seine'} · `:''}Pinnwand: ${S.boardOpen!==false?'alle':'nur Admins'} · Öffentlich ${onoff(S.publicView)}`,''];
  if(k==='notify'){ if(!mod('push')) return [`Kalender-Abo ${onoff(S.calOn)}`,'']; const n=[S.remRsvp,S.remDebt,S.remBday].filter(Boolean).length; return [`${FEAT.events?'Kalender-Abo '+onoff(S.calOn)+' · ':''}${n} von ${FEAT.events&&FEAT.money?3:2} Erinnerungen an`,'']; }
  if(k==='data'){ const L=isFull()?healthChecks():[], red=L.some(x=>x.lvl==='red'), yel=L.filter(x=>x.lvl==='yellow').length;

  return ['',''];
}
function settings(){

async function claimAdmin(){
  const u=FB.auth.currentUser; if(!u||u.isAnonymous) return 'login';
  const a=await FB.getDoc(D('admins',u.uid)).catch(()=>null); if(a&&a.exists()) return 'ok';
  const setup=await FB.getDoc(D('meta','setup')).catch(()=>null);
  if(setup&&!setup.exists()) return 'setup';
  const email=(u.email||'').toLowerCase();
  const inv=await FB.getDoc(D('invites',email)).catch(()=>null);
  if(!inv||!inv.exists()) return 'noinvite';
  if(!u.emailVerified) return 'verify';
  const d=inv.data(); const b=FB.writeBatch(FB.db);
  b.set(D('admins',u.uid),{name:d.name,role:d.role,areas:d.areas||[],email,...(d.p?{p:d.p}:{})});
  b.delete(D('invites',email)); await b.commit(); return 'ok';
}
