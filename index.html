:root{--c1:#0E2F7A;--c2:#FFD21F;--tr:#0F8580;--due:#B3261E;--ok:#1E7B3A;--ink:#0B1530;--muted:#5B6478;--line:#D9DEE8;--bg:#E8ECF4;--surface:#fff;--soft:#EEF1F7;
  --head:'Anton',Impact,sans-serif;--body:'Barlow',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header{background:var(--c1);color:#fff;border-bottom:5px solid var(--c2);padding:calc(14px + env(safe-area-inset-top)) 0 16px;background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 18px,transparent 18px 46px)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.hrow{display:flex;align-items:center;gap:12px}
.htxt{flex:1;min-width:0}
.eyebrow{font-size:11px;letter-spacing:.18em;font-weight:700;color:#C9D3EA;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1{font-family:var(--head);font-weight:400;font-size:28px;line-height:1.05;margin:2px 0 0;text-transform:uppercase;letter-spacing:.01em}
h1 em{font-style:normal;color:var(--c2)}
.lock{flex:none;width:48px;height:48px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:transparent;color:#fff;display:grid;place-items:center}
.lock.on{background:var(--c2);border-color:var(--c2);color:var(--ink)}
.lock svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{padding:14px 0 10px}
main .wrap{display:grid;gap:12px}
.panel{background:var(--surface);border-radius:14px;padding:14px;display:grid;gap:10px;min-width:0}
h2{font-family:var(--head);font-weight:400;font-size:22px;margin:0;text-transform:uppercase;line-height:1.1}
h3{margin:4px 0 0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hd{font-family:var(--head);font-size:22px;text-transform:uppercase;margin:4px 2px 0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hd span{font-family:var(--body);font-size:12.5px;text-transform:none;color:var(--muted);font-weight:500}
.hint{color:var(--muted);font-size:13.5px;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.btn{border:0;border-radius:10px;background:var(--c1);color:#fff;font-weight:700;padding:11px 16px;min-height:44px}
.btn.sm{padding:7px 12px;min-height:36px;font-size:14px}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:var(--due)}
.btn:disabled{opacity:.5}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;white-space:nowrap;min-height:36px}
.chip[aria-pressed="true"]{background:var(--c1);border-color:var(--c1);color:#fff}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px;min-width:0}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 6px;font-weight:600;color:var(--muted);min-height:38px;font-size:14px;min-width:0}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(11,21,48,.15)}
/* Übersicht */
.minis{display:grid;gap:8px}
.mini{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:left;padding:0;width:100%}
.mini .md{flex:none;width:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--c2);color:var(--ink);padding:10px 0}
.mini.tr .md{background:var(--tr);color:#fff}
.mini.evt .md{background:var(--soft);color:var(--ink)}
.mini.cx .md{background:#B7BDCB;color:#fff}
.mini .md b{font-family:var(--head);font-weight:400;font-size:28px;line-height:1}
.mini .md i{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.mini .mt{padding:9px 12px;min-width:0;display:grid;gap:1px}
.mini .ml{font-size:11px;letter-spacing:.1em;font-weight:700;color:var(--muted);text-transform:uppercase}
.mini .mv{font-family:var(--head);font-size:18px;text-transform:uppercase;line-height:1.15;overflow-wrap:anywhere}
.mini.cx .mv{text-decoration:line-through;color:var(--muted)}
.mini .ms{font-size:13.5px;color:var(--muted)}
/* Terminliste */
.evlist{display:grid;gap:10px}
.ev{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:56px minmax(0,1fr);gap:4px 12px;position:relative}
.ev.next{border-left:6px solid var(--c2)}
.ev.past{opacity:.7}
.ev.cancel .t{text-decoration:line-through;color:var(--muted)}
.cal{background:var(--c1);color:#fff;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0;align-self:start}
.cal span{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.cal b{font-family:var(--head);font-weight:400;font-size:26px;line-height:1.05}
.ev .t{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.ev .s{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.badge{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--soft);border-radius:6px;padding:3px 8px}
.badge.nx{background:var(--c2)}
.badge.tr{background:#D6ECEA;color:#0A5652}
.badge.cx{background:var(--due);color:#fff}
.badge.vin{background:#E4E0F5;color:#3D2C8D}
.badge.valt{background:#FCE7C8;color:#7A4A00}
.evact{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-top:1px dashed var(--line);padding-top:8px;margin-top:4px}
.linkbtn{border:0;background:none;color:var(--c1);font-weight:700;padding:6px 0;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.x{border:0;background:var(--soft);border-radius:8px;width:36px;height:36px;font-size:20px;line-height:1;color:var(--due)}
.confirm{grid-column:1/-1;background:#FDECEA;border-radius:10px;padding:10px;display:grid;gap:8px}
/* Formular */
.f{display:grid;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600;min-width:0}
.f input,.f select,.f textarea{border:0;background:var(--soft);border-radius:8px;padding:10px;font-size:16px;color:var(--ink);font-weight:500;width:100%;min-width:0;min-height:44px}
.f textarea{min-height:70px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.check input{width:22px;height:22px;flex:none;accent-color:var(--c1);margin:0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.overlay{position:fixed;inset:0;background:rgba(11,21,48,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:10px}
.sheet{background:var(--surface);border-radius:16px;width:100%;max-width:560px;max-height:calc(100vh - 20px);max-height:calc(100dvh - 20px);overflow:auto;padding:16px;display:grid;gap:12px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
@media(min-width:640px){.overlay{align-items:center}}
body.modal{overflow:hidden}
/* Leisten */
.adminbar{background:#FFF4C2;border:2px solid var(--c2);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.adminbar small{display:block;color:var(--muted);font-size:12.5px}
.status{border-radius:10px;padding:9px 12px;font-size:14px;font-weight:600}
.status.busy{background:var(--soft)}
.status.ok{background:#E3F3E7;color:var(--ok)}
.status.err{background:#FDECEA;color:var(--due)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--soft);border-radius:6px;padding:4px 8px;overflow-wrap:anywhere}
nav.tabbar{position:fixed;left:0;right:0;bottom:0;background:#0B1F5C;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav.tabbar .in{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);width:100%;max-width:720px}
nav.tabbar button{border:0;background:none;color:#C9D3EA;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;min-height:60px}
nav.tabbar button[aria-selected="true"]{color:var(--c2)}
nav.tabbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-size:14.5px;z-index:60;max-width:calc(100% - 32px);text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
.foot{text-align:center;color:var(--muted);font-size:12.5px;padding:6px 0 0}
:focus-visible{outline:3px solid var(--c2);outline-offset:2px}
</style>
</head>
<body>
<header><div class="wrap hrow">
  <div class="htxt"><div class="eyebrow" id="appName">Altliga-Termine</div><h1 id="teamName">TSV Selent <em>Altliga</em></h1></div>
  <button class="lock" id="lockBtn" aria-label="Admin-Anmeldung"></button>
</div></header>

ue,"place":"Schulsportplatz","note":"","venue":"out"},{"id":"t270803","type":"training","date":"2027-08-03","time":"19:00","title":"","home":true,"place":"Schulsportplatz","note":"","venue":"out"},{"id":"t270810","type":"training","date":"2027-08-10","time":"19:00","title":"","home":true,"place":"Schulsportplatz","note":"","venue":"out"},{"id":"t270817","type":"training","date":"2027-08-17","time":"19:00","title":"","home":true,"place":"Schulsportplatz","note":"","venue":"out"},{"id":"t270824","type":"training","date":"2027-08-24","time":"19:00","title":"","home":true,"place":"Schulsportplatz","note":"","venue":"out"},{"id":"t270831","type":"training","date":"2027-08-31","time":"19:00","title":"","home":true,"place":"Schulsportplatz","note":"","venue":"out"},{"id":"t270907","type":"training","date":"2027-09-07","time":"19:00","title":"","home":true,"place":"Schulsportplatz","note":"","venue":"out"},{"id":"t270914","type":"training","date":"2027-09-14","time":"19:00","title":"","home":true,"place":"Schulsportplatz","note":"","venue":"out"},{"id":"t270921","type":"training","date":"2027-09-21","time":"19:00","title":"","home":true,"place":"Schulsportplatz","note":"","venue":"out"},{"id":"t270928","type":"training","date":"2027-09-28","time":"19:00","title":"","home":true,"place":"Schulsportplatz","note":"","venue":"out"},{"id":"t271005","type":"training","date":"2027-10-05","time":"19:00","title":"","home":true,"place":"Schulsportplatz","note":"","venue":"out"},{"id":"t271012","type":"training","date":"2027-10-12","time":"19:00","title":"","home":true,"place":"Schulsportplatz","note":"","venue":"out"},{"id":"t271019","type":"training","date":"2027-10-19","time":"19:00","title":"","home":true,"place":"Schulsportplatz","note":"","venue":"out"},{"id":"t271026","type":"training","date":"2027-10-26","time":"19:00","title":"","home":true,"place":"Schulsportplatz","note":"","venue":"out"}],"updated":0};
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
const MON=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

const ICS_DUR={game:120,training:90,event:180};
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const TODAY=iso(new Date());
const shiftDate=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d);};
const wd=d=>WD[new Date(d+'T12:00').getDay()];
const fmtDate=d=>{const [y,m,t]=d.split('-');return `${t}.${m}.${y}`;};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
const isTime=t=>/^\d\d:\d\d$/.test(t||'');

/* ---------- Zustand ---------- */
let D=null;               /* Daten: {appName, teamName, venues, events, updated} */
const ui={tab:'home',filter:'all',showPast:false,form:null,confirm:null,modal:null};
const ADM={token:ls.get('at-token')||'',ok:false,local:ls.get('at-local')==='1',status:null,queue:[],saving:false,sha:null};
function repo(){
  if(REPO_OVERRIDE.owner&&REPO_OVERRIDE.repo) return {...REPO_OVERRIDE};
  const h=location.hostname.match(/^([^.]+)\.github\.io$/i); if(!h) return null;
  const seg=location.pathname.split('/').filter(Boolean)[0];
  return {owner:h[1],repo:seg&&!/\.html?$/.test(seg)?seg:h[1]+'.github.io',branch:REPO_OVERRIDE.branch||'main'};
}
const isAdmin=()=>ADM.ok||ADM.local;
function normalize(d){
  d=d&&typeof d==='object'?d:{};
  return {v:1,appName:d.appName||'Altliga-Termine',teamName:d.teamName||'TSV Selent Altliga',
    venues:{out:'Schulsportplatz',in:'Halle',alt:'OHLA Stadion',...(d.venues||{})},
    events:(Array.isArray(d.events)?d.events:[]).filter(e=>e&&e.id&&e.date&&ETYPE[e.type]),updated:d.updated||0,kal:!!d.kal};
}
const venueName=k=>((D.venues||{})[k]||'').trim();
const venueLabel=k=>k==='in'?'Halle':k==='alt'?(venueName('alt')||'Anderer Ort'):'Draußen';
const venueKeys=()=>['out','in',...(venueName('alt')?['alt']:[])];

/* ---------- Laden ---------- */
async function load(){
  let d=null;
  if(ADM.local){ try{ d=JSON.parse(ls.get('at-localdata')||'null'); }catch(e){} }
  if(!d){ try{ const r=await fetch('termine.json?t='+Date.now(),{cache:'no-store'}); if(r.ok) d=await r.json(); }catch(e){} }
  if(!d) d=SEED;
  D=normalize(d); render();
  if(ADM.token&&!ADM.local) checkToken(ADM.token,true);
}

/* ---------- Anzeige ---------- */
function evTitle(e){
  if(e.type==='game'&&e.tour) return e.title||'Turnier';
  if(e.type==='game') return e.home!==false?`Heimspiel gegen ${e.title}`:`Auswärts bei ${e.title}`;
  if(e.type==='training') return e.title||'Training';
  return e.title||'Termin';
}
const startWord=e=>e.type==='game'&&!e.tour?'Anpfiff':'Beginn';
function timeBits(e){ const b=[];
  if(e.meet||e.meetAt) b.push('Treffen'+(e.meet?' '+e.meet:'')+(e.meetAt?' · '+esc(e.meetAt):''));
  if(e.time) b.push((e.meet||e.meetAt?startWord(e)+' ':'')+e.time+' Uhr');
  return b; }
const sortUp=(a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''));
const upcoming=()=>D.events.filter(e=>e.date>=TODAY).sort(sortUp);
const typeBadge=e=>e.type==='game'?(e.tour?'Turnier':e.home!==false?'Spiel · Heim':'Spiel · Auswärts'):ETYPE[e.type];
function mini(e){
  const [,m,d]=e.date.split('-'), g=e.type==='game';
  const lb=g?`${e.tour?'Turnier':'Spiel'} · ${e.cancel?'Abgesagt':e.tour?(e.place||'Auswärts'):e.home!==false?'Heim':'Auswärts'}`:e.type==='training'?`Training · ${e.cancel?'Fällt aus':esc(venueLabel(e.venue||'out'))}`:(e.cancel?'Event · Fällt aus':'Event');
  const title=g&&!e.tour?(e.home!==false?`gegen ${e.title}`:`bei ${e.title}`):evTitle(e);
  const bits=[...timeBits(e)]; if(e.place&&!(g&&e.tour)) bits.push(esc(e.place)); if(e.note) bits.push(esc(e.note));
  return `<button class="mini ${e.type==='training'?'tr':e.type==='event'?'evt':''} ${e.cancel?'cx':''}" data-act="goto" data-v="events">
    <span class="md"><b>${+d}</b><i>${wd(e.date)} · ${MON[+m-1].slice(0,3)}</i></span>
    <span class="mt"><span class="ml">${lb}</span><span class="mv">${esc(title)}</span><span class="ms">${bits.join(' · ')}</span></span></button>`;
}
function homeView(){
  const l=upcoming().slice(0,5);
  return `${adminBar()}<div class="hd">Nächste Termine <span>antippen für alle Termine</span></div>
    ${l.length?`<div class="minis">${l.map(mini).join('')}</div>`:'<div class="panel"><p class="hint">Keine kommenden Termine.</p></div>'}
    <div class="row"><button class="chip" data-act="goto" data-v="events">Alle Termine ›</button><button class="chip" data-act="calOpen">📅 In meinen Kalender</button></div>`;
}
function trBadges(e){
  return `${e.cancel?`<span class="badge cx">${CX_WORD[e.type][0].toUpperCase()+CX_WORD[e.type].slice(1)}</span>`:''}${e.type==='training'?`<span class="badge ${e.venue==='in'?'vin':e.venue==='alt'?'valt':''}">${esc(venueLabel(e.venue||'out'))}</span>`:''}`;
}
function evCard(e,cls,isNext){
  const [,m,d]=e.date.split('-'), key='del:'+e.id;
  const adm=isAdmin()&&e.date>=TODAY;
  const acts=isAdmin()?`<div class="evact">
      ${adm&&e.type==='training'?`<div class="seg" role="group" aria-label="Ort">${venueKeys().map(k=>`<button data-act="venue" data-v="${e.id}" data-x="${k}" aria-pressed="${(e.venue||'out')===k}">${esc(venueLabel(k))}</button>`).join('')}</div>`:''}
      ${adm?`<button class="chip" data-act="cancel" data-v="${e.id}" aria-pressed="${!!e.cancel}">${e.cancel?'Findet doch statt':e.type==='game'?'Abgesagt':'Fällt aus'}</button>`:''}
      <button class="chip" data-act="edit" data-v="${e.id}">Bearbeiten</button>
      <button class="x" data-act="askDel" data-v="${e.id}" aria-label="Termin löschen">×</button></div>
      ${ui.confirm===key?`<div class="confirm"><span>Termin „${esc(evTitle(e))}“ am ${fmtDate(e.date)} löschen?</span><div class="row"><button class="btn danger sm" data-act="del" data-v="${e.id}">Löschen</button><button class="btn ghost sm" data-act="noDel">Abbrechen</button></div></div>`:''}`:'';
  return `<div class="ev ${cls||''} ${e.cancel?'cancel':''}"><div class="cal"><span>${wd(e.date)}</span><b>${+d}</b><span>${MON[+m-1].slice(0,3)}</span></div>
    <div style="min-width:0"><div class="t">${esc(evTitle(e))}</div>
      <div class="s">${[...timeBits(e),esc(e.place)].filter(Boolean).join(' · ')}</div>
      ${e.note?`<div class="s">${esc(e.note)}</div>`:''}
      <div class="tags">${isNext?'<span class="badge nx">Nächster</span>':''}<span class="badge ${e.type==='training'?'tr':''}">${typeBadge(e)}</span>${trBadges(e)}</div>
      <button class="linkbtn" data-act="ics1" data-v="${e.id}">📅 In Kalender eintragen</button></div>${acts}</div>`;
}
function eventsView(){
  const f=ui.filter, all=D.events.filter(e=>f==='all'||e.type===f);
  const up=all.filter(e=>e.date>=TODAY).sort(sortUp), past=all.filter(e=>e.date<TODAY).sort((a,b)=>sortUp(b,a));
  const cnt=t=>D.events.filter(e=>t==='all'||e.type===t).length;
  return `${adminBar()}<div class="panel">
    <div class="row spread"><h2>Termine</h2><div class="row"><button class="btn ghost sm" data-act="calOpen">📅 In meinen Kalender</button>${isAdmin()?'<button class="btn sm" data-act="new">+ Termin</button>':''}</div></div>
    <div class="seg" role="group" aria-label="Filter">${[['all','Alle'],['game','Spiele'],['training','Training'],['event','Events']].map(([k,l])=>`<button data-act="filter" data-v="${k}" aria-pressed="${f===k}">${l} ${cnt(k)}</button>`).join('')}</div>
    <h3>Kommend</h3>
    ${up.length?`<div class="evlist">${up.map((e,i)=>evCard(e,i===0?'next':'',i===0)).join('')}</div>`:'<p class="hint">Keine kommenden Termine.</p>'}
    ${past.length?`<button class="chip" data-act="past" style="justify-self:start">${ui.showPast?'Vergangene ausblenden':`Vergangene anzeigen (${past.length})`}</button>`:''}
    ${ui.showPast&&past.length?`<div class="evlist">${past.map(e=>evCard(e,'past',false)).join('')}</div>`:''}
  </div>`;
}
function statusLine(){
  const s=ADM.status; if(!s) return '';
  return `<div class="status ${s.k}" role="status">${esc(s.t)}${s.k==='err'?' <button class="btn sm" data-act="retry" style="margin-left:6px">Erneut versuchen</button>':''}</div>`;
}
function adminBar(){
  if(!isAdmin()) return '';
  return `<div class="adminbar"><span><b>Admin-Ansicht</b><small>${ADM.local?'Nur auf diesem Gerät (ohne GitHub-Schlüssel)':'Änderungen werden direkt gespeichert'}</small></span>
    <button class="btn ghost sm" data-act="logout">Abmelden</button></div>${statusLine()}`;
}
function settingsView(){
  const r=repo();
  return `${adminBar()}<div class="panel"><h2>Optionen</h2>
    <div class="two"><label class="f">Name der App<input id="sApp" maxlength="30" value="${esc(D.appName)}"></label>
    <label class="f">Mannschaft<input id="sTeam" maxlength="40" value="${esc(D.teamName)}"></label></div>
    <h3>Trainingsorte</h3>
    <label class="f">Draußen<input id="sOut" maxlength="40" value="${esc(venueName('out'))}"></label>
    <label class="f">Halle<input id="sIn" maxlength="40" value="${esc(venueName('in'))}"></label>
    <label class="f">Weiterer Ort (optional)<input id="sAlt" maxlength="40" value="${esc(venueName('alt'))}"></label>
    <button class="btn" data-act="saveSettings" style="justify-self:start">Speichern</button></div>
  <div class="panel"><h2>Speicherort</h2>
    ${ADM.local?`<p class="hint">Du arbeitest ohne GitHub-Schlüssel: Änderungen liegen nur auf diesem Gerät. Damit alle sie sehen, lade die Datei herunter und ersetze damit <span class="code">termine.json</span> im Repository – oder melde dich mit Schlüssel an.</p>`
      :`<p class="hint">Repository <span class="code">${esc(r?r.owner+'/'+r.repo:'?')}</span> · Datei <span class="code">termine.json</span>. Nach dem Speichern sehen alle die Änderung nach etwa einer Minute.</p>`}
    <div class="row"><button class="btn ghost sm" data-act="download">termine.json herunterladen</button><button class="btn ghost sm" data-act="icsAll">termine.ics herunterladen</button></div>
    <p class="hint">Die Datei enthält alle Termine. Später übernimmt die Version mit Firebase sie automatisch, wenn sie im selben Repository liegt.</p></div>
  <p class="foot">Version ${APP_VERSION}</p>`;
}
const ICON={home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',events:'<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/>',settings:'<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',unlock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/>'};
function render(){
  if(!D) return;
  if(ui.tab==='settings'&&!isAdmin()) ui.tab='home';
  const words=D.teamName.trim().split(/\s+/);
  document.getElementById('teamName').innerHTML=words.length>1?`${esc(words.slice(0,-1).join(' '))} <em>${esc(words[words.length-1])}</em>`:`<em>${esc(words[0])}</em>`;
  document.getElementById('appName').textContent=D.appName; document.title=D.appName;
  const lb=document.getElementById('lockBtn'); lb.className='lock'+(isAdmin()?' on':''); lb.innerHTML=`<svg viewBox="0 0 24 24" aria-hidden="true">${isAdmin()?ICON.unlock:ICON.lock}</svg>`;
  lb.setAttribute('aria-label',isAdmin()?'Admin: angemeldet':'Admin-Anmeldung');
  const tabs=['home','events',...(isAdmin()?['settings']:[])], lbl={home:'Übersicht',events:'Termine',settings:'Optionen'};
  document.getElementById('tabs').innerHTML=tabs.map(k=>`<button data-tab="${k}" aria-selected="${ui.tab===k}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>${lbl[k]}</button>`).join('');
  const v=document.getElementById('view');
  v.innerHTML=(ui.tab==='events'?eventsView():ui.tab==='settings'?settingsView():homeView())+(ui.tab!=='settings'?`<p class="foot">${esc(D.appName)} · Version ${APP_VERSION}</p>`:'');
  renderModal();
}
let tt=null; function toast(t){const el=document.getElementById('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('on'),2600);}

/* ---------- Dialoge ---------- */
function renderModal(){
  const m=document.getElementById('modal'), M=ui.modal;
  document.body.classList.toggle('modal',!!M);
  if(!M){ m.innerHTML=''; return; }

/* ---------- Änderungen ---------- */
/* Jede Änderung ist ein Schritt (Termin speichern/löschen, Einstellungen). Beim Speichern wird der
   aktuelle Stand vom Server geholt und die Schritte darauf angewendet – so geht nichts verloren,
   wenn zwei Admins kurz nacheinander ändern. */
function applyOp(d,op){
  if(op.k==='put'){ const i=d.events.findIndex(e=>e.id===op.e.id); if(i>=0) d.events[i]=op.e; else d.events.push(op.e); }
  else if(op.k==='del') d.events=d.events.filter(e=>e.id!==op.id);
  else if(op.k==='set') Object.assign(d,op.v);
  return d;
}
function change(ops,msg){
  ops.forEach(op=>applyOp(D,op)); D.updated=Date.now();
  if(ADM.local){ ls.set('at-localdata',JSON.stringify(D)); toast(msg+' (nur auf diesem Gerät)'); render(); return; }
  ADM.queue.push(...ops); toast(msg); render(); scheduleSave();
}
let saveT=null; function scheduleSave(){ clearTimeout(saveT); saveT=setTimeout(flush,700); }
const b64=s=>{ const u=new TextEncoder().encode(s); let b=''; for(let i=0;i<u.length;i+=0x8000) b+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(b); };
const unb64=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));
async function gh(path,opt={}){
  const r=repo(); const res=await fetch(`https://api.github.com/repos/${r.owner}/${r.repo}${path}`,{...opt,headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+ADM.token,'X-GitHub-Api-Version':'2022-11-28',...(opt.body?{'Content-Type':'application/json'}:{})}});
  return res;
}
async function getFile(name){
  const r=repo(), res=await gh(`/contents/${name}?ref=${encodeURIComponent(r.branch)}&t=${Date.now()}`);
  if(res.status===404) return {sha:null,text:null};
  if(!res.ok) throw new Error('get '+res.status);
  const j=await res.json(); return {sha:j.sha,text:j.content?unb64(j.content):''};
}
async function putFile(name,text,sha,msg){
  const r=repo(); const res=await gh(`/contents/${name}`,{method:'PUT',body:JSON.stringify({message:msg,content:b64(text),branch:r.branch,...(sha?{sha}:{})})});
  if(!res.ok){ const e=new Error('put '+res.status); e.status=res.status; throw e; }
  return res.json();
}
async function ghJ(path,opt={}){
  const res=await gh(path,opt.body?{...opt,body:JSON.stringify(opt.body)}:opt);
  if(!res.ok){ const e=new Error(path+' '+res.status); e.status=res.status; throw e; }
  return res.status===204?null:res.json();
}
/* Ein einziger Commit mit allen Dateien: termine.json, termine.ics (Abo) und kal/<id>.ics je Termin.
   Die Einzeldateien braucht das iPhone: nur eine echte Datei im Netz kann es in den Kalender übernehmen. */
async function commitAll(ops){
  const r=repo();
  const ref=await ghJ(`/git/ref/heads/${encodeURIComponent(r.branch)}`), head=ref.object.sha;
  const com=await ghJ(`/git/commits/${head}`);
  const tr=await ghJ(`/git/trees/${com.tree.sha}?recursive=1`), paths=new Set((tr.tree||[]).map(x=>x.path));
  let base=null;
  if(paths.has('termine.json')){ const f=await ghJ(`/contents/termine.json?ref=${head}`); try{ base=JSON.parse(unb64(f.content)); }catch(e){} }
  const next=normalize(base||D); ops.forEach(op=>applyOp(next,op)); next.updated=Date.now(); next.kal=true; next.events.sort(sortUp);
  const files=[{path:'termine.json',content:JSON.stringify(next,null,1)+'\n'},{path:'termine.ics',content:icsText(next.events.filter(e=>e.date>=shiftDate(TODAY,-60)),next.appName)}];
  const want=new Set(next.events.map(e=>'kal/'+e.id+'.ics'));
  next.events.forEach(e=>files.push({path:'kal/'+e.id+'.ics',content:icsText([e],next.appName)}));
  [...paths].filter(p=>/^kal\/[^/]+\.ics$/.test(p)&&!want.has(p)).forEach(p=>files.push({path:p,sha:null}));
  const tree=await ghJ('/git/trees',{method:'POST',body:{base_tree:com.tree.sha,tree:files.map(f=>({path:f.path,mode:'100644',type:'blob',...(f.sha===null?{sha:null}:{content:f.content})}))}});
  const nc=await ghJ('/git/commits',{method:'POST',body:{message:ops.length?`Termine aktualisiert (${ops.length} Änderung${ops.length>1?'en':''})`:'Kalenderdateien angelegt',tree:tree.sha,parents:[head]}});
  await ghJ(`/git/refs/heads/${encodeURIComponent(r.branch)}`,{method:'PATCH',body:{sha:nc.sha,force:false}});
  return next;
}
async function flush(force){
  if(ADM.saving||ADM.local||(!ADM.queue.length&&!force)) return;
  ADM.saving=true; ADM.status={k:'busy',t:'Wird gespeichert …'}; render();
  const ops=ADM.queue.slice();
  try{
    for(let attempt=0;;attempt++){
      try{ const next=await commitAll(ops); D=next; ADM.queue.splice(0,ops.length); break; }
      catch(e){ if((e.status===409||e.status===422)&&attempt<2) continue; throw e; }
    }
    ADM.status={k:'ok',t:ops.length?'✓ Gespeichert – für alle sichtbar in etwa einer Minute.':'✓ Kalenderdateien angelegt.'};
  }catch(e){
    console.error(e);
    ADM.status={k:'err',t:e.status===401||e.status===403||e.status===404?'Speichern abgelehnt – der GitHub-Schlüssel ist ungültig, abgelaufen oder hat keine Schreibrechte.':'Nicht gespeichert – keine Verbindung zu GitHub. Deine Änderungen bleiben auf diesem Gerät, bis es klappt.'};
    ls.set('at-queue',JSON.stringify(ADM.queue));
  }
  ADM.saving=false; if(!ADM.queue.length) ls.set('at-queue',null); render();
  if(ADM.queue.length&&ADM.status.k!=='err') scheduleSave();
}
async function checkToken(tok,silent){
  const r=repo(); if(!r) return false;
  ADM.token=tok;
  try{
    const res=await gh('');
    if(!res.ok) throw Object.assign(new Error('repo'),{status:res.status});
    const j=await res.json();
    if(!(j.permissions&&j.permissions.push)) throw Object.assign(new Error('perm'),{status:403});
    ADM.ok=true; ADM.status=null;
    try{ const q=JSON.parse(ls.get('at-queue')||'[]'); if(q.length){ ADM.queue.push(...q); q.forEach(op=>applyOp(D,op)); scheduleSave(); } }catch(e){}
    if(!ADM.queue.length&&!D.kal) setTimeout(()=>flush(true),300);
    render(); return true;
  }catch(e){
    ADM.ok=false; if(!silent) ADM.status={k:'err',login:true,t:e.status===401?'Der Schlüssel ist ungültig oder abgelaufen.':e.status===403||e.status===404?'Mit diesem Schlüssel kann dieses Repository nicht geändert werden. Bitte Rechte prüfen (Contents: Read and write).':'Keine Verbindung zu GitHub. Bitte später erneut versuchen.'};
    else if(e.status===401||e.status===403){ ls.set('at-token',null); ADM.token=''; }
    render(); return false;
  }
}

/* ---------- Kalender ---------- */
function icsText(events,name){
  const e2=t=>String(t||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
  const fold=l=>{const out=[]; let cur=''; for(const ch of l){ if(new TextEncoder().encode(cur+ch).length>74){out.push(cur); cur=' '+ch;} else cur+=ch; } out.push(cur); return out.join('\r\n');};
  const loc=(d,t)=>d.replace(/-/g,'')+'T'+t.replace(':','')+'00';
  const add=(d,t,min)=>{const x=new Date(Date.UTC(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10),+t.slice(0,2),+t.slice(3,5))+min*60000); return x.toISOString().slice(0,16).replace(/[-:]/g,'')+'00';};
  const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Altliga-Termine//DE','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:'+e2(name),'X-WR-TIMEZONE:Europe/Berlin','REFRESH-INTERVAL;VALUE=DURATION:PT4H','X-PUBLISHED-TTL:PT4H',
    'BEGIN:VTIMEZONE','TZID:Europe/Berlin','BEGIN:DAYLIGHT','TZOFFSETFROM:+0100','TZOFFSETTO:+0200','TZNAME:CEST','DTSTART:19700329T020000','RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU','END:DAYLIGHT',
    'BEGIN:STANDARD','TZOFFSETFROM:+0200','TZOFFSETTO:+0100','TZNAME:CET','DTSTART:19701025T030000','RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU','END:STANDARD','END:VTIMEZONE'];
  events.forEach(e=>{
    const t=isTime(e.time)?e.time:'', mt=isTime(e.meet)&&(!t||e.meet<t)?e.meet:'', tr=e.type==='training';
    const title=(e.cancel?'Abgesagt: ':'')+evTitle(e)+(tr&&!e.cancel?' ('+venueLabel(e.venue||'out')+')':'');
    L.push('BEGIN:VEVENT','UID:'+e.id+'@altliga-termine','DTSTAMP:'+stamp);
    if(t||mt) L.push('DTSTART;TZID=Europe/Berlin:'+loc(e.date,mt||t),'DTEND;TZID=Europe/Berlin:'+add(e.date,t||mt,ICS_DUR[e.type]||120));
    else { const n=shiftDate(e.date,1).replace(/-/g,''); L.push('DTSTART;VALUE=DATE:'+e.date.replace(/-/g,''),'DTEND;VALUE=DATE:'+n); }
    L.push('SUMMARY:'+e2(title));
    if(e.place) L.push('LOCATION:'+e2(e.place));
    const dsc=[e.meet||e.meetAt?'Treffen'+(e.meet?' '+e.meet:'')+(e.meetAt?', '+e.meetAt:''):'',e.meet&&t?startWord(e)+' '+t+' Uhr':'',e.note||''].filter(Boolean).join('\n');
    if(dsc) L.push('DESCRIPTION:'+e2(dsc));
    if(e.cancel) L.push('STATUS:CANCELLED');
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR'); return L.map(fold).join('\r\n')+'\r\n';
}
function download(name,text,type){
  const blob=new Blob([text],{type}), url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
}
function copy(t,msg){ (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast(msg),()=>{ prompt('Kopieren:',t); }); }

document.addEventListener('click',async ev=>{

    case 'goto': ui.tab=v; render(); scrollTo(0,0); break;
    case 'filter': ui.filter=v; render(); break;

    case 'calOpen': ui.modal='cal'; renderModal(); break;
    case 'closeModal': ui.modal=null; ui.form=null; if(ADM.status&&ADM.status.login) ADM.status=null; renderModal(); break;
    case 'copyIcs': copy(pageBase()+'termine.ics','Adresse kopiert'); break;
    case 'icsAll': download('termine.ics',icsText(D.events,D.appName),'text/calendar'); break;
    case 'ics1': ui.cal1=v; ui.modal='cal1'; renderModal(); break;
    case 'ics1file': { const e=D.events.find(x=>x.id===v); if(e) download('termin-'+e.date+'.ics',icsText([e],D.appName),'text/calendar'); break; }
    case 'download': download('termine.json',JSON.stringify(D,null,1)+'\n','application/json'); break;
    case 'login': {
      const tok=(document.getElementById('lToken').value||'').trim(), keep=document.getElementById('lKeep').checked;
      if(!tok) return toast('Bitte den GitHub-Schlüssel einfügen');
      el.disabled=true; el.textContent='Prüfe …';
      if(await checkToken(tok,false)){ if(keep) ls.set('at-token',tok); ADM.local=false; ls.set('at-local',null); ui.modal=null; toast('Angemeldet – du kannst Termine verwalten'); render(); }
      else renderModal();
      break; }
    case 'localMode': ADM.local=true; ls.set('at-local','1'); ls.set('at-localdata',JSON.stringify(D)); ui.modal=null; toast('Admin-Ansicht nur auf diesem Gerät'); render(); break;
    case 'logout':
      if(ADM.queue.length&&!confirmLogout()) return;
      ADM.ok=false; ADM.local=false; ADM.token=''; ADM.status=null; ADM.queue=[]; ls.set('at-token',null); ls.set('at-local',null); ls.set('at-localdata',null); ls.set('at-queue',null);
      ui.tab=ui.tab==='settings'?'home':ui.tab; toast('Abgemeldet'); load(); break;
    case 'retry': flush(); break;
    case 'new': ui.form=blank(); ui.form.place=venueName('out'); ui.modal='form'; renderModal(); break;
    case 'edit': { const e=D.events.find(x=>x.id===v); if(!e) return; ui.form={...blank(),...e,home:e.home!==false}; ui.modal='form'; renderModal(); break; }
    case 'fType': { const f=ui.form; f.type=v; if(v==='training'){ if(!f.time) f.time='19:00'; if(!f.place) f.place=venueName(f.venue||'out'); } else if(venueKeys().some(k=>venueName(k)===f.place)) f.place=''; renderModal(); break; }
    case 'fHome': ui.form.home=v==='1'; renderModal(); break;
    case 'fVenue': { const f=ui.form, old=venueName(f.venue||'out'); f.venue=v; if(!f.place||f.place===old) f.place=venueName(v); renderModal(); break; }
    case 'saveForm': saveForm(); break;
    case 'venue': { const e=D.events.find(x=>x.id===el.dataset.v); if(!e) return; const k=el.dataset.x, old=venueName(e.venue||'out');
      const n={...e,venue:k}; if(!e.place||e.place===old) n.place=venueName(k); change([{k:'put',e:n}],`Training am ${fmtDate(e.date)}: ${venueLabel(k)}`); break; }
    case 'cancel': { const e=D.events.find(x=>x.id===v); if(!e) return; const n={...e}; if(e.cancel) delete n.cancel; else n.cancel=true;
      change([{k:'put',e:n}],n.cancel?`${evTitle(e)} am ${fmtDate(e.date)}: ${CX_WORD[e.type]}`:`${evTitle(e)} findet statt`); break; }
    case 'askDel': ui.confirm='del:'+v; render(); break;
    case 'noDel': ui.confirm=null; render(); break;
    case 'del': ui.confirm=null; change([{k:'del',id:v}],'Termin gelöscht'); break;
    case 'saveSettings': { const g=id=>(document.getElementById(id).value||'').trim();
      change([{k:'set',v:{appName:g('sApp')||'Altliga-Termine',teamName:g('sTeam')||'TSV Selent Altliga',venues:{out:g('sOut'),in:g('sIn'),alt:g('sAlt')}}}],'Optionen gespeichert'); break; }
  }
});
function confirmLogout(){ toast('Erst speichern: Änderungen sind noch nicht bei GitHub'); return false; }
lockBtnInit();
function lockBtnInit(){ document.getElementById('lockBtn').addEventListener('click',()=>{ if(isAdmin()){ ui.tab='settings'; render(); return; } ui.modal='login'; renderModal(); setTimeout(()=>{const i=document.getElementById('lToken'); if(i) i.focus();},50); }); }
function saveForm(){
  const f=ui.form, t=f.type, title=(f.title||'').trim();
  if(!f.date) return toast('Bitte ein Datum wählen');
  if(t!=='training'&&!title) return toast(t==='game'?(f.tour?'Bitte den Namen des Turniers eintragen':'Bitte den Gegner eintragen'):'Bitte eine Bezeichnung eintragen');
  const base={type:t,time:isTime(f.time)?f.time:'',title,place:(f.place||'').trim(),note:(f.note||'').trim()};
  if(isTime(f.meet)) base.meet=f.meet; if((f.meetAt||'').trim()) base.meetAt=f.meetAt.trim().slice(0,60);
  if(t==='game'){ if(f.tour){ base.tour=true; base.home=false; } else base.home=f.home!==false; } else base.home=true;
  if(t==='training') base.venue=['in','alt'].includes(f.venue)?f.venue:'out';
  if(f.id){ const n={id:f.id,date:f.date,...base}; if(f.cancel) n.cancel=true; ui.modal=null; ui.form=null; change([{k:'put',e:n}],'Termin gespeichert'); return; }
  const dates=t==='training'&&f.repeat?seriesDates(f.date,f.until||shiftDate(f.date,364)):[f.date];
  ui.modal=null; ui.form=null;
  change(dates.map(d=>({k:'put',e:{id:uid(),date:d,...base}})),dates.length>1?`${dates.length} Trainings angelegt`:'Termin gespeichert');
}
document.addEventListener('change',ev=>{ if(ui.modal==='form'&&['fTour','fRepeat','fDate'].includes(ev.target.id)){ readForm(); renderModal(); } });
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape'&&ui.modal){ ui.modal=null; ui.form=null; renderModal(); } if(ev.key==='Enter'&&ev.target.id==='lToken'){ const b=document.querySelector('[data-act=login]'); if(b) b.click(); } });
window.addEventListener('beforeunload',e=>{ if(ADM.queue.length){ e.preventDefault(); e.returnValue=''; } });
load();
</script>
