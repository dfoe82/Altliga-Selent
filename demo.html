    const custom=e.poll&&!(e.poll.q===RSVPQ[e.type]&&JSON.stringify(e.poll.opts)===JSON.stringify(RSVP));
    ui.ev={...blankEv(),type:e.type,time:e.time||'',title:e.title||'',home:e.home!==false,place:e.place||'',note:e.note||'',poll:!!e.poll,ptype:custom?'custom':'rsvp',pq:custom?e.poll.q:'',popts:custom?e.poll.opts.join('\n'):'',comments:!!e.comments,pcomments:!!(e.poll&&e.poll.comments)};
    ui.evDetail=null;
    ui.confirmDel=null; render(); toTop(); break;}
  case 'saveEvent': if(can('events')) saveEvent(); break;
  case 'evDrinks': {if(!can('drinks')) return; ui.tab='drinks'; closeForm(); ui.form=true; ui.date=v; const d=S.days.find(x=>x.date===v); if(d){ui.editKey=v; ui.sel=new Set(d.att);} render(); window.scrollTo(0,0); break;}
  case 'editSquad': {const e=S.events.find(x=>x.id===ui.lineup); if(!e||!can('events')) return; closeForm(); ui.form=true; ui.sel=new Set((e.squad&&e.squad.ids||[]).filter(pById)); render(); toTop(); break;}
  case 'saveSquad': {
    const e=S.events.find(x=>x.id===ui.lineup); if(!e||!can('events')) return;
    const sq=e.squad||{ids:[],formation:'4-4-2',slots:{}};
    sq.ids=[...ui.sel]; Object.keys(sq.slots).forEach(k=>{if(!ui.sel.has(sq.slots[k])) delete sq.slots[k];});
    if(sq.free) Object.keys(sq.free).forEach(id=>{if(!ui.sel.has(id)) delete sq.free[id];});
    e.squad=sq; closeForm(); commit(); toast(`Kader mit ${sq.ids.length} Spielern gespeichert`); break;}
  case 'freeEditOn': ui.freeEditing=true; ui.freeSel=null; render(); break;
  case 'freeDone': ui.freeEditing=false; ui.freeSel=null; render(); toast('Aufstellung gespeichert'); break;
  case 'freeAdd': case 'freeBench': case 'freeClear': {
    const e=S.events.find(x=>x.id===ui.lineup); if(!e||!e.squad||!can('events')) return; const sq=e.squad; sq.free=sq.free||{};
    if(a==='freeAdd'){ sq.free[id]=freeSpot(sq); ui.freeSel=id; commit(); toast(`${pname(id)} steht auf dem Feld – jetzt an die richtige Stelle ziehen`); }
    else if(a==='freeBench'){ if(ui.freeSel){ delete sq.free[ui.freeSel]; toast(`${pname(ui.freeSel)} auf der Bank`); ui.freeSel=null; commit(); } }
    else { sq.free={}; ui.freeSel=null; ui.freeEditing=true; commit(); toast('Alle auf der Bank'); }
    break;}
  case 'vote': {const e=S.events.find(x=>x.id===v); if(e&&e.poll&&e.poll.open) doVote(e,+b.dataset.i); break;}
  case 'pollNames': ui.showNames=ui.showNames===v?null:v; render(); break;
  case 'closePoll': {const e=S.events.find(x=>x.id===v); if(e&&e.poll&&can('events')){e.poll.open=false; archivePoll(e); commit(); toast('Umfrage beendet und unter Optionen gespeichert');} break;}
  case 'reopenPoll': {const e=S.events.find(x=>x.id===v); if(e&&e.poll&&can('events')){e.poll.open=true; commit(); toast('Umfrage wieder geöffnet');} break;}
  case 'archNames': ui.openArch=ui.openArch===v?null:v; render(); break;
  case 'askDel': ui.confirmDel=v; render(); break;
  case 'noDel': ui.confirmDel=null; render(); break;
  case 'doDel': {
    const i=v.indexOf(':'), t=v.slice(0,i), k=v.slice(i+1);
    const need={day:'drinks',misc:'misc',event:'events',squad:'events',shift:'events'}[t];
    if(need?!can(need):!isFull()) return;
    ui.confirmDel=null;
    if(t==='admin'){ try{await FB.deleteDoc(D('admins',k)); logAction('Admin entfernt'); toast('Admin entfernt');}catch(e){toast('Keine Berechtigung');} render(); return; }
    if(t==='invite'){ try{await FB.deleteDoc(D('invites',k)); toast('Einladung zurückgezogen');}catch(e){toast('Keine Berechtigung');} render(); return; }
    if(t==='block'){ try{await setCode(k,''); logAction(`Zugang von ${pname(k)} gesperrt`); toast('Zugang gesperrt');}catch(e){toast('Sperren fehlgeschlagen');} render(); return; }
    if(t==='day') S.days=S.days.filter(x=>x.date!==k);
    if(t==='misc') S.misc=S.misc.filter(x=>x.id!==k);
    if(t==='event'){const e=S.events.find(x=>x.id===k); if(e&&e.poll&&Object.keys(e.poll.votes||{}).length&&e.poll.open) archivePoll(e); S.events=S.events.filter(x=>x.id!==k);}
    if(t==='squad'){const e=S.events.find(x=>x.id===k); if(e) delete e.squad;}
    if(t==='shift'){const [eid,sid]=k.split('|'), e=S.events.find(x=>x.id===eid); if(e&&e.shifts){const s=e.shifts.list.find(x=>x.id===sid); if(s) dropSignups(eid,sid,s.self||[]); e.shifts.list=e.shifts.list.filter(x=>x.id!==sid); if(!e.shifts.list.length) delete e.shifts;}}
    if(t==='player'){ if(codeOf(k)) await setCode(k,'').catch(()=>{}); S.players=S.players.filter(p=>p.id!==k); if(S.birth) delete S.birth[k]; }
    if(t==='arch') S.archive=S.archive.filter(x=>x.id!==k);
    if(ui.editKey===k) closeForm();
    commit(); toast('Gelöscht'); break;}
  case 'up': case 'down': if(isFull()){const i=+v, j=a==='up'?i-1:i+1; [S.order[i],S.order[j]]=[S.order[j],S.order[i]]; commit();} break;
  case 'preset': if(isFull()){S.club.c=[...PRESETS[+v].c]; commit(); toast(`Farben „${PRESETS[+v].n}“ übernommen`);} break;
  case 'rmImg': if(isFull()){S.club[v]=''; commit();} break;
  case 'addPlayers': {
    if(!isFull()) return;
    const ta=document.getElementById('newPlayers'); const have=new Set(S.players.map(p=>p.name.toLowerCase()));
    const names=ta.value.split(/[\n,;]+/).map(s=>s.trim().slice(0,20)).filter(s=>s&&!have.has(s.toLowerCase()));
    if(!names.length) return toast('Keine neuen Spitznamen gefunden');
    const added=names.map(n=>{const p={id:uid(),name:n,nr:''}; S.players.push(p); have.add(n.toLowerCase()); return p;});
    commit();
    try{for(const p of added) await setCode(p.id,newCode()); render();}catch(e){toast('Codes konnten nicht erzeugt werden');}
    toast(`${names.length} Spieler hinzugefügt – jetzt einladen`); break;}
  case 'bkNow': if(isFull()){addBackup(JSON.stringify(S),'Manuell'); setTimeout(render,400); toast('Sicherungspunkt angelegt');} break;
  case 'bkRestore': {if(!isFull()) return; const bk=loadBackups().find(x=>x.id===v); if(!bk) return; ui.confirmDel=null; restoreFrom(bk.data,'Wiederherstellung'); toast(`Stand vom ${fmtTs(bk.ts)} wiederhergestellt`); break;}
  case 'exportFile': {
    if(!isFull()) return;
    try{const blob=new Blob([exportJson()],{type:'application/json'}); const url=URL.createObjectURL(blob); const link=document.createElement('a');
      link.href=url; link.download=`${slug(S.appName)}_${stamp()}.json`; document.body.appendChild(link); link.click(); link.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
      logAction('Sicherung exportiert');}catch(e){toast('Speichern als Datei nicht möglich – bitte „Als Text kopieren“ nutzen');}
    break;}
  case 'exportCopy': if(isFull()){copy(exportJson()); logAction('Sicherung als Text kopiert');} break;
  case 'importDo': {if(!isFull()) return; try{const d=parseImport(ui.importText); ui.confirmDel=null; restoreFrom(JSON.stringify(d),'Import'); toast('Sicherung eingespielt');}catch(e){toast('Die Datei ist keine gültige Sicherung');} break;}
  case 'reset':
    if(!isFull()) return;
    if(v==='ask'){ui.confirmReset=true;render();}
    else if(v==='cancel'){ui.confirmReset=false;render();}
    else{ addBackup(JSON.stringify(S),'Vor Zurücksetzen');
      const keep={teamName:S.teamName,fee:S.fee,rate:S.rate,paypal:S.paypal,order:S.order,club:S.club,statsPublic:S.statsPublic,showSeason:S.showSeason};
      S = v==='sample'?{...sample(),club:keep.club}:{...emptyState(),...keep,demoCodes:{},demoMembers:[],demoLog:S.demoLog};
      normalize(); ui.confirmReset=false; closeForm(); save(); logAction('Daten zurückgesetzt'); render(); toast(v==='sample'?'Beispieldaten geladen':'Daten geleert'); }
    break;
  }
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='fDate') ui.date=t.value;
  else if(t.id==='fTitle') ui.draft.title=t.value;
  else if(t.id==='fAmount'){ui.draft.amount=t.value; const c=document.getElementById('selCount'); if(c) c.innerHTML=countText();}
  else if(t.id==='pSearch') filterPicker(t.value);
  else if(t.id==='eTime') ui.ev.time=t.value;
  else if(t.id==='eTitle') ui.ev.title=t.value;
  else if(t.id==='ePlace') ui.ev.place=t.value;
  else if(t.id==='eNote') ui.ev.note=t.value;
  else if(t.id==='ePq') ui.ev.pq=t.value;
  else if(t.id==='ePopts') ui.ev.popts=t.value;
  else if(t.id==='eWeeks') ui.ev.weeks=t.value;
  else if(t.id==='gateCode'){const c=normCode(t.value).slice(0,8); const f=c.length>4?c.slice(0,4)+'-'+c.slice(4):c; if(t.value!==f) t.value=f;}
  else if(t.dataset.col&&isFull()){S.club.c[+t.dataset.col]=t.value; applyTheme();}
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&ui.modal){ui.modal=null;renderModal();}
  if(ev.key==='Enter'&&ev.target.id==='gateCode'&&!ui.modal){ev.preventDefault();const g=document.querySelector('[data-act="gateGo"]'); if(g) g.click();}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.classList.contains('voterSel')){ui.voter=t.value; ls.set('mk-demo-voter',t.value); render(); return;}
  if(t.id==='ePoll'){ui.ev.poll=t.checked; render(); return;}
  if(t.id==='eComments'){ui.ev.comments=t.checked; return;}
  if(t.id==='ePollCmt'){ui.ev.pcomments=t.checked; return;}
  if(t.id==='eRepeat'){ui.ev.repeat=t.checked; render(); return;}
  if(t.id==='fDate'){ui.date=t.value; return;}
  if(t.id==='shSelf'&&can('events')){const e=S.events.find(x=>x.id===ui.evDetail); if(e){e.shifts=e.shifts||{self:true,list:[]}; e.shifts.self=t.checked; commit(); toast(t.checked?'Spieler können sich selbst eintragen':'Nur das Orga-Team teilt ein');} return;}
  if(t.id==='lFormation'&&can('events')){const e=S.events.find(x=>x.id===ui.lineup); if(e){e.squad=e.squad||{ids:[],formation:'4-4-2',slots:{}}; const sq=e.squad, prev=sq.formation; sq.formation=t.value; ui.freeSel=null;
    if(t.value===FREE){ /* Start mit den Positionen des bisherigen Systems */
      if(!sq.free||!Object.keys(sq.free).length){ sq.free={}; const P=FORMS[prev]||FORMS['4-4-2']; /* Positionen derselben Reihe (z. B. Abwehrkette) auf eine Höhe bringen, damit sie im Raster nicht verrutschen */
        const lineY=y=>{const near=P.filter(f=>Math.abs(f[2]-y)<=8); return near.reduce((a,f)=>a+f[2],0)/near.length;};
        Object.entries(sq.slots||{}).forEach(([k,pid])=>{const c=P[+k]; if(c&&sq.ids.includes(pid)) sq.free[pid]={x:c[1],y:lineY(c[2])};}); }
      if(sq.grid==null) sq.grid=5; snapAll(sq);
      ui.freeEditing=true; toast('Freie Aufstellung: Spieler auf dem Feld ziehen');
    }else{ const n=FORMS[t.value].length; Object.keys(sq.slots||{}).forEach(k=>{if(+k>=n) delete sq.slots[k];}); }
    commit();} return;}
  if(t.id==='lGrid'&&can('events')){const e=S.events.find(x=>x.id===ui.lineup); if(e&&e.squad){e.squad.grid=+t.value; snapAll(e.squad); ui.freeSel=null; ui.freeEditing=true; commit(); toast(+t.value?`Raster: ${GRIDS[t.value]}`:'Ohne Raster – ganz frei');} return;}
  if(t.dataset.slot!==undefined&&can('events')){const e=S.events.find(x=>x.id===ui.lineup); if(e&&e.squad){const sl=e.squad.slots; Object.keys(sl).forEach(k=>{if(sl[k]===t.value) delete sl[k];}); if(t.value) sl[t.dataset.slot]=t.value; else delete sl[t.dataset.slot]; commit();} return;}
  if(t.id==='importFile'&&isFull()){const f=t.files&&t.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{try{parseImport(r.result); ui.importText=r.result; ui.confirmDel='import'; render();}catch(e){toast('Die Datei ist keine gültige Sicherung');}}; r.readAsText(f); return;}
  if(!isFull()) return;
  if(t.id==='sTeam'){S.teamName=t.value.trim();commit();}
  else if(t.id==='sSeason'){S.showSeason=t.checked;commit();}
  else if(t.id==='sAppName'){S.appName=t.value.trim().slice(0,30)||'Mannschaftskasse';commit();}
  else if(t.id==='sFee'){S.fee=Math.max(0,parseFloat(t.value)||0);commit();}
  else if(t.id==='sRate'){S.rate=Math.max(0,parseFloat(t.value)||0);commit();}
  else if(t.id==='sPaypal'){S.paypal=t.value.trim();commit();}
  else if(t.dataset.use){S.club[t.dataset.use]=t.checked;commit();}
  else if(t.dataset.col){S.club.c[+t.dataset.col]=t.value;commit();}
  else if(t.dataset.img){const key=t.dataset.img; readImg(t.files&&t.files[0],url=>{S.club[key]=url; commit(); toast(key==='crest'?'Wappen gespeichert':'Logo gespeichert');});}
  else if(t.dataset.name){const p=pById(t.dataset.name); if(p&&t.value.trim()){p.name=t.value.trim().slice(0,20);commit();}}
  else if(t.dataset.nr){const p=pById(t.dataset.nr); if(p){p.nr=t.value.replace(/\D/g,'').slice(0,3);commit();}}
  else if(t.dataset.birth){S.birth=S.birth||{}; if(t.value) S.birth[t.dataset.birth]=t.value; else delete S.birth[t.dataset.birth]; commit();}
});
function copy(text,msg){
  const done=()=>toast(msg||'Kopiert');
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){toast('Kopieren nicht möglich')}ta.remove();};
  try{navigator.clipboard.writeText(text).then(done,fallback)}catch(e){fallback()}
}

/* ---------- Fernsteuerung für die Präsentationsseite (nur Demo) ---------- */
if(!LIVE_MODE) window.addEventListener('message',ev=>{
  const d=ev.data; if(!d||d.mk!=='present') return;
  if(d.reset){ ls.set(KEY,null); ls.set(BKEY,null); S=sample(); normalize(); lastSaved=JSON.stringify(S); save(); }
  ui.modal=null; renderModal(); closeForm();
  Object.assign(ui,{person:null,lineup:null,evDetail:null,reportEdit:false,confirmDel:null,confirmReset:false,demoPublic:false,showNames:null,onlyOpen:false,evView:'list',view:'list',mode:'month',y:NOW.getFullYear(),m:NOW.getMonth()});
  const debtor=()=>{const yr=yearMonths(NOW.getFullYear()); const l=sorted().map(p=>({p,o:MONEY.reduce((a,k)=>a+calc(k,p.id,yr).open,0)})).filter(x=>x.o>0).sort((a,b)=>b.o-a.o); return l.length?l[Math.min(2,l.length-1)].p.id:'';};
  if(d.role==='admin'){ui.demoAdmin='demo-full';ui.adminView=true;}
  else if(d.role==='trainer'){ui.demoAdmin='demo-part';ui.adminView=true;}
  else if(d.role==='player'){ui.demoAdmin=null;ui.adminView=false;ui.voter=debtor();}
  else if(d.role==='public'){ui.demoAdmin=null;ui.adminView=false;ui.demoPublic=true;}
  const nextGame=S.events.filter(e=>e.type==='game'&&e.date>=TODAY&&e.squad).sort((a,b)=>a.date.localeCompare(b.date))[0];
  const reported=S.events.filter(e=>reportOf(e.id)).sort((a,b)=>b.date.localeCompare(a.date))[0];
  switch(d.view){
    case 'events': ui.tab='events'; break;
    case 'roster': ui.tab='roster'; break;
    case 'settings': ui.tab='settings'; ui.playersOpen=d.scroll==='#pnl-players'; break;
    case 'drinks-form': {ui.tab='drinks'; ui.form=true; ui.date=TODAY; const ld=lastDay(); if(ld) ui.sel=new Set(ld.att.filter(pById)); break;}
    case 'drinks-table': ui.tab='drinks'; ui.view='table'; break;
    case 'stats': ui.tab='events'; ui.evView='stats'; ui.statType=d.stat||'training'; break;
    case 'report': ui.tab='events'; ui.evDetail=reported?reported.id:null; break;
    case 'lineup': ui.tab='events'; ui.lineup=nextGame?nextGame.id:null; break;
    case 'shifts': {ui.tab='events'; const ev=S.events.filter(e=>e.date>=TODAY&&shiftsOf(e).length).sort((a,b)=>a.date.localeCompare(b.date))[0]; ui.evDetail=ev?ev.id:null; break;}
    case 'person': ui.person=ui.voter||debtor(); break;
    default: ui.tab='home';
  }
  render(); window.scrollTo(0,0);
  if(d.scroll) setTimeout(()=>{const el=document.querySelector(d.scroll); if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-8,behavior:'smooth'});},80);
});

/* ---------- Start ---------- */
if(LIVE_MODE){
  render();
  initFirebase().catch(e=>{console.error(e); AUTH.ready=true; AUTH.gate='error'; AUTH.error='Die App konnte nicht geladen werden. Bitte Internetverbindung prüfen.'; render();});
}else{
  try{S=JSON.parse(ls.get(KEY))}catch(e){}
  if(!S||!S.players||(S.sample&&S.sampleV!==43)) S=sample();
  normalize(); lastSaved=JSON.stringify(S); render();
}
</script>
