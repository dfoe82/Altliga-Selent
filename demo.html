<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0E2F7A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kasse">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mannschaftskasse</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout „Trikot“: Kopf in Vereinsfarbe mit Streifen, Wappen und Schloss; Spieler lesen mit persönlichem Code, Admins bearbeiten je nach Rechten */
:root{
  --bg:#E9EDF5; --surface:#FFFFFF; --ink:#0B1530; --muted:#5B6584; --line:#D5DCE8;
  --c1:#0E2F7A; --c2:#FFD21F; --c3:#D7263D; --c4:#0F8580;
  --on-c1:#FFFFFF; --on-c2:#0B1530;
  --team:#0E2F7A; --drinks:#FFD21F; --misc:#D7263D; --events:#0F8580;
  --ok:#17834A; --ok-bg:#E3F4EA; --due:#C2342B; --due-bg:#FBE7E5; --warn:#9A6400; --warn-bg:#FFF2D6;
  --chip:#E3E8F1; --paypal:#0B5CB5;
  --sec:var(--c1); --on-sec:#FFFFFF;
  --tb:0px;
  --fs:clamp(13.5px,0.45vw + 12px,15.5px); --pad:clamp(10px,2.4vw,16px); --gap:clamp(8px,1.8vw,14px);
  --h1:clamp(22px,3.2vw + 10px,38px); --big:clamp(26px,3vw + 14px,40px); --kbig:clamp(19px,2.2vw + 10px,30px);
  --gbig:clamp(28px,3.4vw + 14px,44px); --ctl:clamp(38px,6vw,44px);
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C111C; --surface:#151D2C; --ink:#E9EEF6; --muted:#97A3B8; --line:#263247;
  --ok:#4CC98A; --ok-bg:#12321F; --due:#FF7A70; --due-bg:#3A1A1A; --warn:#F2B84B; --warn-bg:#3A2C10;
  --chip:#202B3E; --paypal:#6FB2FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C111C; --surface:#151D2C; --ink:#E9EEF6; --muted:#97A3B8; --line:#263247;
  --ok:#4CC98A; --ok-bg:#12321F; --due:#FF7A70; --due-bg:#3A1A1A; --warn:#F2B84B; --warn-bg:#3A2C10;
  --chip:#202B3E; --paypal:#6FB2FF; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs);line-height:1.4;font-variant-numeric:tabular-nums;padding-bottom:var(--tb)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--c1)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* Kopf */
header{background:var(--c1);color:var(--on-c1);position:relative;overflow:hidden;
  background-image:repeating-linear-gradient(115deg,transparent 0 26px,color-mix(in srgb,var(--on-c1) 8%,transparent) 26px 40px)}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--c2)}
header .wrap{padding-block:clamp(10px,2.4vw,22px) clamp(14px,2.6vw,24px);display:flex;align-items:center;gap:clamp(10px,2vw,14px)}
.crest{height:clamp(36px,6vw,60px);width:auto;max-width:72px;object-fit:contain;flex:none;filter:drop-shadow(0 2px 4px #0004)}
.htxt{flex:1 1 auto;min-width:0}
.eyebrow{font-size:clamp(10px,1.2vw + 6px,12px);letter-spacing:.18em;text-transform:uppercase;opacity:.78;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1{font-family:var(--display);font-weight:400;font-size:var(--h1);line-height:.95;margin:3px 0 0;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance;overflow-wrap:anywhere}
h1 em{font-style:normal;color:var(--c2)}
.logo2{height:clamp(26px,4vw,40px);width:auto;max-width:96px;object-fit:contain;flex:none}
.score{display:flex;gap:18px;flex:none}
.score div{text-align:right}
.score b{display:block;font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1;color:var(--c2)}
.score span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.adminbtn{flex:none;align-self:flex-start;width:40px;height:40px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--on-c1) 45%,transparent);background:color-mix(in srgb,var(--c1) 70%,#000);color:var(--on-c1);display:grid;place-items:center;padding:0}
.adminbtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.adminbtn.on{background:var(--c2);color:var(--on-c2);border-color:var(--c2)}
.adminbtn.half{border-color:var(--c2)}

nav.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--c1) 78%,#000)}
nav.top .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.top .wrap::-webkit-scrollbar{display:none}
nav.top button{flex:1 0 auto;background:none;border:0;color:color-mix(in srgb,var(--on-c1) 65%,transparent);padding:12px 10px 10px;font-family:var(--display);font-size:16px;letter-spacing:.05em;text-transform:uppercase;border-bottom:4px solid transparent;white-space:nowrap}
nav.top button[aria-selected="true"]{color:var(--on-c1);border-bottom-color:var(--c2)}
nav.top:empty,.tabbar:empty{display:none!important}
.tabbar{display:none}

/* Grundbausteine */
main .wrap{padding-block:var(--gap) 40px;display:grid;grid-template-columns:minmax(0,1fr);gap:var(--gap)}
.minis>*,.kassen>*,.plist>*{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:var(--pad);display:grid;gap:clamp(8px,1.6vw,12px);min-width:0}
.panel.form{border-top:5px solid var(--sec);padding-bottom:0}
.panel.form.nobar{padding-bottom:var(--pad)}
.panel h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0;letter-spacing:.03em;line-height:1.15;text-transform:uppercase}
.panel h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:2px 0 0;font-weight:700}
.hint{color:var(--muted);font-size:13.5px;margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.tight{gap:6px}
.grow{flex:1 1 180px;min-width:0}
.spread{justify-content:space-between}
.adminbar{display:flex;justify-content:space-between;align-items:center;gap:8px;background:color-mix(in srgb,var(--c2) 22%,var(--surface));border:1px solid color-mix(in srgb,var(--c2) 70%,var(--line));border-radius:6px;padding:6px 6px 6px 12px;font-size:13px;font-weight:600;flex-wrap:wrap}
.adminbar small{display:block;font-weight:500;color:var(--muted)}
.demo{font-size:12.5px;background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:8px 12px;font-weight:600}

.summary{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:2px}
.summary .big{font-family:var(--display);font-weight:400;font-size:var(--big);line-height:1;color:var(--ink)}
.summary .lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--chip);border-radius:6px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:4px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px #0002}
.seg.wide{display:flex}
.seg.wide button{flex:1;padding-inline:6px}
.period{display:flex;align-items:center;gap:6px;margin-left:auto}
.period b{min-width:132px;text-align:center;font-family:var(--display);font-weight:400;font-size:18px;letter-spacing:.03em;text-transform:uppercase}
.icon{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:6px;display:grid;place-items:center;font-size:17px;line-height:1;flex:none;padding:0}

label.f{display:grid;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600;min-width:0}
input[type=text],input[type=email],input[type=number],input[type=date],input[type=time],input[type=search],input[type=password],select,textarea{
  display:block;width:100%;min-width:0;max-width:100%;border:1px solid var(--line);background:var(--bg);border-radius:6px;color:var(--ink);
  padding:7px 10px;min-height:var(--ctl);font-size:16px;-webkit-appearance:none;appearance:none;text-align:left}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left}
textarea{min-height:84px;resize:vertical}
.check{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.check input{width:20px;height:20px;flex:none;accent-color:var(--sec)}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.btn{border:0;border-radius:6px;padding:7px 14px;font-weight:700;background:var(--sec);color:var(--on-sec);min-height:var(--ctl);white-space:nowrap;letter-spacing:.01em;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.danger{background:var(--due);color:#fff}
.btn.soft-danger{background:var(--due-bg);color:var(--due)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn.pp{background:var(--paypal);color:#fff}
.linkbtn{border:0;background:none;padding:4px 0;color:var(--muted);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--sec);border-color:var(--sec);color:var(--on-sec)}
.nmb{border:0;background:none;padding:0;font-weight:600;text-align:left;color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nmb:hover{text-decoration:underline}
.nr{width:clamp(30px,5vw,38px);height:clamp(30px,5vw,38px);flex:none;display:grid;place-items:center;font-family:var(--display);font-size:19px;color:var(--on-c1);background:var(--c1);border-radius:4px;line-height:1}
.nr.sm{font-size:15px}
.badge{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;border-radius:4px;padding:2px 7px;background:var(--chip);color:var(--ink);white-space:nowrap}
.badge.nx{background:var(--c2);color:var(--on-c2)}
.badge.tr{background:color-mix(in srgb,var(--events) 18%,var(--surface))}

/* Zugang */
.gate{max-width:440px;justify-self:center;width:100%;border-top:6px solid var(--c1)}
.gate .crestbig{height:72px;width:auto;justify-self:center}
.codein{font-family:var(--display)!important;font-size:24px!important;letter-spacing:.12em;text-transform:uppercase;text-align:center!important}
.mine{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c2);border-radius:6px;padding:10px 12px}
.mine .lb{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mine .nm{font-weight:700}
.mine .amt{font-family:var(--display);font-weight:400;font-size:24px;line-height:1}
.mine .acts2{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}

/* Personenauswahl */
.pick-tools{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.pgh{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:2px}
.picklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.picklist:empty{display:none}
.pick{display:flex;align-items:center;gap:8px;min-height:var(--ctl);padding:6px 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);text-align:left;font-size:14.5px;font-weight:500;user-select:none;-webkit-user-select:none;min-width:0}
.pick .pn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick .box{flex:none;width:22px;height:22px;border-radius:4px;border:1.5px solid var(--line);display:grid;place-items:center;color:transparent;font-size:14px;font-weight:700}
.pick[aria-pressed="true"]{border-color:var(--sec);background:color-mix(in srgb,var(--sec) 14%,var(--surface))}
.pick[aria-pressed="true"] .box{background:var(--sec);border-color:var(--sec);color:var(--on-sec)}
.savebar{position:sticky;bottom:var(--tb);margin:4px calc(var(--pad) * -1) 0;padding:10px var(--pad) calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);border-radius:0 0 6px 6px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;z-index:3}
.savebar .count{font-weight:700}
.savebar .count small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}

/* Listen */
.list{display:grid;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:clamp(7px,1.6vw,11px) 0;border-bottom:1px solid var(--line);align-items:center}
.item .meta{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.nums{display:flex;gap:16px;justify-content:flex-end;text-align:right}
.nums small{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.nums .open{font-weight:700;color:var(--due)}
.nums .zero{color:var(--ok)}
.acts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:12.5px;border-radius:999px;padding:6px 11px;border:1px solid var(--line);background:var(--surface);font-weight:600;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:5px}
.pill.pp{background:var(--paypal);border-color:var(--paypal);color:#fff}
.pill.paid{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.pill.mark{color:var(--muted)}
.purpose{font-size:12.5px;color:var(--muted);align-self:center}

.entries{display:grid}
.entry{display:flex;justify-content:space-between;gap:8px;padding:clamp(7px,1.5vw,10px) 0;border-bottom:1px dashed var(--line);align-items:center}
.entry:last-child{border-bottom:0}
.entry .info{min-width:0;flex:1;background:none;border:0;padding:0;text-align:left}
.entry .t{font-weight:600}
.entry .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.entry .tools{display:flex;flex:none;align-items:center}
.confirm{background:var(--due-bg);border-radius:6px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-block:2px}
.confirm .t{font-weight:600}
.confirm .ask{display:flex;gap:6px;align-items:center;font-size:13.5px;color:var(--due);font-weight:600;flex-wrap:wrap}
.confirm .btn{min-height:36px;padding:5px 12px;font-size:13.5px}
.x{border:0;background:none;color:var(--muted);font-size:20px;padding:6px 10px;border-radius:6px;line-height:1}
.x:hover{color:var(--due);background:var(--due-bg)}
.edit{border:0;background:none;color:var(--muted);font-size:13px;padding:6px 8px;border-radius:6px;font-weight:600}
.edit:hover{background:var(--chip)}

/* Übersicht */
.kassen{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.k{display:grid;gap:3px;text-align:left;background:var(--surface);border:1px solid var(--line);border-bottom:5px solid var(--c);border-radius:4px;padding:clamp(8px,1.8vw,12px);min-width:0}
.k .lb{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.k .big{font-family:var(--display);font-weight:400;font-size:var(--kbig);line-height:1}
.k .s{font-size:12px;color:var(--muted)}
.bar{height:5px;border-radius:3px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.gesamt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center;background:var(--c1);color:var(--on-c1);border-radius:4px;padding:clamp(10px,2vw,14px) var(--pad);position:relative;overflow:hidden;
  background-image:repeating-linear-gradient(115deg,transparent 0 26px,color-mix(in srgb,var(--on-c1) 7%,transparent) 26px 40px)}
.gesamt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c2)}
.gesamt .lb{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.gesamt .big{font-family:var(--display);font-weight:400;font-size:var(--gbig);line-height:1;color:var(--c2)}
.gesamt .side{text-align:right;font-size:13px;line-height:1.5}
.gesamt .side b{font-weight:700}
.hd{font-family:var(--display);font-weight:400;font-size:19px;text-transform:uppercase;letter-spacing:.03em;display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:4px 0 -4px}
.hd span{font-family:var(--body);font-size:12.5px;color:var(--muted);text-transform:none;letter-spacing:0}
.plist{display:grid;gap:clamp(4px,1vw,6px)}
.sechead{display:grid;gap:8px}
.sechead .seg button[aria-pressed="true"]{box-shadow:inset 0 -3px 0 var(--c),0 1px 2px #0002}
.p{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:clamp(5px,1.2vw,8px) 12px clamp(5px,1.2vw,8px) clamp(5px,1.2vw,8px);text-align:left;width:100%}
.p .n{flex:1;min-width:0;font-weight:600}
.p .n div{font-size:12.5px;color:var(--muted);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p .v{font-family:var(--display);font-weight:400;font-size:19px;color:var(--due);white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:0}
.minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}
.mini{display:grid;grid-template-columns:50px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:0;text-align:left;overflow:hidden;min-width:0}
.mini .md{background:var(--c2);color:var(--on-c2);display:grid;align-content:center;justify-items:center;line-height:1.05;padding:6px 0}
.mini .md b{font-family:var(--display);font-weight:400;font-size:22px}
.mini .md i{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.mini.tr .md{background:var(--events);color:var(--on-sec)}
.mini.evt .md{background:var(--chip);color:var(--ink)}
.mini .mt{padding:7px 10px;min-width:0;display:grid;gap:1px}
.mini .ml{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mini .mv{font-family:var(--display);font-weight:400;font-size:17px;line-height:1.15;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .ms{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .ms b{color:var(--ink);font-weight:700}

/* Termine & Umfragen */
.evlist{display:grid;gap:8px}
.ev{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px 12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.ev.next{border-left:5px solid var(--c2)}
.ev.past{opacity:.78}

async function persistLive(){
  if(!AUTH.admin) return;
  const parts=partsOf(S), changed=[], ops=[];
  for(const k of partList()){const j=JSON.stringify(parts[k]); if(j!==LIVE.synced[k]){changed.push(k); ops.push({ref:D('team',k),data:parts[k],k,j});}}
  const evRight=AUTH.admin.role!=='part'||(AUTH.admin.areas||[]).includes('events');
  if(evRight) Object.entries(LIVE.migrate).forEach(([eid,r])=>ops.push({ref:D('reports',eid),data:clean(r),mig:eid}));
  if(LIVE.balLoaded&&LIVE.pubJson!==undefined){
    const pub=publicOf(S), pj=stable(pub); if(pj!==LIVE.pubJson) ops.push({ref:D('team','public'),data:pub,pub:pj});
    const seen=new Set();
    S.players.forEach(p=>{seen.add(p.id); const b=balanceOf(p.id), bj=stable(b); if(bj!==LIVE.balances[p.id]) ops.push({ref:D('balances',p.id),data:b,bal:p.id,j:bj});});
    Object.keys(LIVE.balances).forEach(pid=>{if(!seen.has(pid)) ops.push({ref:D('balances',pid),del:true,bal:pid});});
  }
  if(!ops.length) return;
  ops.forEach(o=>{ if(o.mig) delete LIVE.migrate[o.mig]; if(o.k) LIVE.synced[o.k]=o.j; if(o.pub) LIVE.pubJson=o.pub; if(o.bal){ if(o.del) delete LIVE.balances[o.bal]; else LIVE.balances[o.bal]=o.j; } });
  try{
    for(let i=0;i<ops.length;i+=400){const b=FB.writeBatch(FB.db); ops.slice(i,i+400).forEach(o=>o.del?b.delete(o.ref):b.set(o.ref,o.data)); await b.commit();}
    lastSaved=JSON.stringify(S);
    if(changed.length) logAction(changed.map(k=>PART_LABEL[k]).join(', ')+' geändert');
  }catch(e){
    console.warn(e); changed.forEach(k=>delete LIVE.synced[k]); LIVE.pubJson='?';
    toast(e&&e.code==='permission-denied'?'Keine Berechtigung für diese Änderung':'Speichern fehlgeschlagen – bitte Verbindung prüfen');
    buildS(); render();
  }
}

function addBackup(json,label){
  const b={ts:Date.now(),name:S.appName||'Mannschaftskasse',label,data:stripImages(json)};
  if(AUTH.mode==='live'){ if(!AUTH.admin) return; FB.setDoc(D('backups',String(b.ts)),{...b,by:AUTH.admin.name}).catch(e=>console.warn(e)); return; }
  const list=loadBackups(); list.push({id:uid(),...b});
  while(list.length>MAXB) list.shift();
  while(list.length&&!ls.set(BKEY,JSON.stringify(list))) list.shift();
}
function autoBackup(){
  if(S.sample) return;
  const last=+(ls.get('mk-lastbk')||0);
  if(Date.now()-last>AUTO_GAP){ addBackup(lastSaved,'Automatisch'); ls.set('mk-lastbk',String(Date.now())); }
}
function restoreFrom(json,label){
  addBackup(JSON.stringify(S),'Vor '+label);
  const o=JSON.parse(json); const keep={crest:S.club.crest,logo:S.club.logo,demoCodes:S.demoCodes,demoMembers:S.demoMembers,demoLog:S.demoLog,demoComments:S.demoComments};
  const votes=Object.fromEntries(S.events.filter(e=>e.poll).map(e=>[e.id,e.poll.votes]));
  S=o; normalize();
  if(!S.club.crest) S.club.crest=keep.crest; if(!S.club.logo) S.club.logo=keep.logo;
  if(AUTH.mode==='demo') Object.assign(S,{demoCodes:keep.demoCodes,demoMembers:keep.demoMembers,demoLog:keep.demoLog,demoComments:keep.demoComments});
  else S.events.forEach((e,i)=>{if(e.poll) e.poll.votes=votes[e.id]||{}; if(e.shifts) S.events[i]=withSignups(e);});
  S.sample=false; save(); closeForm(); render(); logAction(label+' durchgeführt');
}

/* ---------- Zugangscodes ---------- */
function codeOf(pid){return AUTH.mode==='live'?LIVE.codes[pid]||'':(S.demoCodes||{})[pid]||'';}
function memberList(){return AUTH.mode==='live'?LIVE.members:(S.demoMembers||[]);}
function playerStatus(pid){
  const code=codeOf(pid);
  if(!code) return {code:'',text:'Kein Zugang',cls:'off'};
  const ms=memberList().filter(m=>m.p===pid&&m.code===code);
  if(!ms.length) return {code,text:'Eingeladen · noch nicht geöffnet',cls:'wait'};
  const seen=Math.max(...ms.map(m=>m.seen||0));
  return {code,text:`Aktiv${ms.length>1?` · ${ms.length} Geräte`:''}${seen?' · zuletzt '+fmtDay(seen):''}`,cls:'ok'};
}
async function setCode(pid,code){
  if(AUTH.mode==='live'){
    const old=LIVE.codes[pid]; const b=FB.writeBatch(FB.db);
    if(old) b.delete(D('codes',old));
    if(code) b.set(D('codes',code),{p:pid,created:Date.now()});
    await b.commit();
  }else{ S.demoCodes=S.demoCodes||{}; if(code) S.demoCodes[pid]=code; else delete S.demoCodes[pid]; save(); }
}
const appLink=code=>location.origin+location.pathname+(code?'#c='+code:'');
function inviteText(p,code){
  return `Hallo ${p.name}, hier ist dein persönlicher Zugang zur App „${S.appName}“ (${S.teamName}):\n${appLink(code)}\n\nDein Code: ${fmtCode(code)}\nBitte nicht weitergeben.\n\nTipp fürs iPhone: Link in Safari öffnen, auf Teilen → „Zum Home-Bildschirm“ tippen. Falls die App dort noch einmal fragt, gib den Code ein.`;
}
async function shareInvite(pid){
  const p=pById(pid), code=codeOf(pid); if(!p||!code) return;
  const text=inviteText(p,code);
  if(navigator.share){ try{await navigator.share({text}); return;}catch(e){ if(e&&e.name==='AbortError') return; } }
  copy(text,'Einladung kopiert – jetzt z. B. in WhatsApp einfügen');
}
function loadQrLib(){
  if(window.QRCode) return Promise.resolve();
  return new Promise((res,rej)=>{const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js'; s.onload=res; s.onerror=rej; document.head.appendChild(s);});
}

const lastDueMonth=y=>y<NOW.getFullYear()?11:(y===NOW.getFullYear()?NOW.getMonth():-1);
const yearMonths=y=>Array.from({length:lastDueMonth(y)+1},(_,i)=>mk(y,i));
function monthsInView(){return ui.mode==='month'?[mk(ui.y,ui.m)]:yearMonths(ui.y)}
const periodLabel=()=>ui.mode==='month'?`${MONTHS[ui.m]} ${ui.y}`:`${ui.y}`;

function calc(sec,pid,months){
  let soll=0,paid=0,meta='';
  if(sec==='team'){
    let n=0; months.forEach(k=>{soll+=S.fee; if(S.paid.team[pid+'|'+k]){paid+=S.fee;n++}});
    meta = months.length>1 ? `${n} von ${months.length} Monaten bezahlt` : `Beitrag ${eur(S.fee)}`;
  }else if(sec==='drinks'){
    let days=0; months.forEach(k=>{const d=S.days.filter(x=>x.date.startsWith(k)&&x.att.includes(pid)).length; days+=d; const s=d*S.rate; soll+=s; if(S.paid.drinks[pid+'|'+k]) paid+=s;});
    meta=`${days} ${days===1?'Tag':'Tage'} × ${eur(S.rate)}`;
  }else{
    const es=S.misc.filter(e=>months.includes(e.date.slice(0,7))&&e.persons.includes(pid));
    es.forEach(e=>{soll+=e.amount; if(e.paid.includes(pid)) paid+=e.amount;});
    meta=es.length?es.map(e=>e.title).join(', '):'Keine Posten';
  }
  return {soll,paid,open:r2(soll-paid),meta};
}
function totalOpen(sec,months){return r2(S.players.reduce((a,p)=>a+calc(sec,p.id,months).open,0))}
function totalSoll(sec,months){return S.players.reduce((a,p)=>a+calc(sec,p.id,months).soll,0)}

function togglePaid(sec,pid,k){
  if(sec==='misc'){
    const es=S.misc.filter(e=>e.date.startsWith(k)&&e.persons.includes(pid));
    const all=es.every(e=>e.paid.includes(pid));
    es.forEach(e=>{e.paid=e.paid.filter(x=>x!==pid); if(!all) e.paid.push(pid);});
  }else{
    const key=pid+'|'+k; if(S.paid[sec][key]) delete S.paid[sec][key]; else S.paid[sec][key]=true;
  }
}
function setPaid(sec,pid,k){
  if(sec==='misc') S.misc.filter(e=>e.date.startsWith(k)&&e.persons.includes(pid)&&!e.paid.includes(pid)).forEach(e=>e.paid.push(pid));
  else if(calc(sec,pid,[k]).soll>0) S.paid[sec][pid+'|'+k]=true;
}
function toggleEntry(eid,pid){const e=S.misc.find(x=>x.id===eid); if(!e) return; if(e.paid.includes(pid)) e.paid=e.paid.filter(x=>x!==pid); else e.paid.push(pid);}

function paypalUrl(amount){
  const u=S.paypal.trim().replace(/^https?:\/\/(www\.)?paypal\.me\//i,'').replace(/\/.*$/,'');
  return u?`https://www.paypal.me/${encodeURIComponent(u)}/${amount.toFixed(2)}EUR`:'';
}

/* ---------- Umfragen ---------- */
const isRsvp=e=>!!(e.poll&&e.poll.opts.length===3&&e.poll.opts[0]==='Ja'&&e.poll.opts[1]==='Nein');
function pollCounts(e){const n=e.poll.opts.map(()=>0); const pub=isPublic(); Object.entries(e.poll.votes||{}).forEach(([pid,i])=>{if(n[i]!=null&&(pub||pById(pid))) n[i]++}); return n;}
function pollSnapshot(e){
  const counts=pollCounts(e), names=e.poll.opts.map(()=>[]);
  Object.entries(e.poll.votes||{}).forEach(([pid,i])=>{const p=pById(pid); if(p&&names[i]) names[i].push(p.name);});
  names.forEach(l=>l.sort((a,b)=>a.localeCompare(b,'de')));
  return {id:uid(),evId:e.id,date:e.date,title:evTitle(e),type:e.type,q:e.poll.q,opts:[...e.poll.opts],counts,names,total:S.players.length,closed:TODAY};
}
function archivePoll(e){const snap=pollSnapshot(e); S.archive=S.archive.filter(a=>a.evId!==e.id); S.archive.push(snap);}
function voterLine(){
  const p=myPlayer();
  if(AUTH.mode==='live') return p?`<div class="pmeta">Du antwortest als <b style="color:var(--ink)">${esc(pname(p))}</b></div>`:'<div class="pmeta">Zum Abstimmen deinen persönlichen Spieler-Link öffnen.</div>';
  return `<label class="voter">Ich bin (Demo)<select class="voterSel"><option value="">Name wählen …</option>${sorted().map(x=>`<option value="${x.id}" ${p===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>`;
}
function pollBox(e,full){
  const p=e.poll; if(!p) return '';
  const counts=pollCounts(e), total=counts.reduce((a,b)=>a+b,0);
  const mp=myPlayer(), my=mp&&p.votes?p.votes[mp]:undefined;
  const canVote=p.open&&(AUTH.mode==='demo'||!!mp);
  const opts=p.opts.map((o,i)=>`<button class="vopt ${my===i?'mine':''}" data-act="vote" data-v="${e.id}" data-i="${i}" ${canVote?'':'disabled'}><span>${my===i?'✓ ':''}${esc(o)}</span><b>${counts[i]}</b><i style="width:${total?Math.round(counts[i]/total*100):0}%"></i></button>`).join('');
  let names='';
  if(ui.showNames===e.id){
    const voted=new Set(Object.keys(p.votes||{}));
    names=`<div class="names">${p.opts.map((o,i)=>{const l=sorted().filter(x=>p.votes[x.id]===i).map(x=>x.name); return `<div><b>${esc(o)} (${l.length}):</b> ${l.length?esc(l.join(', ')):'–'}</div>`;}).join('')}
      <div><b>Noch keine Antwort (${S.players.filter(x=>!voted.has(x.id)).length}):</b> ${esc(sorted().filter(x=>!voted.has(x.id)).map(x=>x.name).join(', '))||'–'}</div></div>`;
  }
  return `<div class="poll"><div class="pq">${esc(p.q)} ${p.open?'':'<span class="badge">beendet</span>'}</div>
    ${p.open?voterLine():''}
    <div class="vopts">${opts}</div>
    <div class="pmeta">${total} von ${S.players.length} haben geantwortet ·
      <button class="edit" data-act="pollNames" data-v="${e.id}">${ui.showNames===e.id?'Namen ausblenden':'Namen anzeigen'}</button>
      ${can('events')?(p.open?`<button class="edit" data-act="closePoll" data-v="${e.id}">Beenden &amp; speichern</button>`:`<button class="edit" data-act="reopenPoll" data-v="${e.id}">Wieder öffnen</button>`):''}</div>
    ${names}
    ${p.comments&&full?commentsBlock(e,'poll'):''}
    ${p.comments&&!full?`<div class="pmeta"><button class="edit" data-act="evOpen" data-v="${e.id}">💬 ${commentsOf(e.id,'poll').length} Kommentare zur Umfrage ›</button></div>`:''}</div>`;
}

function myAuthor(){const p=myPlayer(); if(p) return {p}; const a=me(); return a?{a:a.uid,an:a.name}:null;}

function lastDay(){return S.days.filter(d=>d.date!==ui.editKey).sort((a,b)=>b.date.localeCompare(a.date))[0]}
/* Reihenfolge der Auswahl: beim Getränketag nach Häufigkeit (letzte 6 Monate), sonst alphabetisch */
function pickOrder(){
  const ps=sorted();
  if(ui.tab!=='drinks'||ui.lineup) return ps;
  const from=shiftDate(TODAY,-183), cnt={};
  S.days.forEach(d=>{ if(d.date>=from&&d.date!==ui.editKey) d.att.forEach(id=>cnt[id]=(cnt[id]||0)+1); });
  return ps.map((p,i)=>({p,i,c:cnt[p.id]||0})).sort((a,b)=>b.c-a.c||a.i-b.i).map(x=>x.p);
}
const pickBtn=(p,r,tg)=>`<button class="pick" data-act="sel" data-id="${p.id}" data-r="${r}" data-n="${esc(p.name.toLowerCase())}" aria-pressed="${ui.sel.has(p.id)}"><span class="box">✓</span>${tg?`<span class="pw"><span class="pn">${esc(p.name)}</span><span class="tg">${esc(tg)}</span></span>`:`<span class="pn">${esc(p.name)}</span>`}</button>`;

function pickTags(){
  const t={}; if(!ui.shiftPick) return t;
  const e=S.events.find(x=>x.id===ui.evDetail);
  if(e) shiftsOf(e).forEach(s=>{if(s.id===ui.shiftPick) return; shiftWho(s).forEach(id=>{(t[id]=t[id]||[]).push(s.name+(s.from?' '+s.from:''));});});
  return Object.fromEntries(Object.entries(t).map(([k,v])=>[k,v.join(', ')]));
}

function countText(){
  const n=ui.sel.size, all=S.players.length;
  if(ui.lineup) return `${n} von ${all} im Kader<small>Danach Positionen zuordnen</small>`;
  if(ui.shiftPick){const e=S.events.find(x=>x.id===ui.evDetail), s=e&&shiftsOf(e).find(x=>x.id===ui.shiftPick), need=s?s.need:0;
    return `${n} eingeteilt${need?` von ${need}`:''}<small>${need&&n<need?`noch ${need-n} frei`:need&&n>need?`${n-need} mehr als benötigt`:'Für diese Aufgabe'}</small>`;}

/* ---------- Übersicht ---------- */
function evTitle(e){
  if(e.type==='game') return e.home?`Heimspiel gegen ${e.title}`:`Auswärts bei ${e.title}`;
  if(e.type==='training') return e.title||'Training';
  return e.title;
}
function mini(e){
  const [,m,d]=e.date.split('-'), g=e.type==='game';
  const lb=g?`Spiel · ${e.home?'Heim':'Auswärts'}`:ETYPE[e.type];
  const title=g?(e.home?`gegen ${e.title}`:`bei ${e.title}`):evTitle(e);
  const bits=[e.time?e.time+' Uhr':''];
  if(e.poll&&!(isPublic()&&e.type==='event')){const c=pollCounts(e); bits.push(isRsvp(e)?`<b>✓ ${c[0]}</b> · ✗ ${c[1]} · ? ${c[2]}`:`${c.reduce((a,b)=>a+b,0)} Antworten`);}
  else if(e.place) bits.push(esc(e.place));
  const sq=!isPublic()&&g&&e.squad&&e.squad.ids.length;
  const target=sq?`data-act="lineup" data-v="${e.id}"`:isPublic()?`data-act="goto" data-v="events"`:`data-act="evOpen" data-v="${e.id}"`;
  return `<button class="mini ${e.type==='training'?'tr':e.type==='event'?'evt':''}" ${target}>
    <span class="md"><b>${+d}</b><i>${wd(e.date)} · ${MONTHS[+m-1].slice(0,3)}</i></span>
    <span class="mt"><span class="ml">${lb}${sq?' · Aufstellung ›':''}</span><span class="mv">${esc(title)}</span><span class="ms">${bits.filter(Boolean).join(' · ')}</span></span></button>`;
}
function nextBlock(upcoming){
  const items=['game','training','event'].map(t=>upcoming.find(e=>e.type===t)).filter(Boolean);
  if(!items.length) return '';
  return `<div class="hd">Nächste Termine <span>antippen für Details</span></div><div class="minis" style="${secStyle('events')}">${items.map(mini).join('')}</div>`;
}
function mineCard(yr){
  const pid=myPlayer(); if(!pid) return '';
  const p=pById(pid), open=r2(MONEY.reduce((a,k)=>a+calc(k,pid,yr).open,0));
  const secs=S.order.filter(k=>calc(k,pid,yr).open>0);
  const url=open>0?paypalUrl(open):'', txt=`${p.name} ${secs.map(k=>SEC[k].label).join(' + ')} ${NOW.getFullYear()}`;
  return `<div class="mine">${nrBox(p)}<div><div class="lb">Dein Stand</div><div class="nm">${esc(p.name)}</div></div>
    <div class="amt" style="color:${open>0?'var(--due)':'var(--ok)'}">${open>0?eur(open):'✓ alles bezahlt'}</div>
    <div class="acts2">${url?`<a class="btn pp sm" href="${url}" target="_blank" rel="noopener">PayPal ${eur(open)}</a><button class="btn ghost sm" data-act="copy" data-v="${esc(txt)}">Verwendungszweck kopieren</button>`:''}
      <button class="btn ghost sm" data-act="person" data-id="${pid}">Details</button></div></div>`;
}
function myShifts(upcoming){
  const pid=myPlayer(); if(!pid||isPublic()) return '';
  const items=upcoming.flatMap(e=>shiftsOf(e).filter(s=>shiftWho(s).includes(pid)).sort(byFrom).map(s=>({e,s}))).slice(0,3);
  const open=!items.length&&upcoming.find(e=>e.date<=shiftDate(TODAY,45)&&e.shifts&&e.shifts.self&&shiftsOf(e).some(s=>s.need>shiftWho(s).length));
  if(open){const st=shiftStats(open); return `<button class="chip" data-act="shiftsOpen" data-v="${open.id}" style="justify-self:start">${esc(evTitle(open))}: noch ${st.need-st.got} Helfer gesucht ›</button>`;}
  if(!items.length) return '';
  return `<div class="hd">Deine Einteilung <span>antippen für Details</span></div><div class="minis" style="${secStyle('events')}">${items.map(({e,s})=>{const [,m,d]=e.date.split('-');
    return `<button class="mini evt" data-act="shiftsOpen" data-v="${e.id}"><span class="md"><b>${+d}</b><i>${wd(e.date)} · ${MONTHS[+m-1].slice(0,3)}</i></span>
      <span class="mt"><span class="ml">${esc(evTitle(e))}</span><span class="mv">${esc(s.name)}</span><span class="ms">${shiftTime(s)||'Uhrzeit folgt'}</span></span></button>`;}).join('')}</div>`;
}
function homeView(){
  const y=NOW.getFullYear(), yr=yearMonths(y), cm=[mk(y,NOW.getMonth())];
  const upcoming=S.events.filter(e=>e.date>=TODAY).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const tiles=S.order.map(k=>{
    const o=totalOpen(k,yr), s=totalSoll(k,yr), pct=s?Math.round((s-o)/s*100):100;
    return `<button class="k" data-act="goto" data-v="${k}" style="--c:${secHex(k)}">
      <span class="lb">${SEC[k].short}</span><span class="big">${eur(o)}</span>
      <span class="bar"><i style="width:${pct}%"></i></span><span class="s">${pct} % bezahlt</span></button>`;}).join('');
  const gesamt=r2(S.order.reduce((a,k)=>a+totalOpen(k,yr),0));
  const gesamtMonat=r2(S.order.reduce((a,k)=>a+totalOpen(k,cm),0));
  const debt=sorted().map(p=>{const parts=S.order.map(k=>({k,o:calc(k,p.id,yr).open})).filter(x=>x.o>0); return {p,parts,o:r2(parts.reduce((a,x)=>a+x.o,0))};})
    .filter(d=>d.o>0).sort((a,b)=>b.o-a.o);
  const shown=ui.allDebtors?debt:debt.slice(0,8);
  const ld=S.days.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];
  if(!seeAllAmounts()){
    return `${mineCard(yr)||'<div class="panel"><p class="hint">Die Beträge sind nur für den jeweiligen Spieler sichtbar. Öffne deinen persönlichen Link, um deinen Stand zu sehen.</p></div>'}
      ${nextBlock(upcoming)}${myShifts(upcoming)}
      <button class="chip" data-act="goto" data-v="roster" style="justify-self:start">Mannschaft ansehen ›</button>`;
  }
  if(!S.players.length&&isFull()) return `<div class="panel"><h2>Los geht's</h2><p class="hint">Trag unter Optionen die Spieler mit Spitznamen ein, wähle die Vereinsfarben und verschicke die Einladungen.</p><button class="btn" data-act="goto" data-v="settings" style="justify-self:start">Zu den Optionen</button></div>`;
  return `${mineCard(yr)}<div class="kassen">${tiles}</div>
    <div class="gesamt">
      <div><div class="lb">Gesamt offen · ${y} bis ${MONTHS[NOW.getMonth()]}</div><div class="big">${eur(gesamt)}</div></div>
      <div class="side"><div>${MONTHS[NOW.getMonth()]}: <b>${eur(gesamtMonat)}</b></div><div><b>${debt.length}</b> von ${S.players.length} offen</div></div>
    </div>
    ${nextBlock(upcoming)}${myShifts(upcoming)}
    <div class="hd">Noch offen <span>Name antippen für Details &amp; PayPal</span></div>
    ${debt.length?`<div class="plist">${shown.map(d=>`<button class="p" data-act="person" data-id="${d.p.id}">${nrBox(d.p)}
        <div class="n">${esc(d.p.name)}<div>${d.parts.map(x=>`<span class="dot" style="background:${secHex(x.k)}"></span>${SEC[x.k].short} ${eur(x.o)}`).join(' · ')}</div></div>
        <span class="v">${eur(d.o)}</span></button>`).join('')}</div>
      ${debt.length>8?`<button class="chip" data-act="allDebtors" style="justify-self:start">${ui.allDebtors?'Weniger anzeigen':`Alle ${debt.length} anzeigen`}</button>`:''}`
      :'<div class="panel"><p class="hint">Alle haben bezahlt.</p></div>'}
    ${can('drinks')&&ld?`<div class="panel" style="${secStyle('drinks')}"><div class="row spread"><div class="grow"><h3>Letzter Getränketag</h3><div style="font-weight:600;margin-top:4px">${wd(ld.date)}, ${fmtDate(ld.date)} · ${ld.att.length} Personen · ${eur(ld.att.length*S.rate)}</div></div>
      <button class="btn" data-act="quickDay">+ Getränketag</button></div></div>`:''}`;
}

/* ---------- Personenseite ---------- */
function personView(){
  const p=pById(ui.person); if(!p){ui.person=null;return homeView();}
  const y=ui.py, ms=yearMonths(y);
  const per=MONEY.map(k=>({k,...calc(k,p.id,ms)}));
  const total=r2(per.reduce((a,x)=>a+x.open,0));
  const openSecs=S.order.filter(k=>per.find(x=>x.k===k).open>0);
  const txt=`${p.name} ${openSecs.map(k=>SEC[k].label).join(' + ')||'Kasse'} ${y}`;
  const url=total>0?paypalUrl(total):'';
  const canAny=MONEY.some(k=>can(k));
  const secPanel=k=>{
    const c=per.find(x=>x.k===k);
    let rows='';
    if(k==='misc'){
      const es=S.misc.filter(e=>e.date.startsWith(String(y))&&e.persons.includes(p.id)).sort((a,b)=>b.date.localeCompare(a.date));
      rows=es.map(e=>{const pd=e.paid.includes(p.id); return `<div class="mrow"><div><div style="font-weight:600">${esc(e.title)}</div><div class="s">${fmtDate(e.date)}</div></div><span>${eur(e.amount)}</span>
        ${statusEl('misc',pd?'paid':'open',pd?'✓ bezahlt':'offen',`data-act="entryPaid" data-id="${p.id}" data-v="${e.id}"`)}</div>`;}).join('');
    }else{
      rows=ms.slice().reverse().map(mkey=>{const m=calc(k,p.id,[mkey]); if(!m.soll) return '';
        return `<div class="mrow"><div><div style="font-weight:600">${MONTHS[+mkey.slice(5)-1]}</div><div class="s">${k==='drinks'?esc(m.meta):'Beitrag'}</div></div><span>${eur(m.soll)}</span>
        ${statusEl(k,m.open===0?'paid':'open',m.open===0?'✓ bezahlt':'offen',`data-act="cell" data-sec="${k}" data-id="${p.id}" data-v="${mkey}"`)}</div>`;}).join('');
    }
    return `<div class="panel" style="${secStyle(k)};border-top:5px solid var(--sec)"><div class="row spread"><h2>${SEC[k].label}</h2><span style="font-weight:700;color:${c.open>0?'var(--due)':'var(--ok)'}">${c.open>0?eur(c.open)+' offen':'alles bezahlt'}</span></div>
      ${rows?`<div>${rows}</div>`:'<p class="hint">Keine Beträge in diesem Jahr.</p>'}</div>`;
  };
  return `<div class="panel">
      <button class="back" data-act="back">‹ Zurück</button>
      <div class="row" style="flex-wrap:nowrap;align-items:center">${nrBox(p)}<h2 style="font-size:26px;flex:1;min-width:0">${esc(p.name)}</h2></div>
      <div class="summary"><div><div class="lbl">Offen gesamt · ${y}</div><div class="big" style="color:${total>0?'var(--due)':'var(--ok)'}">${eur(total)}</div></div>
        <div class="period" style="margin-left:0"><button class="icon" data-act="pyPrev" aria-label="Vorjahr">‹</button><b style="min-width:60px">${y}</b><button class="icon" data-act="pyNext" aria-label="Folgejahr">›</button></div></div>
      ${total>0?`<div class="row tight">${url?`<a class="btn pp" href="${url}" target="_blank" rel="noopener">PayPal ${eur(total)}</a>`:''}
        <button class="btn ghost" data-act="copy" data-v="${esc(url?url+'\n'+txt:txt)}">${url?'Link + Text kopieren':'Text kopieren'}</button>
        ${canAny?(ui.confirmDel==='payall'?`<button class="btn danger" data-act="payAll">Ja, als bezahlt markieren</button><button class="btn ghost" data-act="noDel">Abbrechen</button>`:`<button class="btn ghost" data-act="askDel" data-v="payall">Alles als bezahlt markieren</button>`):''}</div>
        <p class="hint">Verwendungszweck: „${esc(txt)}“</p>`:''}
    </div>
    ${S.order.map(secPanel).join('')}`;
}

/* ---------- Kassenbereiche ---------- */
function drinksPanel(){
  const months=monthsInView(), adm=can('drinks');
  const days=S.days.filter(d=>months.includes(d.date.slice(0,7))).sort((a,b)=>b.date.localeCompare(a.date));
  const list=days.length?`<div class="entries">${days.map(d=>{
    const key='day:'+d.date, info=`${wd(d.date)}, ${fmtDate(d.date)}`;
    if(ui.confirmDel===key) return confirmBox(key,info,'Tag löschen?');
    const first=d.att.map(id=>pname(id)).sort((a,b)=>a.localeCompare(b,'de'));
    const shown=first.slice(0,6).join(', ')+(first.length>6?` +${first.length-6}`:'');
    const inner=`<div class="t">${info} · ${d.att.length} Pers. · ${eur(d.att.length*S.rate)}</div><div class="s">${esc(shown)}</div>`;
    return adm?`<div class="entry"><button class="info" data-act="editDay" data-v="${d.date}">${inner}</button>${entryTools('editDay',d.date,key,'Tag')}</div>`
      :`<div class="entry"><div class="info">${inner}</div></div>`;}).join('')}</div>`
    :`<p class="hint">Im Zeitraum ${periodLabel()} sind keine Tage erfasst.</p>`;
  if(!(ui.form&&adm)) return `<div class="panel">
      <div class="row spread"><div class="grow"><h2>Getränketage · ${periodLabel()}</h2><p class="hint">${eur(S.rate)} pro Person und Tag.</p></div>
      ${adm?'<button class="btn" data-act="openForm">+ Tag erfassen</button>':''}</div>${list}</div>`;
  const evOnDay=S.events.filter(e=>e.date===ui.date);
  return `<div class="panel form">
      <h2>${ui.editKey?'Getränketag bearbeiten':'Neuer Getränketag'}</h2>
      <div class="row tight" style="align-items:flex-end;flex-wrap:nowrap">
        <label class="f" style="flex:1">Datum<input type="date" id="fDate" value="${ui.date}"></label>
        <button class="btn ghost" data-act="today">Heute</button>
      </div>
      ${evOnDay.length?`<p class="hint">Termin an diesem Tag: ${evOnDay.map(e=>esc(evTitle(e))).join(', ')}</p>`:''}
      ${picker()}
      ${saveBar('saveDay')}
    </div>`;
}

function miscPanel(){
  const months=monthsInView(), adm=can('misc');
  const es=S.misc.filter(e=>months.includes(e.date.slice(0,7))).sort((a,b)=>b.date.localeCompare(a.date));
  const list=es.length?`<div class="entries">${es.map(e=>{
    const key='misc:'+e.id, info=`${esc(e.title)} · ${eur(e.amount)} p. P.`;
    if(ui.confirmDel===key) return confirmBox(key,info,'Posten löschen?');
    const inner=`<div class="t">${info}</div><div class="s">${fmtDate(e.date)} · ${e.persons.length} Personen · ${e.paid.length} bezahlt</div>`;
    return adm?`<div class="entry"><button class="info" data-act="editMisc" data-v="${e.id}">${inner}</button>${entryTools('editMisc',e.id,key,'Posten')}</div>`
      :`<div class="entry"><div class="info">${inner}</div></div>`;}).join('')}</div>`
    :`<p class="hint">Im Zeitraum ${periodLabel()} gibt es keine Posten.</p>`;
  if(!(ui.form&&adm)) return `<div class="panel">
      <div class="row spread"><div class="grow"><h2>Posten · ${periodLabel()}</h2><p class="hint">Zum Beispiel Mannschaftsfahrt, Geschenke oder Strafen.</p></div>
      ${adm?'<button class="btn" data-act="openForm">+ Posten erfassen</button>':''}</div>${list}</div>`;
  return `<div class="panel form">
      <h2>${ui.editKey?'Posten bearbeiten':'Neuer Posten'}</h2>
      <label class="f">Bezeichnung<input type="text" id="fTitle" value="${esc(ui.draft.title)}" placeholder="z. B. Mannschaftsfahrt"></label>
      <div class="row" style="flex-wrap:nowrap">
        <label class="f" style="flex:1">Betrag p. P. (€)<input type="number" id="fAmount" step="0.5" min="0" inputmode="decimal" value="${esc(ui.draft.amount)}" placeholder="0,00"></label>
        <label class="f" style="flex:1.3">Datum<input type="date" id="fDate" value="${ui.date}"></label>
      </div>
      ${picker()}
      ${saveBar('saveMisc')}
    </div>`;
}

function teamPanel(){
  return `<div class="panel"><h2>Monatsbeitrag ${eur(S.fee)}</h2>
    <p class="hint">${can('team')?'Zahlungen hakst du in der Liste oder Tabelle ab.':'Wer bezahlt hat und wer noch offen ist.'}</p></div>`;
}
function secHead(){
  return `<div class="sechead"><button class="back" data-act="goto" data-v="home">‹ Übersicht</button>
    <div class="seg wide" role="group" aria-label="Kasse wechseln">${S.order.map(k=>`<button data-act="goto" data-v="${k}" aria-pressed="${ui.tab===k}" style="--c:${secHex(k)}">${SEC[k].short}</button>`).join('')}</div></div>`;
}

function listPanel(sec){
  const months=monthsInView(), adm=can(sec);
  let rows=sorted().map(p=>({p,...calc(sec,p.id,months)})).filter(r=>r.soll>0||sec==='team');
  const open=rows.reduce((a,r)=>a+r.open,0), openN=rows.filter(r=>r.open>0).length, total=rows.length;
  if(ui.onlyOpen) rows=rows.filter(r=>r.open>0);
  const items=rows.map(r=>{
    const url=r.open>0?paypalUrl(r.open):'';
    const txt=purpose(sec,r.p.name);
    let acts='';
    if(r.open>0){
      if(url) acts+=`<a class="pill pp" href="${url}" target="_blank" rel="noopener">PayPal ${eur(r.open)}</a>`;
      acts+=`<button class="pill" data-act="copy" data-v="${esc(url?url+'\n'+txt:txt)}">${url?'Link + Text':'Text kopieren'}</button>`;
    }
    if(adm&&ui.mode==='month'&&r.soll>0) acts+= r.open>0?`<button class="pill mark" data-act="paid" data-id="${r.p.id}">Als bezahlt markieren</button>`:`<button class="pill paid" data-act="paid" data-id="${r.p.id}" title="Zurücksetzen">✓ bezahlt</button>`;
    else if(r.open===0&&r.soll>0) acts+=`<span class="pill paid">✓ bezahlt</span>`;
    if(r.open>0) acts+=`<span class="purpose">„${esc(txt)}“</span>`;
    return `<div class="item">
      <div style="min-width:0">${nameBtn(r.p)}<div class="meta">${esc(r.meta)}</div></div>
      <div class="nums"><div><small>Soll</small>${eur(r.soll)}</div><div><small>Bezahlt</small>${eur(r.paid)}</div><div><small>Offen</small><span class="${r.open>0?'open':'zero'}">${eur(r.open)}</span></div></div>
      ${acts?`<div class="acts">${acts}</div>`:''}
    </div>`;}).join('');
  return `<div class="panel">
    <div class="summary"><div><div class="lbl">Offen · ${periodLabel()}</div><div class="big">${eur(open)}</div></div>
      <button class="chip" data-act="onlyOpen" aria-pressed="${ui.onlyOpen}">Nur offene (${openN} von ${total})</button></div>
    ${periodBar()}
    ${rows.length?`<div class="list">${items}</div>`:`<p class="hint">${ui.onlyOpen?'Alle haben bezahlt.':`Für ${periodLabel()} fällt nichts an.`}</p>`}
  </div>`;
}

function monthTable(sec){
  const k=mk(ui.y,ui.m);
  let cols=[];
  if(sec==='drinks') cols=S.days.filter(d=>d.date.startsWith(k)).sort((a,b)=>a.date.localeCompare(b.date)).map(d=>({h:fmtShort(d.date),s:wd(d.date),d}));
  if(sec==='misc') cols=S.misc.filter(e=>e.date.startsWith(k)).sort((a,b)=>a.date.localeCompare(b.date)).map(e=>({h:e.title,s:eur(e.amount),e}));
  const all=sorted().map(p=>({p,...calc(sec,p.id,[k])}));
  const withSoll=all.filter(r=>r.soll>0||sec==='team');
  const hidden=all.length-withSoll.length;
  const sumSoll=withSoll.reduce((a,r)=>a+r.soll,0), sumOpen=r2(withSoll.reduce((a,r)=>a+r.open,0));
  const colCount=cols.map(()=>0);
  withSoll.forEach(r=>cols.forEach((c,i)=>{if(c.d?c.d.att.includes(r.p.id):c.e.persons.includes(r.p.id)) colCount[i]++;}));
  const rows=(ui.onlyOpen?withSoll.filter(r=>r.open>0):withSoll).map(r=>{
    const cells=cols.map(c=>{
      if(c.d) return `<td>${c.d.att.includes(r.p.id)?'<span class="on">●</span>':'<span class="dash">·</span>'}</td>`;
      if(!c.e.persons.includes(r.p.id)) return `<td><span class="dash">–</span></td>`;
      const pd=c.e.paid.includes(r.p.id);
      return `<td>${statusEl('misc',pd?'paid':'open',num(c.e.amount),`data-act="entryPaid" data-id="${r.p.id}" data-v="${c.e.id}"`)}</td>`;
    }).join('');
    const url=r.open>0?paypalUrl(r.open):'';
    return `<tr><td class="nm">${nameBtn(r.p)}</td>${cells}<td class="sep">${num(r.soll)}</td>
      <td class="tot">${r.open>0?`<span style="color:var(--due)">${num(r.open)}</span>${url?`<a href="${url}" target="_blank" rel="noopener">PayPal</a>`:''}`:`<span style="color:var(--ok)">0,00</span>`}</td>
      <td>${r.soll>0?statusEl(sec,r.open===0?'paid':'open',r.open===0?'✓ bezahlt':'offen',`data-act="cell" data-id="${r.p.id}" data-v="${k}"`):'–'}</td></tr>`;
  }).join('');
  const emptyMsg=sec==='drinks'?'Keine Getränketage':'Keine Posten';
  return `<div class="panel">
    <div class="summary"><div><div class="lbl">Offen · ${periodLabel()}</div><div class="big">${eur(sumOpen)}</div></div>
      <button class="chip" data-act="onlyOpen" aria-pressed="${ui.onlyOpen}">Nur offene</button></div>
    ${periodBar()}
    ${sec!=='team'&&!cols.length?`<p class="hint">${emptyMsg} im ${periodLabel()}.</p>`:`
    <div class="tablewrap"><table class="grid">
      <thead><tr><th class="nm">Name</th>${cols.map(c=>`<th class="ent" title="${esc(c.h)}">${esc(c.h)}<small>${esc(c.s)}</small></th>`).join('')}<th class="sep">Soll</th><th class="tot">Offen</th><th>Status</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td class="nm">${sec==='drinks'?'Personen':sec==='misc'?'Beteiligt':'Summe'}</td>${colCount.map(n=>`<td>${n}</td>`).join('')}<td class="sep">${num(sumSoll)}</td><td class="tot" style="color:var(--due)">${num(sumOpen)}</td><td></td></tr></tfoot>
    </table></div>
    <div class="legend">${sec==='drinks'?'<span><span class="on">●</span> anwesend</span>':''}${can(sec)?'<span>Status antippen = bezahlt/offen</span>':''}${hidden?`<span>${hidden} Personen ohne Betrag ausgeblendet</span>`:''}</div>`}
  </div>`;
}

function yearTable(sec){
  const y=ui.y, last=lastDueMonth(y), cur=(y===NOW.getFullYear())?NOW.getMonth():-1;
  const ms=Array.from({length:12},(_,i)=>mk(y,i));

      if(c.soll===0) return `<td><span class="dash">–</span></td>`;
      if(i<=last) rowOpen+=c.open;
      const cls=c.open===0?'paid':(i>last?'future':'open');
      return `<td>${statusEl(sec,cls,num(c.soll),`data-act="cell" data-id="${p.id}" data-v="${k}"`)}</td>`;

  return `<div class="panel">
    <div class="summary"><div><div class="lbl">Offen · ${y}${last>=0&&last<11?` bis ${MONTHS[last]}`:''}</div><div class="big">${eur(grand)}</div></div>

    ${periodBar()}
    <div class="tablewrap"><table class="grid">
      <thead><tr><th class="nm">Name</th>${MONTHS.map((m,i)=>`<th class="${i===cur?'now':''}">${m.slice(0,3)}</th>`).join('')}<th class="tot sep">Offen</th></tr></thead>
      <tbody>${body}</tbody><tfoot>${foot}</tfoot></table></div>
    <div class="legend"><span><i style="background:var(--ok-bg);border:1px solid var(--ok)"></i>bezahlt</span><span><i style="background:var(--due-bg);border:1px solid var(--due)"></i>offen</span><span><i style="border:1px solid var(--line)"></i>noch nicht fällig</span></div>
  </div>`;
}

const SHIFT_PRESETS=['Aufbau','Abbau','Bierstand','Grill','Kasse','Kuchen','Küche','Fahrdienst','Aufräumen'];

function lineupView(){
  const e=S.events.find(x=>x.id===ui.lineup); if(!e){ui.lineup=null;return eventsView();}
  const adm=can('events');
  const sq=e.squad||{ids:[],formation:'4-4-2',slots:{}};
  const free=isFree(sq), ids=sq.ids.filter(pById), pos=free?[]:(FORMS[sq.formation]||FORMS['4-4-2']);
  const slotOf=i=>{const id=(sq.slots||{})[i]; return id&&ids.includes(id)?pById(id):null;};
  const starters=new Set(free?starterIds(sq).filter(pById):pos.map((_,i)=>slotOf(i)).filter(Boolean).map(p=>p.id));
  if(!starters.has(ui.freeSel)) ui.freeSel=null;
  const bench=ids.map(pById).filter(p=>!starters.has(p.id)).sort((a,b)=>a.name.localeCompare(b.name,'de'));
  const head=`<div class="panel" style="${secStyle('events')}">
    <button class="back" data-act="lineupBack">‹ Termine</button>
    <div><h2>${esc(evTitle(e))}</h2><p class="hint">${wd(e.date)}, ${fmtDate(e.date)}${e.time?' · '+e.time+' Uhr':''}${e.place?' · '+esc(e.place):''}</p></div>
  </div>`;
  if(ui.form&&adm) return head+`<div class="panel form" style="${secStyle('events')}"><h2>Kader festlegen</h2>${picker()}${saveBar('saveSquad')}</div>`;
  const lines='<span class="pl half"></span><span class="pl circ"></span><span class="pl boxt"></span><span class="pl boxb"></span>';
  const freeEdit=free&&adm&&!!ui.freeEditing;
  const pitch=free?`<div class="pitch ${freeEdit?'freeedit':''}" id="fPitch" data-grid="${gridOf(sq)}" ${freeEdit?'':'role="img" aria-label="Freie Aufstellung"'}>${lines}
    ${freeEdit?gridCells(gridOf(sq)).map(z=>`<i class="gp" style="left:${z.x}%;top:${z.y}%"></i>`).join(''):''}
    ${[...starters].map(id=>{const p=pById(id), c=sq.free[id]; return `<div class="pos ${freeEdit?'drag':''} ${ui.freeSel===id?'sel':''}" data-pid="${id}" style="left:${c.x}%;top:${c.y}%">

  </div>`:`<div class="pitch" role="img" aria-label="Aufstellung ${esc(sq.formation)}">
    ${lines}
    ${pos.map(([code,x,y],i)=>{const p=slotOf(i); return `<div class="pos" style="left:${x}%;top:${y}%">
      <span class="dp ${p?'':'empty'}">${p?esc(p.nr||initials(p.name)):''}</span>
      <span class="pn">${p?esc(p.name):'–'}</span><span class="pr">${code}</span></div>`;}).join('')}
  </div>`;
  const editor=adm?`<div class="panel" style="${secStyle('events')}">
      <div class="row spread"><h2>Aufstellung bearbeiten</h2><button class="btn ghost sm" data-act="editSquad">Kader ändern (${ids.length})</button></div>
      <label class="f" style="max-width:280px">Spielsystem<select id="lFormation">${Object.keys(FORMS).map(f=>`<option ${f===sq.formation?'selected':''}>${f}</option>`).join('')}<option value="${FREE}" ${free?'selected':''}>Frei – selbst positionieren</option></select></label>
      ${free?`<label class="f" style="max-width:280px">Raster<select id="lGrid">${Object.entries(GRIDS).map(([k,l])=>`<option value="${k}" ${+k===gridOf(sq)?'selected':''}>${l}</option>`).join('')}</select></label>
        <p class="hint">${gridOf(sq)?'Mit Raster rasten die Spieler auf dem nächsten Punkt ein – so stehen Reihen gerade und symmetrisch. Ziehst du jemanden auf einen besetzten Punkt, tauschen beide die Plätze. ':''}Spieler auf dem Feld mit dem Finger an die gewünschte Stelle ziehen. Aus der Ersatzbank antippen, um jemanden aufs Feld zu holen. Zum Herausnehmen antippen und „Auf die Bank“ wählen oder vom Feld ziehen.</p>
        ${starters.size?'<button class="edit" style="justify-self:start" data-act="freeClear">Alle auf die Bank</button>':''}`
      :ids.length?`<div class="slots">${pos.map(([code],i)=>{const cur=slotOf(i); return `<label class="slot"><b>${code}</b><select data-slot="${i}" aria-label="Position ${code}">
        <option value="">– frei –</option>${ids.map(pById).sort((a,b)=>a.name.localeCompare(b.name,'de')).map(p=>`<option value="${p.id}" ${cur&&cur.id===p.id?'selected':''}>${p.nr?p.nr+' · ':''}${esc(p.name)}${starters.has(p.id)&&!(cur&&cur.id===p.id)?' (gesetzt)':''}</option>`).join('')}</select></label>`;}).join('')}</div>
      <p class="hint">Wer schon auf einer Position steht und neu zugeordnet wird, wechselt automatisch dorthin.</p>`:'<p class="hint">Lege zuerst den Kader fest.</p>'}
      ${ui.confirmDel==='squad'?confirmBox('squad:'+e.id,'Kader und Aufstellung','Entfernen?','Entfernen'):(ids.length?'<button class="edit" style="justify-self:start" data-act="askDel" data-v="squad">Kader und Aufstellung entfernen</button>':'')}

      <div class="row spread"><h2>Aufstellung · ${free?'Frei':esc(sq.formation)}</h2><span class="hint">${free?`${starters.size} auf dem Feld${starters.size>11?' (mehr als 11)':''}`:`${starters.size} von ${pos.length}`}</span></div>

        :free&&adm&&ids.length?`<div class="freebar"><span class="hint">So sehen es die Spieler.</span><button class="btn sm" data-act="freeEditOn">Positionen bearbeiten</button></div>`:''}
      ${ids.length?`<h3>Ersatzbank · ${bench.length}</h3>${bench.length?`<div class="bench">${bench.map(p=>freeEdit?`<button data-act="freeAdd" data-id="${p.id}" aria-label="${esc(p.name)} aufs Feld">${nrBox(p)}${esc(p.name)} <b aria-hidden="true">+</b></button>`:`<span>${nrBox(p)}${esc(p.name)}</span>`).join('')}</div>`:'<p class="hint">Keine Ersatzspieler.</p>'}
        <h3>Kader · ${ids.length}</h3><p class="hint" style="color:var(--ink)">${esc(ids.map(pById).sort((a,b)=>a.name.localeCompare(b.name,'de')).map(p=>(p.nr?p.nr+' ':'')+p.name).join(' · '))}</p>`:''}
    </div>${editor}`;
}

function readRights(){
  const role=(document.querySelector('input[name="mRole"]:checked')||{}).value||'full';
  const areas=[...document.querySelectorAll('input[name="mArea"]:checked')].map(x=>x.value);
  return {role,areas};
}
const AUTH_ERR={'auth/invalid-credential':'E-Mail oder Passwort falsch.','auth/wrong-password':'E-Mail oder Passwort falsch.','auth/user-not-found':'E-Mail oder Passwort falsch.',
  'auth/email-already-in-use':'Für diese E-Mail gibt es schon ein Konto – bitte anmelden.','auth/weak-password':'Das Passwort ist zu schwach.',
  'auth/invalid-email':'Die E-Mail-Adresse ist ungültig.','auth/too-many-requests':'Zu viele Versuche. Bitte später erneut versuchen.','auth/network-request-failed':'Keine Verbindung.'};
async function claimAdmin(){
  const u=FB.auth.currentUser; if(!u||u.isAnonymous) return 'login';
  const a=await FB.getDoc(D('admins',u.uid)).catch(()=>null); if(a&&a.exists()) return 'ok';
  const setup=await FB.getDoc(D('meta','setup')).catch(()=>null);
  if(setup&&!setup.exists()) return 'setup';
  const email=(u.email||'').toLowerCase();
  const inv=await FB.getDoc(D('invites',email)).catch(()=>null);
  if(!inv||!inv.exists()) return 'noinvite';
  if(!u.emailVerified) return 'verify';
  const d=inv.data(); const b=FB.writeBatch(FB.db);
  b.set(D('admins',u.uid),{name:d.name,role:d.role,areas:d.areas||[],email});
  b.delete(D('invites',email)); await b.commit(); return 'ok';
}
async function afterClaim(r){
  const m=ui.modal;
  if(r==='ok'){ ui.modal=null; renderModal(); await refreshAccess(FB.auth.currentUser); ui.adminView=true; render(); logAction('Angemeldet'); toast(`Admin-Ansicht: ${AUTH.admin?AUTH.admin.name:''}`); return; }
  m.step=r; m.err=''; m.busy=false;
  if(r==='verify'){ try{await FB.sendEmailVerification(FB.auth.currentUser);}catch(e){} }
  renderModal();
}
async function submitModal(){
  const m=ui.modal; if(!m||m.busy) return;
  const v=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
  const fail=t=>{m.err=t;m.busy=false;renderModal();};
  m.err=''; m.info='';
  try{
    if(m.kind==='code'){ ui.modal=null; renderModal(); return enterCode(v('gateCode')); }
    if(m.kind==='demo'){ ui.demoAdmin=v('mDemo'); ui.adminView=true; ui.modal=null; renderModal(); render(); toast(`Admin-Ansicht: ${me().name}`); return; }
    if(m.kind==='login'){
      const st=m.step||'login'; m.email=v('mEmail').toLowerCase()||m.email;
      if(st==='login'){ m.busy=true; renderModal(); await FB.signInWithEmailAndPassword(FB.auth,m.email,document.getElementById('mPw')?document.getElementById('mPw').value:''); return afterClaim(await claimAdmin()); }
      if(st==='register'){
        const pw=document.getElementById('mPw').value, pw2=document.getElementById('mPw2').value;
        if(pw.length<8) return fail('Das Passwort braucht mindestens 8 Zeichen.');
        if(pw!==pw2) return fail('Die Passwörter sind nicht gleich.');
        m.busy=true; renderModal(); await FB.createUserWithEmailAndPassword(FB.auth,m.email,pw); return afterClaim(await claimAdmin());
      }
      if(st==='reset'){ m.busy=true; renderModal(); await FB.sendPasswordResetEmail(FB.auth,m.email); m.busy=false; m.info='Falls ein Konto existiert, ist der Link unterwegs.'; m.step='login'; renderModal(); return; }
      if(st==='verify'){ m.busy=true; renderModal(); await FB.auth.currentUser.reload(); await FB.auth.currentUser.getIdToken(true);
        if(!FB.auth.currentUser.emailVerified) return fail('Noch nicht bestätigt. Bitte den Link in der E-Mail öffnen.'); return afterClaim(await claimAdmin()); }
      if(st==='setup'){ const name=v('mName'); if(!name) return fail('Bitte einen Namen eingeben.'); m.busy=true; renderModal();
        const u=FB.auth.currentUser, b=FB.writeBatch(FB.db);
        b.set(D('meta','setup'),{owner:u.uid}); b.set(D('admins',u.uid),{name,role:'full',areas:[],email:(u.email||'').toLowerCase()});
        await b.commit(); return afterClaim('ok'); }
      if(st==='noinvite'){ m.busy=true; renderModal(); return afterClaim(await claimAdmin()); }
    }
    if(m.kind==='invite'){
      const name=v('mName'), email=v('mEmail').toLowerCase(), r=readRights();
      if(!name) return fail('Bitte einen Namen eingeben.');
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return fail('Bitte eine gültige E-Mail eingeben.');
      if(r.role==='part'&&!r.areas.length) return fail('Bitte mindestens einen Bereich wählen.');
      if(LIVE.admins.length+LIVE.invites.length>=4) return fail('Es gibt bereits 4 Admins oder Einladungen.');
      m.busy=true; renderModal();
      await FB.setDoc(D('invites',email),{name,role:r.role,areas:r.role==='part'?r.areas:[]});
      logAction(`Admin ${name} eingeladen`); ui.modal=null; renderModal(); toast('Einladung angelegt'); return;
    }
    if(m.kind==='rights'){
      const a=adminList().find(x=>x.uid===m.who); const r=readRights();
      if(r.role==='part'&&a.role!=='part'&&fullCount()<=1) return fail('Mindestens ein Admin muss alle Rechte behalten.');
      if(r.role==='part'&&!r.areas.length) return fail('Bitte mindestens einen Bereich wählen.');
      m.busy=true; renderModal();
      await FB.setDoc(D('admins',a.uid),{role:r.role,areas:r.role==='part'?r.areas:[]},{merge:true});
      logAction(`Rechte von ${a.name} geändert`); ui.modal=null; renderModal(); toast('Rechte gespeichert'); return;
    }
  }catch(e){ console.warn(e); fail(AUTH_ERR[e&&e.code]||(e&&e.code==='permission-denied'?'Keine Berechtigung.':'Das hat nicht geklappt. Bitte erneut versuchen.')); }
}

/* ---------- Rendern ---------- */
function publicView(){
  const upcoming=S.events.filter(e=>e.date>=TODAY).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const bar=`<div class="pubbar"><span>Öffentliche Ansicht<small>Nur Termine. Spieler sehen mehr mit ihrem persönlichen Code.</small></span>
    ${AUTH.mode==='demo'?'<button class="btn ghost sm" data-act="demoPublicEnd">Vorschau beenden</button>':'<button class="btn sm" data-act="codeModal">Code eingeben</button>'}</div>`;
  if(ui.tab==='events') return bar+eventsView();
  return bar+(nextBlock(upcoming)||'<div class="panel"><p class="hint">Keine kommenden Termine.</p></div>');
}
function render(){
  if(!isFull()&&ui.tab==='settings') ui.tab='home';
  if(isPublic()&&!['home','events'].includes(ui.tab)) ui.tab='home';
  if(MONEY.includes(ui.tab)&&!seeAllAmounts()) ui.tab='home';
  if(ui.person&&!seeAllAmounts()&&ui.person!==myPlayer()) ui.person=null;
  if(isPublic()){ui.person=null;ui.lineup=null;ui.evDetail=null;}
  if(ui.form&&!can(ui.lineup||ui.evDetail?'events':ui.tab)) closeForm();
  const v=document.getElementById('view');
  if(AUTH.mode==='live'&&(!AUTH.ready||AUTH.gate)){ v.innerHTML=gateView(); renderChrome(); return; }
  if(isPublic()){ v.setAttribute('style',secStyle('events')); v.innerHTML=publicView(); renderChrome(); return; }
  const note=AUTH.mode==='demo'?`<div class="demo">Demo-Modus: Beispieldaten nur auf diesem Gerät.${!me()?` <label class="voter" style="margin-top:6px">Ansicht als<select class="voterSel"><option value="">Besucher mit Code (kein Spieler)</option>${sorted().map(x=>`<option value="${x.id}" ${myPlayer()===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>`:''}</div>`:'';
  const bar=isAdmin()?`<div class="adminbar"><span>Admin-Ansicht · ${esc(me().name)}<small>${esc(rightsText(me()))}</small></span><span class="row tight"><button class="btn ghost sm" data-act="readMode">Lesemodus</button>${AUTH.mode==='live'?'<button class="btn ghost sm" data-act="signOut">Abmelden</button>':''}</span></div>`:'';
  v.setAttribute('style',secStyle(ui.person?'home':((ui.lineup||ui.evDetail)?'events':(['settings','roster'].includes(ui.tab)?'team':ui.tab))));
  let html;
  if(ui.lineup) html=lineupView();
  else if(ui.person) html=personView();
  else if(ui.tab==='settings') html=settings();
  else if(ui.tab==='home') html=note+homeView();
  else if(ui.tab==='events') html=eventsView();
  else if(ui.tab==='roster') html=teamView();
  else{
    const top=ui.tab==='drinks'?drinksPanel():ui.tab==='misc'?miscPanel():teamPanel();
    const bottom=ui.view==='table'?(ui.mode==='month'?monthTable(ui.tab):yearTable(ui.tab)):listPanel(ui.tab);
    html=(ui.form?'':secHead())+top+(ui.form?'':bottom);
  }
  v.innerHTML=bar+html;
  renderChrome();

function saveEvent(){
  const f=ui.ev, t=f.type, title=f.title.trim();
  if(!ui.date) return toast('Bitte ein Datum wählen');
  if(t!=='training'&&!title) return toast(t==='game'?'Bitte den Gegner eintragen':'Bitte eine Bezeichnung eintragen');
  let poll=null;
  if(f.poll){
    if(f.ptype==='rsvp') poll={q:RSVPQ[t],opts:[...RSVP]};
    else{
      const opts=f.popts.split('\n').map(s=>s.trim()).filter(Boolean);
      if(!f.pq.trim()) return toast('Bitte die Frage eintragen');
      if(opts.length<2||opts.length>6) return toast('Bitte 2 bis 6 Antworten eintragen');
      poll={q:f.pq.trim(),opts};
    }
  }
  if(poll) poll.comments=!!f.pcomments;
  const base={type:t,time:f.time,title,home:f.home,place:f.place.trim(),note:f.note.trim(),comments:!!f.comments};
  let n=1;
  if(ui.editKey){
    const e=S.events.find(x=>x.id===ui.editKey); const old=e.poll;
    Object.assign(e,base,{date:ui.date});
    if(t!=='game') delete e.squad;
    if(!poll){ if(old&&Object.keys(old.votes||{}).length) archivePoll({...e,poll:old}); delete e.poll; }
    else if(old&&old.q===poll.q&&JSON.stringify(old.opts)===JSON.stringify(poll.opts)){ e.poll=old; e.poll.comments=poll.comments; }
    else e.poll={...poll,votes:{},open:true};
  }else{
    n=t==='training'&&f.repeat?Math.min(40,Math.max(2,parseInt(f.weeks)||2)):1;
    for(let i=0;i<n;i++) S.events.push({id:uid(),...base,date:shiftDate(ui.date,i*7),...(poll?{poll:{...poll,opts:[...poll.opts],votes:{},open:true}}:{})});
  }
  closeForm(); commit(); toast(n>1?`${n} Trainings angelegt`:'Termin gespeichert');
}
async function doVote(e,i){
  const p=myPlayer();
  if(!p){ toast(AUTH.mode==='live'?'Zum Abstimmen deinen persönlichen Spieler-Link öffnen':'Bitte zuerst deinen Namen wählen'); return; }
  e.poll.votes=e.poll.votes||{};

    catch(err){ console.warn(err); toast('Antwort konnte nicht gespeichert werden'); buildS(); render(); }
  }else save();
}

async function doShift(e,s,join){

  if(!p){ toast(AUTH.mode==='live'?'Zum Eintragen deinen persönlichen Spieler-Link öffnen':'Bitte oben zuerst deinen Namen wählen'); return; }

document.addEventListener('pointerdown',ev=>{
  const d=ev.target.closest('#fPitch.freeedit .pos.drag'); if(!d||!can('events')) return;
  const pitch=document.getElementById('fPitch'); ev.preventDefault();
  const st={id:d.dataset.pid,x0:ev.clientX,y0:ev.clientY,moved:false,out:false};
  try{d.setPointerCapture(ev.pointerId)}catch(e){}
  d.classList.add('dragging');
  const mv=e=>{
    if(!st.moved&&Math.hypot(e.clientX-st.x0,e.clientY-st.y0)<6) return; st.moved=true;
    const r=pitch.getBoundingClientRect();
    const g=snapTo(+pitch.dataset.grid||0,Math.max(4,Math.min(96,(e.clientX-r.left)/r.width*100)),Math.max(4,Math.min(96,(e.clientY-r.top)/r.height*100)));
    st.x=g.x; st.y=g.y; d.style.left=st.x+'%'; d.style.top=st.y+'%';
    st.out=e.clientX<r.left-12||e.clientX>r.right+12||e.clientY<r.top-12||e.clientY>r.bottom+12; d.classList.toggle('out',st.out);
  };
  const up=()=>{
    d.removeEventListener('pointermove',mv); d.removeEventListener('pointerup',up); d.removeEventListener('pointercancel',up); d.classList.remove('dragging');
    const e=S.events.find(x=>x.id===ui.lineup); if(!e||!e.squad) return; const sq=e.squad; sq.free=sq.free||{};
    if(!st.moved){ ui.freeSel=ui.freeSel===st.id?null:st.id; render(); return; }
    if(st.out){ delete sq.free[st.id]; ui.freeSel=null; commit(); toast(`${pname(st.id)} auf der Bank`); return; }
    const to={x:st.x,y:st.y}, from=sq.free[st.id];
    if(gridOf(sq)){ const other=Object.keys(sq.free).find(k=>k!==st.id&&samePos(sq.free[k],to)); if(other&&from) sq.free[other]={...from}; }
    sq.free[st.id]=to; ui.freeSel=null; commit();
  };
  d.addEventListener('pointermove',mv); d.addEventListener('pointerup',up); d.addEventListener('pointercancel',up);
});
